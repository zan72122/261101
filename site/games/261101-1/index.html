<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141a3c">
<title>びよーん！ドットピザのひみつ遊園地</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#141a3c;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none;
  image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
/* =========================================================
   びよーん！ドットピザのひみつ遊園地
   一本指: つまみを引く→生地が広がりドットが細かくなる→絵が見つかる
           生地の真ん中を窯へ→焼くと遊具になる→空き地へ置いて道/橋でつなぐ
           限界まで引くと一粒に→粒をタップで中の新しい遊園地へ
   ========================================================= */

// ---------- palette (16) ----------
const PAL=['#141a3c','#0b0f26','#26306a','#3a4790','#fff1c9','#e8cf98','#ff9fb2','#e0607e',
           '#ffd84a','#f0a830','#8fe0ff','#4aa8d8','#ffffff','#b8743c','#6b3f24','#7a86c8'];
const PU32=new Uint32Array(16);
PAL.forEach((h,i)=>{const r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  PU32[i]=((255<<24)|(b<<16)|(g<<8)|r)>>>0;});
const THEMES=[{g:3,d:15,e:2},{g:2,d:11,e:3},{g:3,d:7,e:2}];

const TAU=Math.PI*2, N=48, R0=18;
const DIRA=[Math.PI,-Math.PI/2,0,Math.PI/2]; // L U R D
const DV=[[-1,0],[0,-1],[1,0],[0,1]];
const LV=[0,10,26,46];
const RES=[4,8,16,32];
const MAXP=90;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const backOut=t=>{t=clamp(t,0,1);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const hyp=Math.hypot;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function hash(i,j,s){let h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)+Math.imul(s|0,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const rnd=Math.random;

// ---------- canvas ----------
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const lc=document.createElement('canvas');
const lx=lc.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=48;tmp.height=48;
const tctx=tmp.getContext('2d');
let C=lx, curC=-1;
let W=200,H=400,S=2,DPR=1,CW=400,CH=800;
const ins={t:0,b:0,l:0,r:0};
const L={};
let stars=[];

function setCtx(c){C=c;curC=-1;}
function col(c){if(c!==curC){C.fillStyle=PAL[c];curC=c;}}
function px(x,y,c){col(c);C.fillRect(Math.floor(x),Math.floor(y),1,1);}
function rect(x,y,w,h,c){if(w<=0||h<=0)return;col(c);C.fillRect(Math.floor(x),Math.floor(y),Math.round(w),Math.round(h));}
function line(x0,y0,x1,y1,c,per,on){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy,i=0,n=0;
  per=per||1;on=on||1;
  while(true){if(i%per<on)px(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*err;
    if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}i++;if(++n>800)break;}
}
function circle(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);let x=Math.round(r),y=0,e=1-x;
  while(x>=y){px(cx+x,cy+y,c);px(cx+y,cy+x,c);px(cx-y,cy+x,c);px(cx-x,cy+y,c);
    px(cx-x,cy-y,c);px(cx-y,cy-x,c);px(cx+y,cy-x,c);px(cx+x,cy-y,c);y++;
    if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1;}}}

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function buildSprite(w,h,fn,noOutline){
  const g=new Int8Array(w*h).fill(-1);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=fn(x,y);if(v!=null&&v>=0)g[y*w+x]=v;}
  const o=g.slice();
  if(!noOutline){const f=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&g[y*w+x]>=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y*w+x]<0&&(f(x-1,y)||f(x+1,y)||f(x,y-1)||f(x,y+1)))o[y*w+x]=1;}}
  const c=mk(w,h),cc=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=o[y*w+x];if(v>=0){cc.fillStyle=PAL[v];cc.fillRect(x,y,1,1);}}
  c.mask=o;return c;
}

// ---------- sprites ----------
function lhFn(lit){return (x,y)=>{const a=Math.abs(x-8);
  if(y===1)return a===0?7:-1;
  if(y>=2&&y<=4)return a<=y-1?7:-1;
  if(y>=5&&y<=8){if(a<=3){if(a===3)return 15;return (lit&&a<=1&&(y===6||y===7))?12:8;}return -1;}
  if(y===9)return a<=5?5:-1;
  if(y===10)return a<=4?14:-1;
  if(y>=11&&y<=30){const half=3+Math.floor((y-11)/7);if(a<=half){if(a===0&&(y===15||y===22))return 2;
      if(y>=27&&a<=1)return 14;return ((y-11)>>2)&1?4:7;}return -1;}
  if(y===31)return a<=6?15:-1;return -1;};}
const SPR={};
function rkFn(x,y){const a=Math.abs(x-7);
  if(y>=1&&y<=6){const half=[0,0,0,1,2,2,3][y];return a<=half?7:-1;}
  if(y>=7&&y<=19){const half=(y<=8||y>=18)?3:4;if(a<=half){const dx=x-7,dy=y-11,rr=dx*dx+dy*dy;
      if(rr<=4)return (dx===-1&&dy===-1)?12:10;if(rr<=8)return 11;if(y===16)return 6;return 12;}}
  if((a===4&&y>=18&&y<=22)||(a===5&&y>=16&&y<=22)||(a===6&&y>=19&&y<=22))return 7;
  if(y>=20&&y<=21&&a<=2)return 15;return -1;}
function stFn(rich){return (x,y)=>{const a=Math.abs(x-13),dx=x-13,dy=y-4,rr=dx*dx+dy*dy;
  if(rr<=12){if(rr>=7)return 13;const tp=rich?((x+y)%3===0):((x===12&&y===3)||(x===14&&y===5));return tp?7:8;}
  if(y===8&&a===0)return 14;
  if(y>=9&&y<=12){if(a<=11){if(y===12&&(x%3)===2)return -1;return (Math.floor(x/3)%2)?6:4;}return -1;}
  if(y>=13&&y<=20&&(x===3||x===23))return 14;
  if(y===15&&x>=4&&x<=22)return 5;
  if(y>=16&&y<=20&&x>=4&&x<=22)return (y===18&&x%4===1)?(rich?8:6):13;
  if(y===21&&a<=11)return 15;return -1;};}
function ovFn(x,y){const dx=x-22;
  if(x>=31&&x<=35&&y>=1&&y<=8)return y===1?15:3;
  let inside=false;if(y<=20&&y>=2){const ex=dx/20,ey=(y-20)/18;inside=ex*ex+ey*ey<=1;}else if(y>20&&y<=32)inside=x>=2&&x<=42;
  if(!inside)return (y===33&&x>=1&&x<=43)?15:-1;
  const mx=dx/9,my=(y-27)/9,m=mx*mx+my*my;
  if(y>=19&&y<=32&&m<=1)return 1;
  if(y>=17&&y<=32&&m<=1.45)return 5;
  if(y<=6&&Math.abs(dx)<=8&&y>=3)return 9;
  const row=Math.floor(y/4);return ((y%4===0)||((x+row*3)%7===0))?14:13;}
function handFn(x,y){
  if(x>=3&&x<=4&&y>=1&&y<=8)return (y===1&&x===4)?5:4;
  if(x>=2&&x<=9&&y>=7&&y<=13){if((x===9&&y===7)||(x===2&&y===13)||(x===9&&y===13))return -1;
    if(y===13)return 5;if((x===6||x===8)&&y===7)return -1;return 4;}
  if(x===1&&y>=9&&y<=11)return 4;return -1;}
function knobFn(glow){return (x,y)=>{const dx=(x-5)/3.7,dy=(y-4)/3.1,m=dx*dx+dy*dy;if(m>1)return -1;
  if(x===4&&y===3)return 12;if(y>=6)return glow?9:7;return glow?8:6;};}
function initSprites(){
  SPR.lh=[buildSprite(17,34,lhFn(false)),buildSprite(17,34,lhFn(true))];
  SPR.rk=buildSprite(15,24,rkFn);
  SPR.st=[buildSprite(26,23,stFn(false)),buildSprite(26,23,stFn(true))];
  SPR.ov=buildSprite(44,35,ovFn,true);
  SPR.hand=buildSprite(12,16,handFn);
  SPR.knob=[buildSprite(11,9,knobFn(false)),buildSprite(11,9,knobFn(true))];
  const m=SPR.ov.mask;SPR.ovMouth=[];
  for(let y=0;y<35;y++)for(let x=0;x<44;x++)if(m[y*44+x]===1)SPR.ovMouth.push(x,y);
}
const RT={lh:{hw:8,h:32},rk:{hw:7,h:24},st:{hw:12,h:22},fw:{hw:16,h:36}};

// ---------- layout ----------
function readInsets(){const e=document.getElementById('sa');const cs=getComputedStyle(e);
  const f=v=>parseFloat(v)||0;return {t:f(cs.paddingTop),r:f(cs.paddingRight),b:f(cs.paddingBottom),l:f(cs.paddingLeft)};}
function resize(){
  CW=window.innerWidth||document.documentElement.clientWidth||390;
  CH=window.innerHeight||document.documentElement.clientHeight||844;
  DPR=Math.min(2,window.devicePixelRatio||1);
  S=Math.max(2,Math.floor(Math.min(CW,CH)/180));
  W=Math.ceil(CW/S);H=Math.ceil(CH/S);
  lc.width=W;lc.height=H;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  cv.style.width=CW+'px';cv.style.height=CH+'px';
  const si=readInsets();
  ins.t=Math.ceil(si.t/S);ins.b=Math.ceil(si.b/S);ins.l=Math.ceil(si.l/S);ins.r=Math.ceil(si.r/S);
  layout();
  doughSig='';
}
function layout(){
  const portrait=H>W*1.1;L.portrait=portrait;
  if(portrait){
    L.lot={x0:ins.l+6,x1:W-ins.r-6,y0:ins.t+22,y1:Math.round(H*0.43)};
    L.oven={x:Math.round(W*0.80-ins.r*0.5),y:Math.round((H-ins.b)*0.78)};
    L.home={x:Math.round(W*0.50)+R0+1,y:Math.round(H*0.50)};
    L.rhome={x:Math.round(W*0.16)+ins.l,y:Math.round((H-ins.b)*0.78)};
  }else{
    L.lot={x0:Math.round(W*0.58),x1:W-ins.r-6,y0:ins.t+16,y1:H-ins.b-6};
    L.oven={x:Math.round(W*0.47),y:Math.round(H*0.50)};
    L.home={x:Math.round(ins.l+W*0.22),y:Math.round(H*0.62)};
    L.rhome={x:Math.round(W*0.40),y:Math.round(H*0.88)-ins.b};
  }
  L.mouth={x:L.oven.x,y:L.oven.y-7};
  L.front={x:L.oven.x,y:Math.min(H-ins.b-4,L.oven.y+31)};
  L.souv={x:ins.l+8,y:ins.t+8};
  stars=[];
  for(let i=0;i<34;i++){const x=Math.floor(hash(i,7,3)*W),y=Math.floor(hash(i,9,5)*H);
    if(x>L.lot.x0-2&&x<L.lot.x1+2&&y>L.lot.y0-2&&y<L.lot.y1+2)continue;stars.push([x,y,i]);}
  // keep dough in place if it is at home
  const p=G.parks&&G.parks[G.cur];
  if(p&&p.dough&&(p.dough.state==='home')){p.dough.x=L.home.x;p.dough.y=L.home.y;}
  if(G.grain){G.grain.x=L.home.x;G.grain.y=L.home.y;}
  if(R&&!R.move&&!R.use&&R.at==null){R.x=L.rhome.x;R.y=L.rhome.y;}
}
function lotX(u){return L.lot.x0+u*(L.lot.x1-L.lot.x0);}
function lotY(v){return L.lot.y0+v*(L.lot.y1-L.lot.y0);}
function toU(x){return clamp((x-L.lot.x0)/Math.max(1,L.lot.x1-L.lot.x0),0,1);}
function toV(y){return clamp((y-L.lot.y0)/Math.max(1,L.lot.y1-L.lot.y0),0,1);}
function limitAt(x,y,th){const c=Math.cos(th),s=Math.sin(th);let t=999;
  const x0=ins.l+3,x1=W-ins.r-3,y0=ins.t+3,y1=H-ins.b-3;
  if(c<-1e-6)t=Math.min(t,(x0-x)/c);if(c>1e-6)t=Math.min(t,(x1-x)/c);
  if(s<-1e-6)t=Math.min(t,(y0-y)/s);if(s>1e-6)t=Math.min(t,(y1-y)/s);
  return Math.max(R0+24,Math.min(90,t));}
function capK(d,k){return Math.max(0,Math.min(30,0.62*limitAt(L.home.x,L.home.y,DIRA[k])-R0)-d.s[k]);}

// ---------- state ----------
const G={parks:[],cur:0,favType:null,firstTouch:false,lastInput:0,demoDone:false,demo:null,
  particles:[],wig:{},trans:null,oven:{state:'idle',t:0,dough:null},grain:null,flash:null,
  newDoughT:0,beamT:0,gid:1,saveOK:true,started:performance.now()};
let R=null; // robot
let act=null; // active pointer action
let anim=0, animFrozen=false, now=0;

function newPark(i){return {theme:i%3,startDir:[0,1,2][i%3],rides:[],edges:[],stubs:[],nextId:1,dough:null,doughCount:0};}
function park(){return G.parks[G.cur];}
function newDough(p,fx,fy){
  const d={s:[0,0,0,0],pend:[0,0,0,0],level:0,disc:[],x:L.home.x,y:L.home.y,state:'home',t:0,
    fx:fx,fy:fy,rs:new Float32Array(N).fill(R0),rv:new Float32Array(N),seed:(rnd()*1e6)|0,
    handlesShown:p.doughCount>0,lit:0,wasLit:false,tension:0,scale:1,prog:{lh:0,rk:0,fw:0},rx:0,ry:0,bob:0};
  if(fx!=null&&p.doughCount>0){d.state='arrive';d.scale=0.4;}
  p.doughCount++;return d;}
function restR(d,th,wp){let r=R0;for(let k=0;k<4;k++){const s=d.s[k]+(wp?d.pend[k]:0);if(s)r+=s*(1+Math.cos(th-DIRA[k]))*0.5;}return r;}
function dr(d,th){let f=(th+Math.PI)/TAU*N;f=((f%N)+N)%N;const i0=Math.floor(f),fr=f-i0;return d.rs[i0]*(1-fr)+d.rs[(i0+1)%N]*fr;}
function sumS(d){let t=0;for(let k=0;k<4;k++)t+=d.s[k]+d.pend[k];return t;}
function eff(d,k){return d.s[k]+d.pend[k];}
function roundness(d){let mn=1e9,mx=0,sm=0;for(let i=0;i<16;i++){const r=restR(d,i/16*TAU,true);mn=Math.min(mn,r);mx=Math.max(mx,r);sm+=r;}return (mx-mn)/(sm/16);}
function meanR(d){let sm=0;for(let i=0;i<8;i++)sm+=restR(d,i/8*TAU,false);return sm/8;}

// ---------- rides ----------
function addRide(p,type,extra){const r=Object.assign({id:p.nextId++,type:type,u:0.5,v:0.5,gid:0,hearts:0,lv:0,
  wait:false,ox:0,rise:1,rot:rnd()*TAU,hop:0,fly:null,drag:false,x:0,y:0,born:now},extra||{});p.rides.push(r);return r;}
function rideById(p,id){for(const r of p.rides)if(r.id===id)return r;return null;}
function frontShift(p,gid){let mn=1e9,mx=-1e9;for(const r of p.rides)if(r.gid===gid&&r.wait){const hw=RT[r.type].hw;mn=Math.min(mn,L.front.x+r.ox-hw);mx=Math.max(mx,L.front.x+r.ox+hw);}
  let s=0;if(mx>W-ins.r-3)s=W-ins.r-3-mx;if(mn+s<ins.l+3)s=ins.l+3-mn;return s;}
function ridePos(p,r){
  if(r.drag)return {x:r.x,y:r.y};
  if(r.fly){const f=r.fly,k=ease(f.t/f.dur);return {x:lerp(f.ax,f.bx,k),y:lerp(f.ay,f.by,k)-Math.sin(Math.PI*k)*f.h};}
  if(r.wait)return {x:L.front.x+r.ox+frontShift(p,r.gid),y:L.front.y};
  return {x:Math.round(lotX(r.u)),y:Math.round(lotY(r.v))};}
function findEdge(p,a,b){for(const e of p.edges)if((e.a===a&&e.b===b)||(e.a===b&&e.b===a))return e;return null;}
function neighbors(p,id){const o=[];for(const e of p.edges){if(e.a===id)o.push(e.b);else if(e.b===id)o.push(e.a);}return o;}
function favRide(p){let best=null,bh=0.5;for(const r of p.rides){if(r.wait||r.fly)continue;if(r.hearts>bh){bh=r.hearts;best=r;}}return best;}
function stubSocket(p,st){const r=rideById(p,st.rid);if(!r)return null;const q=ridePos(p,r);return {x:q.x+st.dx*st.grow,y:q.y+st.dy*st.grow,rx:q.x,ry:q.y};}
function makeStub(p,r){
  if(p.stubs.some(s=>s.rid===r.id))return;
  const q=ridePos(p,r);let best=null,bs=-1e9;
  for(const [dx,dy] of [[-1,0],[1,0],[0,1],[0,-1],[-0.7,0.7],[0.7,0.7]]){
    const len=dy<0?30:38;const sx=q.x+dx*len,sy=q.y+dy*len;
    let sc=0;if(sx<L.lot.x0+10||sx>L.lot.x1-10||sy<L.lot.y0+26||sy>L.lot.y1-3)sc-=200;
    let md=80;for(const o of p.rides){if(o===r||o.wait||o.fly)continue;const oq=ridePos(p,o);md=Math.min(md,hyp(oq.x-sx,oq.y-sy));}
    sc+=md+(dx===0?0:4);
    if(sc>bs){bs=sc;best={rid:r.id,dx:dx*len,dy:dy*len,grow:0};}}
  if(best)p.stubs.push(best);}
function suggestSpot(p,hw){
  for(const st of p.stubs){const s=stubSocket(p,st);if(s&&st.grow>=1)return {x:s.x,y:s.y,stub:true};}
  const fav=favRide(p);let best=null,bs=-1e9;
  for(let y=L.lot.y0+30;y<=L.lot.y1-2;y+=6)for(let x=L.lot.x0+hw+2;x<=L.lot.x1-hw-2;x+=6){
    let md=90;for(const o of p.rides){if(o.wait||o.fly)continue;const oq=ridePos(p,o);md=Math.min(md,hyp(oq.x-x,(oq.y-y)*1.4)-RT[o.type].hw);}
    let sc=Math.min(md,hw+26);
    if(fav){const fq=ridePos(p,fav);sc-=hyp(fq.x-x,fq.y-y)*0.25;}
    else sc-=hyp(x-(L.lot.x0+L.lot.x1)/2,y-(L.lot.y0+L.lot.y1)*0.55)*0.1;
    if(sc>bs){bs=sc;best={x:x,y:y};}}
  return best||{x:(L.lot.x0+L.lot.x1)/2,y:L.lot.y1-4};}
function distSeg(px_,py_,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy||1;let t=((px_-ax)*vx+(py_-ay)*vy)/l2;t=clamp(t,0,1);return hyp(px_-(ax+vx*t),py_-(ay+vy*t));}

function placeGroup(p,gid,pos){
  const rs=p.rides.filter(r=>r.gid===gid);if(!rs.length)return;
  const fit=()=>{let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(const r of rs){const q=pos.get(r.id),t=RT[r.type];mnx=Math.min(mnx,q.x-t.hw);mxx=Math.max(mxx,q.x+t.hw);mny=Math.min(mny,q.y-t.h);mxy=Math.max(mxy,q.y);}
    let dx=0,dy=0;const lo=L.lot;
    if(mxx-mnx>lo.x1-lo.x0)dx=(lo.x0+lo.x1)/2-(mnx+mxx)/2;else{if(mnx<lo.x0)dx=lo.x0-mnx;if(mxx>lo.x1)dx=lo.x1-mxx;}
    if(mxy>lo.y1)dy=lo.y1-mxy;if(mny+dy<lo.y0-10)dy=lo.y0-10-mny;if(mxy+dy>lo.y1)dy=lo.y1-mxy;
    for(const r of rs){const q=pos.get(r.id);q.x+=dx;q.y+=dy;}};
  fit();
  let conn=false;
  // 1) rocket dotted road
  let bestS=null,bd=26;
  for(const st of p.stubs){const rk=rideById(p,st.rid);if(!rk||rk.gid===gid||st.grow<1)continue;const s=stubSocket(p,st);
    for(const r of rs){const q=pos.get(r.id);const d=Math.min(distSeg(q.x,q.y,s.rx+st.dx*0.3,s.ry+st.dy*0.3,s.x,s.y),hyp(q.x-s.x,q.y-s.y));
      if(d<bd){bd=d;bestS={st,s,r};}}}
  if(bestS){const q=pos.get(bestS.r.id);const ddx=bestS.s.x-q.x,ddy=bestS.s.y-q.y;
    for(const r of rs){const t=pos.get(r.id);t.x+=ddx;t.y+=ddy;}
    p.edges.push({a:bestS.st.rid,b:bestS.r.id,k:'road'});p.stubs.splice(p.stubs.indexOf(bestS.st),1);conn=true;fit();}
  else{
    // 2) near another ride -> road
    let bp=null,bdd=40;
    for(const r of rs){const q=pos.get(r.id);for(const o of p.rides){if(o.gid===gid||o.wait||o.fly||o.drag)continue;const oq=ridePos(p,o);
      const d=hyp(q.x-oq.x,(q.y-oq.y)*1.3)-RT[r.type].hw-RT[o.type].hw;if(d<bdd){bdd=d;bp={r,o,oq};}}}
    if(bp){const q=pos.get(bp.r.id);const side=(q.x>=bp.oq.x)?1:-1;let tx=bp.oq.x+side*(RT[bp.o.type].hw+RT[bp.r.type].hw+12);
      const free=(tx)=>{const ddx=tx-q.x,ddy=bp.oq.y-q.y;if(tx-RT[bp.r.type].hw<L.lot.x0-2||tx+RT[bp.r.type].hw>L.lot.x1+2)return false;
        for(const r of rs){const t=pos.get(r.id);for(const o of p.rides){if(o.gid===gid||o===bp.o||o.wait||o.fly||o.drag)continue;const oq=ridePos(p,o);
          if(Math.abs(t.x+ddx-oq.x)<RT[r.type].hw+RT[o.type].hw-2&&Math.abs(t.y+ddy-oq.y)<14)return false;}}return true;};
      if(!free(tx))tx=bp.oq.x-side*(RT[bp.o.type].hw+RT[bp.r.type].hw+12);
      if(free(tx)){const ddx=tx-q.x,ddy=bp.oq.y-q.y;for(const r of rs){const t=pos.get(r.id);t.x+=ddx;t.y+=ddy;}
        if(!findEdge(p,bp.r.id,bp.o.id))p.edges.push({a:bp.o.id,b:bp.r.id,k:'road'});conn=true;fit();}}
  }
  for(const r of rs){const q=pos.get(r.id);r.u=toU(q.x);r.v=toV(q.y);r.wait=false;r.drag=false;r.rise=Math.max(r.rise,1);}
  // long roads break
  for(let i=p.edges.length-1;i>=0;i--){const e=p.edges[i];if(e.k!=='road')continue;const a=rideById(p,e.a),b=rideById(p,e.b);
    if(!a||!b){p.edges.splice(i,1);continue;}if(a.gid!==gid&&b.gid!==gid)continue;
    const qa=ridePos(p,a),qb=ridePos(p,b);if(hyp(qa.x-qb.x,qa.y-qb.y)>84)p.edges.splice(i,1);}
  for(const r of p.rides){if(r.type==='rk'&&!r.wait&&!r.fly){const hasRoad=p.edges.some(e=>e.k==='road'&&(e.a===r.id||e.b===r.id));
    if(!hasRoad&&!p.stubs.some(s=>s.rid===r.id))makeStub(p,r);}}
  for(const r of rs){const q=pos.get(r.id);burst(q.x,q.y-4,[5,4,15],6,30);}
  if(conn){SFX.chime();const q=pos.get(rs[0].id);burst(q.x,q.y-10,[8,12,10],12,45);}else SFX.place();
  save();
}
function autoPlace(p,gid){const rs=p.rides.filter(r=>r.gid===gid&&r.wait);if(!rs.length)return;
  let mn=1e9,mx=-1e9;for(const r of rs){mn=Math.min(mn,r.ox-RT[r.type].hw);mx=Math.max(mx,r.ox+RT[r.type].hw);}
  const sp=suggestSpot(p,(mx-mn)/2);const pos=new Map();
  for(const r of rs)pos.set(r.id,{x:sp.x+r.ox,y:sp.y});placeGroup(p,gid,pos);}
function waitingRides(p){return p.rides.filter(r=>r.wait&&!r.fly);}

// ---------- particles ----------
function part(x,y,vx,vy,c,life,g){if(G.particles.length>=MAXP)return;G.particles.push({x,y,vx,vy,c,life,ml:life,g:g==null?60:g});}
function burst(x,y,cols,n,spd){for(let i=0;i<n;i++){const a=rnd()*TAU,s=spd*(0.4+rnd()*0.6);part(x,y,Math.cos(a)*s,Math.sin(a)*s-spd*0.3,cols[i%cols.length],0.5+rnd()*0.4);}}

// ---------- sound ----------
const SFX=(function(){let ac=null,mg=null,nb=null;
  function init(){if(ac){if(ac.state==='suspended'&&!document.hidden)ac.resume().catch(()=>{});return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{ac=new A();mg=ac.createGain();mg.gain.value=0.32;mg.connect(ac.destination);
      const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(mg);s.start(0);
      nb=ac.createBuffer(1,Math.floor(ac.sampleRate*1.6),ac.sampleRate);const ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
      if(ac.state==='suspended')ac.resume().catch(()=>{});
    }catch(e){ac=null;}}
  function ok(){return ac&&ac.state==='running';}
  function tone(type,f0,f1,dur,vol,delay,f2){if(!ok())return;try{const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f2){o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.35);o.frequency.exponentialRampToValueAtTime(f2,t+dur);}
    else o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+0.03);}catch(e){}}
  function noise(dur,vol,ft,fq,delay){if(!ok()||!nb)return;try{const t=ac.currentTime+(delay||0);const s=ac.createBufferSource();s.buffer=nb;
    const f=ac.createBiquadFilter();f.type=ft;f.frequency.value=fq;const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+dur+0.05);}catch(e){}}
  return {init,
    suspend(){if(ac&&ac.state==='running')ac.suspend().catch(()=>{});},
    resume(){if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});},
    state(){return ac?ac.state:'none';},
    boing(a){const f=170+Math.min(90,a)*6;tone('sine',f,f*2.1,0.2,0.38,0,f*1.25);},
    squish(){tone('triangle',230,130,0.11,0.25);},
    level(){tone('triangle',880,1320,0.1,0.18);tone('triangle',1320,1760,0.1,0.14,0.07);},
    discover(){tone('sine',1319,1319,0.18,0.22);tone('sine',1976,1976,0.22,0.2,0.09);tone('sine',2637,2637,0.3,0.14,0.18);},
    bake(){noise(1.5,0.3,'lowpass',360);tone('triangle',72,56,1.5,0.28);},
    done(){[523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.13,0.11,i*0.085));tone('triangle',1047,1568,0.32,0.16,0.34);},
    snap(){noise(0.12,0.45,'highpass',1800);tone('sine',900,110,0.15,0.4);},
    zoom(){tone('sine',200,1400,0.7,0.22);tone('triangle',300,2100,0.7,0.08,0.05);},
    zoomOut(){tone('sine',1400,200,0.6,0.2);},
    place(){tone('triangle',200,100,0.09,0.3);},
    tick(){tone('square',660,620,0.04,0.05);},
    chime(){tone('sine',784,784,0.4,0.22);tone('sine',1175,1175,0.5,0.18,0.08);},
    taut(v){tone('sine',700+v*700,730+v*700,0.06,0.06);},
    ping(){tone('sine',1568,1568,0.14,0.14);tone('sine',2093,2093,0.2,0.11,0.1);},
    pop(){tone('square',520,880,0.07,0.09);},
    whoosh(){noise(0.5,0.18,'bandpass',900);tone('sine',300,900,0.5,0.1);}
  };})();

// ---------- save (local only, optional) ----------
const SKEY='dotpizza-261101-v1';
function serialize(){return {v:1,cur:G.cur,fav:G.favType,parks:G.parks.map(p=>{
  const rides=p.rides.filter(r=>!r.fly).map(r=>{let u=r.u,v=r.v;if(r.wait||r.drag){const q=ridePos(p,r);u=toU(q.x);v=toV(Math.max(q.y,L.lot.y0+20));}
    return {id:r.id,t:r.type,u:+u.toFixed(4),v:+v.toFixed(4),g:r.gid,h:+r.hearts.toFixed(2),l:r.lv};});
  const ids=new Set(rides.map(r=>r.id));
  return {th:p.theme,sd:p.startDir,n:p.nextId,dc:p.doughCount,rides:rides,
    edges:p.edges.filter(e=>ids.has(e.a)&&ids.has(e.b)).map(e=>[e.a,e.b,e.k]),
    stubs:p.stubs.filter(s=>ids.has(s.rid)).map(s=>[s.rid,+s.dx.toFixed(1),+s.dy.toFixed(1)])};})};}
function save(){if(!G.saveOK)return;try{localStorage.setItem(SKEY,JSON.stringify(serialize()));}catch(e){G.saveOK=false;}}
function validNum(x,a,b){return typeof x==='number'&&isFinite(x)&&x>=a&&x<=b;}
function loadSave(){let txt=null;try{txt=localStorage.getItem(SKEY);}catch(e){G.saveOK=false;return null;}
  if(!txt)return null;
  try{const o=JSON.parse(txt);if(!o||o.v!==1||!Array.isArray(o.parks)||o.parks.length<1||o.parks.length>30)throw 0;
    const parks=[];
    for(const sp of o.parks){if(!sp||!Array.isArray(sp.rides)||sp.rides.length>60)throw 0;
      const p=newPark(parks.length);if(validNum(sp.th,0,2))p.theme=sp.th|0;if(validNum(sp.sd,0,2))p.startDir=sp.sd|0;
      let mxid=0;
      for(const r of sp.rides){if(!r||!RT[r.t]||!validNum(r.id,1,1e6)||!validNum(r.u,0,1)||!validNum(r.v,0,1))throw 0;
        p.rides.push({id:r.id|0,type:r.t,u:r.u,v:r.v,gid:validNum(r.g,0,1e7)?r.g|0:0,hearts:validNum(r.h,0,1e4)?r.h:0,lv:validNum(r.l,0,3)?r.l|0:0,
          wait:false,ox:0,rise:1,rot:rnd()*TAU,hop:0,fly:null,drag:false,x:0,y:0,born:0});mxid=Math.max(mxid,r.id|0);}
      const ids=new Set(p.rides.map(r=>r.id));
      if(Array.isArray(sp.edges))for(const e of sp.edges){if(Array.isArray(e)&&ids.has(e[0])&&ids.has(e[1])&&['road','arch','rope','tube'].includes(e[2]))p.edges.push({a:e[0],b:e[1],k:e[2]});}
      if(Array.isArray(sp.stubs))for(const s of sp.stubs){if(Array.isArray(s)&&ids.has(s[0])&&validNum(s[1],-80,80)&&validNum(s[2],-80,80))p.stubs.push({rid:s[0],dx:s[1],dy:s[2],grow:1});}
      p.nextId=Math.max(mxid+1,validNum(sp.n,1,1e6)?sp.n|0:1);p.doughCount=0;
      for(const r of p.rides)G.gid=Math.max(G.gid,r.gid+1);
      parks.push(p);}
    return {parks:parks,cur:validNum(o.cur,0,parks.length-1)?o.cur|0:0,fav:RT[o.fav]?o.fav:null};
  }catch(e){try{localStorage.removeItem(SKEY);}catch(e2){}return null;}}

// ---------- robot ----------
function newRobot(){return {x:L.rhome.x,y:L.rhome.y,move:null,use:null,seat:null,queue:[],at:null,tilt:0,tiltT:1.5,
  eyes:'open',eyesT:0,jump:0,jumpH:5,idleT:2.5,gx:0,gy:0,face:1,acts:0,point:0,legT:0};}
function standPoint(p,r,fromX){const q=ridePos(p,r),hw=RT[r.type].hw;const side=(fromX==null?1:(fromX>=q.x?1:-1));
  let x=q.x+side*(hw+4);if(x>W-ins.r-7||x<ins.l+7)x=q.x-side*(hw+4);return {x:clamp(x,ins.l+7,W-ins.r-7),y:q.y+1};}
function robotGo(p,r,use){if(R.seat!=null)return;const e=R.at!=null?findEdge(p,R.at,r.id):null;
  const t=standPoint(p,r,e?ridePos(p,rideById(p,R.at)||r).x:R.x);
  let ax=R.x,ay=R.y,kind='walk',ar=null;
  if(e){kind=e.k;ar=R.at;}
  const d=hyp(t.x-ax,t.y-ay);
  R.move={ax,ay,bx:t.x,by:t.y,t:0,dur:Math.max(0.3,d/(kind==='walk'?32:24)),kind,to:r.id,use,from:ar};
  R.at=null;R.use=null;}
function robotHome(){R.move={ax:R.x,ay:R.y,bx:L.rhome.x,by:L.rhome.y,t:0,dur:Math.max(0.3,hyp(L.rhome.x-R.x,L.rhome.y-R.y)/32),kind:'walk',to:null,use:false};R.at=null;}
function robotJump(h){R.jump=0.45;R.jumpH=h||6;}
function bridgeOff(kind,t){if(kind==='arch')return -2-Math.sin(Math.PI*t)*9;if(kind==='rope')return -5+Math.sin(Math.PI*t)*3;if(kind==='tube')return -3-Math.sin(Math.PI*t)*12;return 0;}
function startUse(p,r){R.at=r.id;r.hearts+=0.15;
  if(r.type==='fw')R.use={k:'fw',ph:'board',t:0,rid:r.id};
  else if(r.type==='st')R.use={k:'st',t:0,dur:3.2,rid:r.id};
  else if(r.type==='rk'){R.use={k:'rk',t:0,dur:1.5,rid:r.id};r.hop=0.001;}
  else {R.use={k:'lh',t:0,dur:1.8,rid:r.id};G.beamBoost=1.8;}}
function rotTo(r,target,speed,dt){let d=((target-r.rot)%TAU+TAU)%TAU;if(d<0.03||d>TAU-0.001){r.rot=target;return true;}
  const st=Math.min(d,speed*dt);r.rot+=st;return d-st<0.03;}
function gondolaPos(p,r,k){const q=ridePos(p,r);const a=r.rot+k*TAU/6;return {x:q.x+Math.cos(a)*13,y:q.y-21+Math.sin(a)*13};}
function updRobot(dt){
  const p=park();if(R.jump>0)R.jump=Math.max(0,R.jump-dt);
  if(R.eyesT>0){R.eyesT-=dt;if(R.eyesT<=0)R.eyes='open';}
  R.tiltT-=dt;if(R.tiltT<=0){R.tilt=R.tilt===0?(rnd()<0.5?-1:1):0;R.tiltT=0.9+rnd()*1.6;}
  if(R.point>0)R.point-=dt;
  if(R.move){const m=R.move;m.t+=dt;let k=clamp(m.t/m.dur,0,1);
    const tr=m.to!=null?rideById(p,m.to):null;
    if(tr&&m.kind==='walk'){const t=standPoint(p,tr,m.ax);m.bx=t.x;m.by=t.y;}
    R.x=lerp(m.ax,m.bx,k);R.y=lerp(m.ay,m.by,k);R.face=m.bx>=m.ax?1:-1;R.legT+=dt;
    if(m.kind!=='walk'&&m.from!=null){const a=rideById(p,m.from);if(a&&tr){const qa=ridePos(p,a),qb=ridePos(p,tr);
      const tt=Math.abs(qb.x-qa.x)>2?clamp((R.x-qa.x)/(qb.x-qa.x),0,1):k;R.y=lerp(qa.y,qb.y,tt)+1+bridgeOff(m.kind,tt);}}
    if(k>=1){R.move=null;if(tr){R.at=tr.id;if(m.use)startUse(p,tr);else R.idleT=0.8+rnd();}else{R.at=null;R.idleT=2+rnd()*2;}}
    return;}
  if(R.use){const u=R.use;const r=rideById(p,u.rid);if(!r){R.use=null;R.seat=null;return;}u.t+=dt;
    if(u.k==='fw'){
      if(u.ph==='board'){if(rotTo(r,Math.PI/2,3,dt)){R.seat=r.id;u.ph='up';SFX.pop();}}
      else if(u.ph==='up'){if(rotTo(r,Math.PI*1.5,1.2,dt)){u.ph='top';u.t=0;atTop(p,r);}}
      else if(u.ph==='top'){if(u.t>1.9)u.ph='down';}
      else if(u.ph==='down'){if(rotTo(r,Math.PI/2,1.2,dt)){R.seat=null;const t=standPoint(p,r,R.x);R.x=t.x;R.y=t.y;R.use=null;R.idleT=1.2+rnd();robotJump(4);}}
      if(R.seat!=null){const g=gondolaPos(p,r,0);R.x=g.x;R.y=g.y+3;}
    }else{
      const t=standPoint(p,r,R.x);if(u.k!=='rk'){R.x=t.x;R.y=t.y;}
      if(u.k==='rk'){if(u.t<1.2){R.seat=r.id;}else R.seat=null;}
      if(u.t>=u.dur){R.use=null;R.seat=null;R.idleT=1+rnd()*1.5;R.x=t.x;R.y=t.y;}
    }
    return;}
  // idle
  if(R.queue.length){const id=R.queue.shift();const r=rideById(p,id);if(r&&!r.fly){robotGo(p,r,true);return;}}
  R.idleT-=dt;if(R.idleT>0)return;
  const rides=p.rides.filter(r=>!r.fly&&!r.drag);
  if(!rides.length){if(hyp(R.x-L.rhome.x,R.y-L.rhome.y)>3)robotHome();R.idleT=2;return;}
  R.acts++;
  if(R.at!=null){const nb=neighbors(p,R.at).map(id=>rideById(p,id)).filter(r=>r&&!r.fly&&!r.drag);
    if(nb.length){const fav=favRide(p);let tot=0;const w=nb.map(r=>{const v=1+r.hearts+(r===fav?3:0)+rnd()*0.8;tot+=v;return v;});
      let x=rnd()*tot,pick=nb[0];for(let i=0;i<nb.length;i++){x-=w[i];if(x<=0){pick=nb[i];break;}}
      robotGo(p,pick,pick.type!=='fw'||rnd()<0.45);if(!R.move.use)R.move.use=true;return;}}
  if(R.at!=null&&R.acts%3===0){robotHome();return;}
  const fav=favRide(p);let tot=0;const w=rides.map(r=>{const v=1+r.hearts+(r===fav?4:0);tot+=v;return v;});
  let x=rnd()*tot,pick=rides[0];for(let i=0;i<rides.length;i++){x-=w[i];if(x<=0){pick=rides[i];break;}}
  robotGo(p,pick,true);
}
function atTop(p,r){const d=p.dough;R.point=1.9;
  if(d&&d.state==='home'){const g=guideForDough(p,d);
    if(g&&g.k==='handle'){G.flash={pic:g.pic,dir:g.dir,t:2.8};
      const hp=handlePos(d,g.dir);const gp=gondolaPos(p,r,0);
      for(let i=0;i<10;i++){const k=i/10;part(lerp(gp.x,hp.x,k),lerp(gp.y,hp.y,k),0,-4,i%2?8:12,0.6+k*0.6,0);}
    }else if(g&&g.k==='carry'){G.flash={pic:null,dir:-1,carry:true,t:2.4};}
    SFX.ping();}
  R.eyes='wide';R.eyesT=1.8;}

// ---------- guide ----------
const ORDER={0:['lh','rk','fw','pair','limit'],1:['rk','fw','lh','pair','limit'],2:['fw','lh','rk','pair','limit']};
function hasType(p,t){return p.rides.some(r=>r.type===t);}
function currentGoal(p){for(const g of ORDER[p.startDir]){
  if(g==='pair'){if(!p.edges.some(e=>e.k!=='road'))return g;continue;}
  if(g==='limit')return g;if(!hasType(p,g))return g;}return 'limit';}
function guideForDough(p,d){
  if(!G.firstTouch)return {k:'handle',dir:p.startDir,pic:null};
  const goal=currentGoal(p);const has=n=>d.disc.includes(n);
  const lesser=()=>{const a=eff(d,0),b=eff(d,2);if(Math.abs(a-b)<0.5)return p.startDir===2?2:0;return a<b?0:2;};
  let g=null;

    th=DIRA[k]+clamp(df,-1.1,1.1);let dist=hyp(dx,dy)*Math.max(0.2,Math.cos(raw-th));
    const lim=limitAt(d.x,d.y,th);let de;
    if(d.level<3){const m=lim*0.9;de=dist<m*0.8?dist:m*0.8+(m*0.2)*(1-Math.exp(-(dist-m*0.8)/(m*0.2)));}
    else de=Math.min(dist,lim);
    const rest=restR(d,th,false);const ex=Math.max(0,de-rest);
    act.th=th;act.ex=Math.max(0,de-restR(d,th,true))+ (restR(d,th,true)-rest>0?0:0);act.ex=Math.max(0,de-restR(d,th,true));
    d.tension=clamp((de-0.62*lim)/(0.33*lim),0,1);
    const keep=0.32*ex;let sw=0;const ws=[];for(let q=0;q<4;q++){const c=Math.max(0,Math.cos(th-DIRA[q]));ws.push(c*c);sw+=c*c;}
    for(let q=0;q<4;q++){if(!ws[q])continue;const v=Math.min(capK(d,q),keep*ws[q]/sw);if(v>d.pend[q])d.pend[q]=v;}
    const st=Math.floor(ex/10);if(st>act.step){act.step=st;SFX.boing(ex);if(rnd()<0.8){const hp=handlePos(d,k);part(hp.x,hp.y,rnd()*20-10,rnd()*20-10,[4,6,8][st%3],0.5);}}
    else if(st<act.step-1)act.step=st+1;
    if(d.level>=3&&dist>=lim*0.97){snapDough(p,d);}
    return;}
  if(act.k==='carry'&&d&&(d.state==='home'||d.state==='carry')){
    if(!act.moved&&hyp(pt.x-act.sx,pt.y-act.sy)>6/S*2){act.moved=true;d.state='carry';}
    if(act.moved){let tx=pt.x-act.ox,ty=pt.y-act.oy;const dm=hyp(tx-L.mouth.x,ty-L.mouth.y),br=bakeR(d);
      if(dm<br*1.5){const k=0.45*(1-dm/(br*1.5));tx=lerp(tx,L.mouth.x,k);ty=lerp(ty,L.mouth.y,k);}
      d.x=clamp(tx,ins.l+4,W-ins.r-4);d.y=clamp(ty,ins.t+4,H-ins.b-4);}
    return;}
  if(act.k==='group'){if(!act.moved&&hyp(pt.x-act.sx,pt.y-act.sy)>Math.max(3,8/S)){act.moved=true;
      for(const o of act.offs){const q=ridePos(p,o.r);o.r.x=q.x;o.r.y=q.y;o.r.drag=true;}
      if(R.seat!=null&&act.offs.some(o=>o.r.id===R.seat)){}SFX.pop();}
    if(act.moved)for(const o of act.offs){o.r.x=clamp(pt.x+o.ox,ins.l+4,W-ins.r-4);o.r.y=clamp(pt.y+o.oy,ins.t+20,H-ins.b-2);}
    return;}}
function endAct(e,cancel){if(!act||(e&&e.pointerId!==act.id))return;const a=act;act=null;const p=park(),d=p.dough;
  try{if(e)cv.releasePointerCapture(e.pointerId);}catch(err){}
  if(a.k==='pull'&&d&&d.state==='home'){
    let tot=0;for(let q=0;q<4;q++){d.s[q]+=d.pend[q];tot+=d.pend[q];d.pend[q]=0;}
    d.tension=0;if(!d.handlesShown){d.handlesShown=true;for(const k of [0,1,2]){const hp=handlePos(d,k);burst(hp.x,hp.y,[6,12],4,25);}}
    SFX.boing(Math.min(90,a.ex*0.5+tot*2+4));setLevel(d);doughSig='';save();}
  else if(a.k==='carry'&&d){
    if(a.moved&&!cancel&&hyp(d.x-L.mouth.x,d.y-L.mouth.y)<bakeR(d)&&G.oven.state==='idle'){d.state='toOven';d.t=0;d.rx=d.x;d.ry=d.y;SFX.pop();}
    else if(d.state==='carry'||a.moved){d.state='return';d.t=0;d.rx=d.x;d.ry=d.y;}
    else{for(let i=0;i<N;i++)d.rv[i]+=1.2;}}
  else if(a.k==='group'){
    if(a.moved){const pos=new Map();for(const o of a.offs)pos.set(o.r.id,{x:o.r.x,y:o.r.y});placeGroup(p,a.gid,pos);
      for(const o of a.offs)o.r.drag=false;}
    else if(!cancel){const r=a.tap;G.wig['r'+r.id]=now;SFX.pop();
      if(!r.wait){r.hearts+=2;R.queue=[r.id];if(R.use&&R.use.k!=='fw'){R.use=null;R.seat=null;}G.favType=favRide(p)?favRide(p).type:G.favType;
        burst(ridePos(p,r).x,ridePos(p,r).y-RT[r.type].h-4,[6,7],5,20);save();}}}
  else if(a.k==='souv'&&!cancel){if(G.oven.state==='bake'||(d&&d.state==='toOven')){G.wig['s'+a.i]=now;SFX.tick();}else{G.trans={mode:'out',t:0,d1:0.55,d2:0.5,to:a.i,sw:false};SFX.zoomOut();}}}
function enterGrain(){if(G.trans)return;const g=G.grain;const op=park();const np=newPark(G.parks.length);
  const fr=favRide(op)||op.rides.filter(r=>r.type!=='st').slice(-1)[0]||op.rides.slice(-1)[0];
  if(fr){G.favType=fr.type;addRide(np,fr.type,{u:0.5,v:0.62,gid:G.gid++,hearts:1.5,lv:fr.lv});}
  G.parks.push(np);
  G.trans={mode:'in',t:0,d1:0.75,d2:0.6,fx:g.x,fy:g.y,to:G.parks.length-1,sw:false};SFX.zoom();}

cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',e=>{endAct(e,false);SFX.init();},{passive:false});
window.addEventListener('pointercancel',e=>endAct(e,true),{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(act&&e.pointerId===act.id&&act.k!=='none'){/* keep via window events */}});
['touchstart','touchmove','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
document.addEventListener('touchend',e=>{SFX.init();if(e.cancelable&&e.target===cv)e.preventDefault();},{passive:false});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,60));
window.addEventListener('blur',()=>{if(act)endAct({pointerId:act.id},true);});

// ---------- loop ----------
let last=0,raf=0,running=false;
function frame(ts){raf=requestAnimationFrame(frame);let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=1/60;dt=Math.min(0.05,dt);
  now+=dt;if(!animFrozen)anim+=dt;update(dt);render();present();}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(act)endAct({pointerId:act.id},true);stop();SFX.suspend();}else{SFX.resume();start();}});

// ---------- boot ----------
initSprites();
R={x:0,y:0};resize();R=newRobot();
const sv=loadSave();
if(sv){G.parks=sv.parks;G.cur=sv.cur;G.favType=sv.fav;}else G.parks=[newPark(0)];
park().dough=newDough(park(),null,null);
G.lastInput=0;
// first frame immediately (no waiting for anything)
render();present();
start();

// test hooks (read-only helpers + anim freeze)
window.__DP={
  state(){const p=park(),d=p.dough;return {cur:G.cur,parks:G.parks.length,S,W,H,firstTouch:G.firstTouch,
    dough:d?{state:d.state,s:Array.from(d.s),pend:Array.from(d.pend),level:d.level,disc:d.disc.slice(),x:d.x,y:d.y,handlesShown:d.handlesShown,meanR:meanR(d),tension:d.tension,lit:d.lit>0,wasLit:d.wasLit}:null,
    rides:p.rides.map(r=>({id:r.id,type:r.type,wait:r.wait,fly:!!r.fly,gid:r.gid,pos:ridePos(p,r),hearts:r.hearts})),
    edges:p.edges.map(e=>({a:e.a,b:e.b,k:e.k})),stubs:p.stubs.map(s=>({rid:s.rid,sock:stubSocket(p,s),grow:s.grow})),
    robot:{x:R.x,y:R.y,at:R.at,seat:R.seat,mk:R.move?R.move.kind:null,use:R.use?R.use.k+':'+(R.use.ph||''):null,moving:!!R.move},
    grain:G.grain?{x:G.grain.x,y:G.grain.y}:null,trans:!!G.trans,oven:G.oven.state,guide:G.tgt?{k:G.tgt.k,dir:G.tgt.dir,x:G.tgt.x,y:G.tgt.y}:null,
    demo:!!G.demo,particles:G.particles.length,audio:SFX.state(),running,saveOK:G.saveOK,flash:G.flash?{pic:G.flash.pic,dir:G.flash.dir}:null,favType:G.favType};},
  handle(k){const p=park(),d=p.dough;if(!d)return null;const h=handlePos(d,k);return {x:h.x*S,y:h.y*S};},
  toCss(x,y){return {x:x*S,y:y*S};},
  L(){return JSON.parse(JSON.stringify(L));},
  freeze(v){animFrozen=!!v;},
  limit(k){const p=park(),d=p.dough;return d?limitAt(d.x,d.y,DIRA[k])*S:0;}
};
})();
