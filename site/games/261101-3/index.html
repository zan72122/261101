<script>
(function(){
'use strict';
// ============================================================
//  ぐるり石臼！たけのこ団子とすずめのお月見  (format fr-261029-2 / style sumi)
// ============================================================
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,S=1,R=100;
var SA={t:0,r:0,b:0,l:0};
var L={ok:false};
var PI=Math.PI, TAU=PI*2;
var PAPER='#f2ecdf', PAPER_HI='#f7f2e7', BEAD='#fbf8ef';
var SHU='rgba(196,66,40,0.88)';             // the single vermilion accent: the moon-viewing tray rim
var PENTA=[0,2,4,7,9];
var MOON_FULL=10, MAX_SPROUTS=6, MAX_SPARROWS=5, MAX_PARTS=140, MAX_FOOT=180;
var LAYOUTS=['row','fan','ring','tri'];

function ink(a){return 'rgba(28,24,21,'+a+')';}
function rand(a,b){return a+(b-a)*Math.random();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function easeOutBack(t){t=clamp(t,0,1);var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function angDiff(a,b){var d=a-b;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return d;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function noteF(base,i){return base*Math.pow(2,(PENTA[((i%5)+5)%5]+12*Math.floor(i/5))/12);}

// ============================================================
//  AUDIO (Web Audio synthesis, started on first touch)
// ============================================================
var AC=null, master=null, rumbleG=null, rumbleF=null, lfo=null, noiseBuf=null, rumbleLvl=0;
function audioStart(){
  if(AC){ if(AC.state==='suspended'&&!document.hidden){try{AC.resume();}catch(e){}} return; }
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C();
    master=AC.createGain(); master.gain.value=0.85;
    var comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    var sr=AC.sampleRate, len=Math.floor(sr*2);
    noiseBuf=AC.createBuffer(1,len,sr); var nd=noiseBuf.getChannelData(0); for(var i=0;i<len;i++) nd[i]=Math.random()*2-1;
    var bb=AC.createBuffer(1,len,sr), bd=bb.getChannelData(0), last=0;
    for(i=0;i<len;i++){ last=(last+0.02*(Math.random()*2-1))/1.02; bd[i]=last*3.2; }
    var src=AC.createBufferSource(); src.buffer=bb; src.loop=true;
    rumbleF=AC.createBiquadFilter(); rumbleF.type='lowpass'; rumbleF.frequency.value=120;
    var am=AC.createGain(); am.gain.value=0.65;
    lfo=AC.createOscillator(); lfo.frequency.value=8; var lg=AC.createGain(); lg.gain.value=0.35; lfo.connect(lg); lg.connect(am.gain); lfo.start();
    rumbleG=AC.createGain(); rumbleG.gain.value=0;
    src.connect(rumbleF); rumbleF.connect(am); am.connect(rumbleG); rumbleG.connect(master); src.start();
    if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  }catch(e){ AC=null; }
}
function tone(f,dur,o){
  if(!AC||AC.state==='closed') return; o=o||{};
  try{
    var t=AC.currentTime+(o.delay||0), a=o.a||0.006, v=o.vol||0.15;
    var os=AC.createOscillator(), g=AC.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+a+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t+a+dur+0.05);
  }catch(e){}
}
function noise(dur,o){
  if(!AC||AC.state==='closed'||!noiseBuf) return; o=o||{};
  try{
    var t=AC.currentTime+(o.delay||0), v=o.vol||0.1;
    var s=AC.createBufferSource(); s.buffer=noiseBuf;
    var f=AC.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.freq||1000,t); f.Q.value=o.q||1;
    if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*1.5); s.stop(t+dur+0.05);
  }catch(e){}
}
var sfx={
  thunk:function(){tone(92,0.16,{f2:58,vol:0.26}); noise(0.09,{freq:260,type:'lowpass',vol:0.14});},
  pop:function(i){var f=noteF(392,i); tone(f*1.5,0.13,{f2:f*0.75,vol:0.24}); tone(f*3,0.05,{type:'triangle',vol:0.05}); noise(0.03,{freq:2400,vol:0.04});},
  up:function(h){var f=900-h*300; tone(f,0.09,{f2:f*1.5,type:'triangle',vol:0.13});},
  boing:function(){tone(420,0.08,{f2:520,type:'triangle',vol:0.07});},
  sway:function(){tone(250,0.07,{vol:0.045});},
  flutter:function(d){d=d||0;for(var i=0;i<6;i++) noise(0.045,{freq:2400+i*160,q:1.4,vol:0.06,delay:d+i*0.055});},
  form:function(kind,n,set){
    var base=392*Math.pow(2,((set%4)*2)/12);
    if(kind==='skewer'){ for(var i=0;i<n+1;i++) tone(noteF(base,i),0.32,{type:'triangle',vol:0.12,delay:i*0.07}); }
    else if(kind==='pile'){ [0,2,4,5].forEach(function(k,j){tone(noteF(base,k),0.7,{vol:0.1,delay:j*0.03});}); tone(noteF(base,7),0.5,{type:'triangle',vol:0.08,delay:0.25}); }
    else { [0,2,4].forEach(function(k,j){tone(noteF(base,k),0.35,{type:'triangle',vol:0.12,delay:j*0.09});}); }
    noise(0.35,{freq:4000,f2:1200,q:0.6,vol:0.05});
    sfx.flutter(0.18);
  },
  chirp:function(p,d){p=p||1;d=d||0;tone(2800*p,0.05,{f2:3900*p,vol:0.06,delay:d}); tone(3400*p,0.06,{f2:2500*p,vol:0.05,delay:d+0.08});},
  peck:function(){noise(0.035,{freq:1400+Math.random()*700,q:2,vol:0.09});},
  surprise:function(){sfx.chirp(1.3); tone(1500,0.14,{f2:2600,vol:0.05,type:'triangle',delay:0.05}); noise(0.12,{freq:3000,vol:0.04});},
  bell:function(k){var f=noteF(262,k+2); tone(f,0.9,{vol:0.11}); tone(f*2.01,0.5,{vol:0.045}); tone(f*3.02,0.3,{vol:0.02});},
  gong:function(){tone(98,2.2,{f2:93,vol:0.24}); tone(147,1.6,{vol:0.08}); tone(196,1.2,{vol:0.06}); for(var i=0;i<6;i++) tone(noteF(784,i),0.45,{type:'triangle',vol:0.035,delay:0.35+i*0.09}); sfx.flutter(0.3);},
  whoosh:function(){noise(0.22,{freq:500,f2:1800,q:0.8,vol:0.07});},
  drop:function(){tone(320,0.08,{f2:210,vol:0.09});},
  grab:function(){tone(600,0.05,{f2:760,type:'triangle',vol:0.06});},
  newMoon:function(){for(var i=0;i<5;i++) tone(noteF(523,6-i),0.6,{vol:0.07,delay:i*0.12}); tone(110,1.0,{vol:0.1});},
  feast:function(mode){
    var seq = mode==='dance' ? [0,2,4,2,5,4,2,0,2,4,5,7,5,4,2,4,5,7,9,7,5,4,2,0,2,4,5,4,2,0] : [4,2,0,2,4,4,4,2,2,2,4,7,7,4,2,0,2,4,4,4,2,2,4,2,0];
    var step = mode==='dance' ? 0.22 : 0.36;
    for(var i=0;i<seq.length;i++){
      tone(noteF(392,seq[i]),step*1.4,{type:'triangle',vol:0.085,delay:0.3+i*step});
      if(i%2===0) tone(78,0.18,{f2:55,vol:0.15,delay:0.3+i*step});
    }
    [0,2,4,7].forEach(function(k,j){tone(noteF(262,k),1.6,{vol:0.07,delay:j*0.05});});
  }
};

// ============================================================
//  GAME STATE
// ============================================================
var G={
  t:0, phase:1, cycle:0, sets:0, eaten:0, moonCount:0, moonDisp:0,
  rot:0, spinV:0, omega:0, rotAccum:0, spawnedInBatch:0, lastDir:1, pendRot:0, rimPtrs:0,
  sprouts:[], objs:[], sparrows:[], parts:[], foot:[], traces:[], trail:[],
  tray:[null,null,null,null,null,null,null], trayT:0, trayTarget:0,
  layout:0, layoutFade:1, forming:null, feast:null, after:false, afterT:0, newMoonT:0,
  firstInput:false, lastInput:0, demo:null, demoUsed:false, invite:null,
  sw:{moon:0,nest:0,plate:0}, nightT:0, mortarSeed:1, idc:1, rimPulse:0, frameCount:0
};
var running=true, lastT=0, raf=0;

// ============================================================
//  LAYOUT
// ============================================================
function readSA(){
  var el=document.getElementById('sa'); var cs=getComputedStyle(el);
  SA.t=parseFloat(cs.paddingTop)||0; SA.r=parseFloat(cs.paddingRight)||0; SA.b=parseFloat(cs.paddingBottom)||0; SA.l=parseFloat(cs.paddingLeft)||0;
}
function computeLayout(){
  var port = H>=W*1.02;
  var ih=H-SA.t-SA.b;
  if(port){
    S=Math.min(W/390, ih/760); R=100*S;
    L.mx=SA.l+R*1.15; L.my=H-SA.b-R*1.12;
    L.px=W*0.5; L.py=SA.t+ih*0.47; L.rx=W*0.41; L.ry=L.rx*0.6;
    L.moon={x:W*0.76,y:SA.t+ih*0.105,r:38*S};
    L.nest={x:SA.l+Math.max(W*0.24,100*S),y:SA.t+ih*0.2};
  }else{
    S=Math.min(W/820, ih/640); R=100*S;
    L.mx=SA.l+R*1.3+10; L.my=H-SA.b-R*1.12;
    L.px=W*0.56; L.py=SA.t+ih*0.52; L.rx=Math.min(W*0.3,250*S); L.ry=L.rx*0.58;
    L.moon={x:W*0.85,y:SA.t+ih*0.14,r:42*S};
    L.nest={x:SA.l+W*0.17,y:SA.t+ih*0.2};
  }
  L.d=44*S;
  L.mcx=L.px-L.rx*0.3; L.mcy=L.py+L.ry*0.05;
  L.zone={x:L.px+L.rx*0.46,y:L.py+L.ry*0.2,r:46*S};
  L.trayR=R*0.64;
  L.ok=true;
}
function moldsFor(li){
  var d=L.d, x=L.mcx, y=L.mcy, k=LAYOUTS[li], out=[];
  if(k==='row'){ for(var i=0;i<4;i++) out.push({x:x+(i-1.5)*d,y:y}); }
  else if(k==='fan'){ [-0.62,0,0.62].forEach(function(a){out.push({x:x+Math.sin(a)*1.6*d,y:y+1.0*d-Math.cos(a)*1.6*d+0.25*d});}); }
  else if(k==='ring'){ for(i=0;i<5;i++){var a=-PI/2+i*TAU/5; out.push({x:x+Math.cos(a)*0.78*d,y:y+Math.sin(a)*0.62*d});} }
  else { out.push({x:x-1.25*d,y:y+0.55*d}); out.push({x:x+1.25*d,y:y+0.55*d}); out.push({x:x,y:y-0.8*d}); }
  return out;
}
function platePerch(i){
  var a=[0.12,-0.8,0.95,-1.55,1.75][i%5], z=L.zone, rr=z.r+30*S;
  var x=z.x+Math.cos(a)*rr, y=z.y+Math.sin(a)*rr*0.85+10*S;
  return {x:clamp(x,SA.l+40*S,W-SA.r-40*S), y:clamp(y,SA.t+50*S,H-SA.b-10*S), a:a};
}
var TRAY_ANG=[-0.15,-0.75,-1.3,-1.85,0.42];
function trayPerch(i){
  var a=TRAY_ANG[i%5], rr=R*1.24;
  return {x:clamp(L.mx+Math.cos(a)*rr,SA.l+40*S,W-SA.r-40*S), y:clamp(L.my+Math.sin(a)*rr+8*S,SA.t+40*S,H-SA.b-6*S), a:a};
}
function perchPos(i){ return (G.phase===2&&!G.after)?trayPerch(i):platePerch(i); }
function feastSpot(k,n,t){
  var th=-PI/2+TAU*k/Math.max(1,n);
  if(G.feast&&G.feast.mode==='dance'&&t>1.8) th+=(t-1.8)*0.75;
  return {x:L.px+Math.cos(th)*L.rx*0.86, y:L.py+Math.sin(th)*L.ry*0.98+6*S};
}
function inPlate(x,y,k){k=k||1;var dx=(x-L.px)/(L.rx*k),dy=(y-L.py)/(L.ry*k);return dx*dx+dy*dy<=1;}
function clampToPlate(p,k){
  k=k||0.9; var dx=(p.x-L.px)/(L.rx*k), dy=(p.y-L.py)/(L.ry*k), m=Math.sqrt(dx*dx+dy*dy);
  if(m>1){p.x=L.px+dx/m*L.rx*k;p.y=L.py+dy/m*L.ry*k;} return p;
}

// ============================================================
//  BRUSH PRIMITIVES (used for pre-rendered layers)
// ============================================================
function crs(pts,sub){
  if(pts.length<2) return pts.slice();
  var out=[];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(var j=0;j<sub;j++){
      var t=j/sub,t2=t*t,t3=t2*t;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);
    }
  }
  out.push(pts[pts.length-1]); return out;
}
function brush(c,pts,w,alpha,o){
  o=o||{}; var rng=o.rng||Math.random;
  var P=crs(pts,o.sub||8), n=P.length; if(n<2) return;
  var Lf=[],Rt=[],ph=rng()*6;
  for(var i=0;i<n;i++){
    var t=i/(n-1), a=P[Math.max(0,i-1)], b=P[Math.min(n-1,i+1)];
    var dx=b[0]-a[0], dy=b[1]-a[1], l=Math.sqrt(dx*dx+dy*dy)||1; dx/=l; dy/=l;
    var prof=o.prof?o.prof(t):(t<0.1?0.6+4*t:1-Math.pow((t-0.1)/0.9,o.tail||1.8)*0.9);
    var ww=w*prof*(1+(o.wob===undefined?0.12:o.wob)*Math.sin(t*9+ph))*0.5;
    Lf.push([P[i][0]-dy*ww,P[i][1]+dx*ww]); Rt.push([P[i][0]+dy*ww,P[i][1]-dx*ww]);
  }
  c.beginPath(); c.moveTo(Lf[0][0],Lf[0][1]);
  for(i=1;i<n;i++) c.lineTo(Lf[i][0],Lf[i][1]);
  for(i=n-1;i>=0;i--) c.lineTo(Rt[i][0],Rt[i][1]);
  c.closePath();
  c.fillStyle=o.color||ink(alpha);
  if(o.bleed){c.save();c.shadowColor=o.color||ink(alpha*0.6);c.shadowBlur=o.bleed;c.fill();c.restore();} else c.fill();
  if(o.dry){
    c.save(); c.strokeStyle=o.paper||PAPER_HI; c.lineCap='round';
    for(var k=0;k<o.dry;k++){
      var off=0.5+(rng()-0.5)*0.85; c.lineWidth=Math.max(0.5,w*0.07*(0.4+rng())); c.globalAlpha=0.45+0.45*rng();
      c.beginPath(); var on=false, st=Math.floor(n*(0.25+rng()*0.4));
      for(i=st;i<n;i++){ var px=lerp(Lf[i][0],Rt[i][0],off), py=lerp(Lf[i][1],Rt[i][1],off);
        if(rng()<0.12) on=!on; if(on) c.lineTo(px,py); else c.moveTo(px,py); }
      c.stroke();
    }
    c.restore();
  }
}
function blot(c,x,y,r,a,col){
  var g=c.createRadialGradient(x,y,0,x,y,r);
  var base=col||'28,24,21';
  g.addColorStop(0,'rgba('+base+','+a+')'); g.addColorStop(0.55,'rgba('+base+','+(a*0.6)+')'); g.addColorStop(1,'rgba('+base+',0)');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
}
function arcPts(cx,cy,r,a0,a1,n,jit,rng){var p=[];for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n, rr=r+(jit?(rng()-0.5)*jit:0);p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return p;}
function leafShape(c,x,y,ang,len,wid,alpha,rng,o){
  o=o||{};
  c.save(); c.translate(x,y); c.rotate(ang);
  var bend=(rng()-0.5)*wid*0.6;
  c.beginPath(); c.moveTo(0,0);
  c.quadraticCurveTo(len*0.38,-wid*1.05+bend,len,bend*0.8);
  c.quadraticCurveTo(len*0.5,wid*0.85+bend,0,0); c.closePath();
  var g=c.createLinearGradient(0,0,len,0);
  g.addColorStop(0,ink(alpha*1.25)); g.addColorStop(0.6,ink(alpha)); g.addColorStop(1,ink(alpha*0.5));
  c.fillStyle=g; c.save(); c.shadowColor=ink(alpha*0.7); c.shadowBlur=(o.bleed||6)*S; c.fill(); c.restore();
  brush(c,[[len*0.03,0],[len*0.45,bend*0.35],[len*0.92,bend*0.75]],Math.max(1.2,wid*0.09),Math.min(0.8,alpha*(o.rib||2.2)),{rng:rng,tail:1.2});
  c.save(); c.strokeStyle=PAPER_HI; c.globalAlpha=0.35; c.lineWidth=Math.max(0.6,wid*0.05);
  for(var k=0;k<2;k++){c.beginPath(); var oy=(k?1:-1)*wid*0.35; c.moveTo(len*0.25,oy*0.6+bend*0.2); c.quadraticCurveTo(len*0.55,oy+bend*0.5,len*0.82,oy*0.3+bend*0.7); c.stroke();}
  c.restore();
  c.restore();
}

// ============================================================
//  PRE-RENDERED LAYERS
// ============================================================
var paperC=null, paperX=null, plateC=null, plateB=null, platePrevC=null, platePrevB=null, mortarC=null, trayC=null, nestC=null, beadC=null, zoneC=null, handC=null;

function buildPaper(){
  paperC=mk(W*DPR,H*DPR); var c=paperC.getContext('2d'); paperX=c; c.setTransform(DPR,0,0,DPR,0,0);
  var rng=mulberry(17);
  c.fillStyle=PAPER; c.fillRect(0,0,W,H);
  for(var i=0;i<16;i++) blot(c,rng()*W,rng()*H,(80+rng()*220)*S,0.03,'150,125,85');
  c.lineCap='round';
  var nf=Math.floor(W*H/2600);
  for(i=0;i<nf;i++){
    var x=rng()*W,y=rng()*H,l=(4+rng()*16)*S,a=rng()*TAU;
    c.strokeStyle='rgba(130,108,75,'+(0.04+rng()*0.06)+')'; c.lineWidth=0.4+rng()*0.6;

function buildPlate(li){

function buildTray(){

//  ENTITIES
// ============================================================
function beadR(h){return (9+12*h)*S;}
function newObj(kind,x,y,ang,hs,froms){
  var o={id:G.idc++,kind:kind,x:x,y:y,ang:ang||0,beads:[],claimed:false,grab:null,tray:-1,scale:1,sq:0,sqv:0,formK:0,
    hop:0,tx:null,ty:null,born:G.t,inZone:false,carried:false,feast:false,lift:0};
  for(var i=0;i<hs.length;i++) o.beads.push({h:hs[i],eat:0,fx:froms?froms[i].x:x,fy:froms?froms[i].y:y});
  o.big=hs.some(function(h){return h>=0.68;});
  return o;
}
function objMass(o){var m=0;for(var i=0;i<o.beads.length;i++) m+=o.beads[i].h*(1-o.beads[i].eat*0.7);return m;}
function objMaxH(o){var m=0;for(var i=0;i<o.beads.length;i++) m=Math.max(m,o.beads[i].h);return m;}
// world positions of beads (center + radius)
function beadPositions(o,bx,by,sc){
  bx=bx===undefined?o.x:bx; by=by===undefined?o.y:by; sc=sc||o.scale;
  var n=o.beads.length, out=[], i, rr;
  if(o.kind==='single'){ rr=beadR(o.beads[0]?o.beads[0].h:0.5)*sc; for(i=0;i<n;i++) out.push({x:bx,y:by-rr,r:rr}); }
  else if(o.kind==='skewer'){
    var rmax=0,tot=0; for(i=0;i<n;i++){rr=beadR(o.beads[i].h)*sc; rmax=Math.max(rmax,rr); tot+=rr*2+1.5*S*sc;}
    var u=-tot/2, ca=Math.cos(o.ang), sa=Math.sin(o.ang);
    for(i=0;i<n;i++){rr=beadR(o.beads[i].h)*sc; u+=rr; out.push({x:bx+ca*u,y:by+sa*u-rmax,r:rr,u:u}); u+=rr+1.5*S*sc;}
    out.rmax=rmax; out.tot=tot;
  }else{
    var rows=[[1],[2],[2,1],[3,1],[3,2],[3,2,1],[3,3,1]][Math.max(0,n-1)]||[3,3,1];
    var avg=0; for(i=0;i<n;i++) avg+=beadR(o.beads[i].h)*sc; avg/=Math.max(1,n);
    var idx=0;
    for(var rI=0;rI<rows.length;rI++){
      var cnt=rows[rI];
      for(var j=0;j<cnt&&idx<n;j++,idx++){
        rr=beadR(o.beads[idx].h)*sc;
        out.push({x:bx+(j-(cnt-1)/2)*avg*1.75,y:by-avg-rI*avg*1.35-(rr-avg)*0.5,r:rr});
      }
    }
  }
  return out;
}
function objHit(o,x,y){
  var bp=beadPositions(o), pad=16*S, i;
  for(i=0;i<bp.length;i++) if(dist(x,y,bp[i].x,bp[i].y)<bp[i].r+pad) return true;
  if(o.kind==='skewer'&&bp.length){
    var a=bp[0], b=bp[bp.length-1]; var t=clamp(((x-a.x)*(b.x-a.x)+(y-a.y)*(b.y-a.y))/(Math.pow(b.x-a.x,2)+Math.pow(b.y-a.y,2)+0.01),0,1);
    if(dist(x,y,lerp(a.x,b.x,t),lerp(a.y,b.y,t))<bp.rmax+pad) return true;
  }
  return dist(x,y,o.x,o.y)<28*S;
}
function sproutDims(sp){return {ht:(26+44*sp.h)*S, bw:(19+11*sp.h)*S};}
function sproutHit(sp,x,y){
  var d=sproutDims(sp), cx=sp.x+Math.sin(sp.ang)*d.ht*0.45, cy=sp.y-Math.cos(sp.ang)*d.ht*0.45;
  return dist(x,y,cx,cy)<Math.max(30*S,d.ht*0.55) || dist(x,y,sp.x,sp.y-6*S)<28*S;
}

// ---------- particles ----------
function addPart(p){ if(G.parts.length>=MAX_PARTS) G.parts.shift(); p.t=0; G.parts.push(p); }
function inkSplash(x,y,n,spd,size,alpha){
  for(var i=0;i<n;i++){var a=rand(0,TAU),v=rand(0.3,1)*spd*S; addPart({k:'dot',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*S*0.3,g:220*S,life:rand(0.35,0.7),r:rand(0.6,1.4)*size*S,a:alpha||0.6});}
}
function flicks(x,y,n,len){
  for(var i=0;i<n;i++){var a=-PI/2+rand(-1.2,1.2); addPart({k:'flick',x:x,y:y,ang:a,len:rand(0.6,1)*len*S,life:0.35,a:0.55});}
}
function ring(x,y,r0,r1,life,a){addPart({k:'ring',x:x,y:y,r0:r0,r1:r1,life:life,a:a||0.3});}
function crumbs(x,y,n){for(var i=0;i<n;i++){var a=rand(-PI,0),v=rand(40,110)*S; addPart({k:'crumb',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:300*S,life:rand(0.4,0.7),r:rand(1.2,2.6)*S});}}

//  SPROUTS
// ============================================================
function handlePos(){return {x:L.mx+Math.cos(G.rot)*R*1.3,y:L.my+Math.sin(G.rot)*R*1.3};}
function freeSpot(x,y,minD,ignore){
  var i;
  for(i=0;i<G.sprouts.length;i++){var s=G.sprouts[i]; if(s!==ignore&&dist(x,y,s.x,s.y)<minD) return false;}
  for(i=0;i<G.objs.length;i++){var o=G.objs[i]; if(o.tray<0&&!o.carried&&dist(x,y,o.x,o.y)<minD) return false;}
  if(dist(x,y,L.zone.x,L.zone.y)<L.zone.r+16*S) return false;
  return true;
}
function findSpawnPos(){
  var molds=moldsFor(G.layout), i, m;
  var order=molds.map(function(_,k){return k;});
  for(i=0;i<order.length;i++){
    m=molds[order[i]];
    if(freeSpot(m.x,m.y,30*S)){
      var sgn=(G.spawnedInBatch%2?1:-1);
      return clampToPlate({x:m.x+rand(-10,10)*S,y:m.y+sgn*rand(12,22)*S},0.85);
    }
  }
  for(i=0;i<40;i++){
    var p={x:L.mcx+rand(-1.9,1.6)*L.d,y:L.mcy+rand(-1.3,1.3)*L.d};
    clampToPlate(p,0.82);
    if(freeSpot(p.x,p.y,34*S)) return p;
  }
  return clampToPlate({x:L.mcx+rand(-2,2)*L.d,y:L.mcy+rand(-1,1)*L.d},0.82);
}
function spawnSprout(){
  var idx=G.sprouts.length, p=findSpawnPos();
  var tilt=(Math.random()<0.5?-1:1)*rand(0.42,0.8);
  var sp={id:G.idc++,x:p.x,y:p.y,h:rand(0.3,0.38),ang:tilt,tgt:tilt,up:false,pop:0,sq:0,sqv:0,grab:null,seed:Math.random()*1000,hop:0,fade:1,born:G.t,ox:p.x,oy:p.y,wob:0};
  G.sprouts.push(sp);
  G.spawnedInBatch++;
  sfx.pop(idx);
  var hp=handlePos();
  for(var i=0;i<4;i++) addPart({k:'fly',x0:hp.x,y0:hp.y,x1:p.x,y1:p.y-8*S,life:0.22+i*0.04,d:i*0.03,r:(2.6-i*0.4)*S,a:0.7});
  flicks(p.x,p.y-4*S,5,12); inkSplash(p.x,p.y,5,90,2,0.5);

function analyze(list){

function mkSparrow(x,y){

function queue(sp,a){sp.acts.push(a);}

    a._tx=tx; a._ty=ty;

    if(a.fly===undefined) a.fly=dd>150*S;
    a.d=a.d||(a.fly?clamp(dd/(260*S),0.7,1.6):clamp(dd/(150*S),0.18,1.1));

function runActs(sp,dt){

  }
  var a=sp.act; sp.at+=dt;

    if(a.fly){ sp.fly=k<1; sp.hopY=Math.sin(PI*k)*Math.min(120*S,dist(a.sx,a.sy,a._tx,a._ty)*0.35); }
    else { sp.fly=false; var hp=Math.abs(Math.sin(PI*k*a.nh)); sp.hopY=hp*7*S;

function beadSide(o,side){var bp=beadPositions(o);var p=bp[bp.length-1]||{x:o.x,y:o.y-10*S,r:10*S};return {x:p.x+side*(p.r+13*S),y:Math.max(p.y+p.r,o.y)+3*S};}

        else { sp.hopY=0; sp.feastPeck+=dt; var ph2=(sp.feastPeck%0.4)/0.4; sp.peck=ph2<0.5?Math.sin(ph2*2*PI):0;

function newCycle(){

  if(G.phase===2){ G.phase=1; G.trayTarget=0;
    for(var i=0;i<7;i++){var o=G.tray[i]; if(o){ var p=slotPos(i); G.tray[i]=null; o.tray=-1; o.scale=1; var q=clampToPlate({x:L.mcx+rand(-1,1)*L.d,y:L.mcy+rand(-0.8,0.8)*L.d},0.8); o.tx=q.x; o.ty=q.y; o.x=p.x; o.y=p.y; } }

function onMove(e){

    if(dist(p.x,p.y,L.mx,L.my)>R*0.18){ var d=angDiff(a,p.lastAng); G.pendRot+=d/Math.max(1,G.rimPtrs); }
    p.lastAng=a;

    if(p.moved){ p.ref.x=p.x+p.ox; p.ref.y=p.y+p.oy; }

function release(p,cancel){

        var dtt=a.t-b.t; if(dtt>0.01){ var v=(a.a-b.a)/dtt; G.spinV=clamp(v*0.6,-7,7); } }
    }
  }else if(p.kind==='sprout'&&p.ref){

    if(!p.moved&&!cancel&&now-p.t0<0.7){ uprightSprout(sp); }
    else dropSprout(sp);
  }else if(p.kind==='obj'&&p.ref){
    var o=p.ref; o.grab=null; o.lift=0;

function dropSprout(sp){

    if(dist(sp.x,sp.y,L.zone.x,L.zone.y)<L.zone.r){ sp.tx=sp.ox; sp.ty=sp.oy; }
    else { var q=clampToPlate({x:sp.x,y:sp.y},0.88); sp.tx=q.x; sp.ty=q.y; }
    sp.sqv-=2; return;
  }

  for(var r0=0;r0<G.sprouts.length;r0++){var nb=G.sprouts[r0]; if(nb===sp) continue; var ddx=Math.abs(nb.x-sp.x), ddy=Math.abs(nb.y-sp.y);
    if(ddx>30*S&&ddx<80*S&&ddy<11*S){ sp.tx=sp.x; sp.ty=nb.y; sp.sqv-=3; sfx.drop(); return; } }

    var taken=G.sprouts.some(function(o){return o!==sp&&dist(o.x,o.y,m.x,m.y)<14*S;});
    if(!taken){bd=d;best=m;}
  }
  if(best){ sp.tx=best.x; sp.ty=best.y; ring(best.x,best.y-6*S,4*S,22*S,0.35,0.25); sfx.drop(); }

    // line up with a neighbor (helps make a row)

function dropObj(o){

function computeInvite(){
  if(G.feast||G.forming) return null;
  if(G.after) return {k:'mortar'};
  var tilted=G.sprouts.filter(function(s){return !s.up;});
  if(tilted.length&&(G.sprouts.length>=3||G.sprouts.length>=MAX_SPROUTS)){
    tilted.sort(function(a,b){return a.born-b.born;}); return {k:'sprout',ref:tilted[0]};
  }
  if(!tilted.length){
    var waiting=G.objs.filter(function(o){return !o.claimed&&!o.inZone&&o.tray<0&&!o.carried&&o.formK>=1&&!o.feast;});
    if(waiting.length&&G.sparrows.some(function(s){return !s.busy;})){
      waiting.sort(function(a,b){return objMaxH(b)-objMaxH(a);}); return {k:'obj',ref:waiting[0]};
    }
  }
  return {k:'mortar'};
}
function update(dt){
  G.t+=dt; G.frameCount++;
  // --- rotation ---
  var before=G.rot;
  if(G.rimPtrs>0){
    if(G.pendRot!==0){ applyRot(G.pendRot); G.pendRot=0; }
    var nowS=performance.now()/1000;
    ptrs.forEach(function(p){ if(p.kind==='rim'){ p.hist.push({t:nowS,a:G.rot}); if(p.hist.length>12) p.hist.shift(); } });
    if(Math.abs(G.spinV)>0.01){ applyRot(G.spinV*dt); }
    G.spinV*=Math.exp(-dt*9);
  }else{
    G.pendRot=0;
    if(Math.abs(G.spinV)>0.02){ applyRot(G.spinV*dt); G.spinV*=Math.exp(-dt*2.6); } else G.spinV=0;
  }
  var om=dt>0?(G.rot-before)/dt:0; G.omega=lerp(G.omega,om,clamp(dt*12,0,1));
  if(AC&&rumbleG&&AC.state==='running'){
    var lv=Math.min(1,Math.abs(G.omega)/5); if(Math.abs(lv-rumbleLvl)>0.01){ rumbleLvl=lv;
      try{ rumbleG.gain.setTargetAtTime(lv*0.55,AC.currentTime,0.05); rumbleF.frequency.setTargetAtTime(70+lv*260,AC.currentTime,0.05); lfo.frequency.setTargetAtTime(5+lv*10,AC.currentTime,0.1);}catch(e){} }
  }

  G.rimPulse=Math.max(0,G.rimPulse-dt*2);

  // --- safety: drop grabs whose pointer is gone (never leave anything stuck) ---
  if(G.frameCount%15===0){
    var held={}; ptrs.forEach(function(p){ if((p.kind==='sprout'||p.kind==='obj')&&p.ref) held[p.ref.id]=p.id; });
    G.sprouts.forEach(function(s){ if(s.grab!==null&&held[s.id]!==s.grab) s.grab=null; });
    G.objs.forEach(function(o){ if(o.grab!==null&&held[o.id]!==o.grab){ o.grab=null; o.lift=0; } });
  }
  // --- sprouts ---
  G.sprouts.forEach(function(s){

    s.ang=lerp(s.ang,s.tgt,clamp(dt*14,0,1));
    s.sqv+=(-s.sq*170-s.sqv*11)*dt; s.sq+=s.sqv*dt;

      if(!anyWaiting&&!G.sprouts.length&&k===0&&!G.after){ sp.peekT-=dt; if(sp.peekT<=0){ sp.peekT=rand(4.5,6.5); sp.peekDur=1.3; sp.gazeHold={x:L.mx,y:L.my,t:1.3}; } }
      if(sp.peekDur>0){ sp.peekDur-=dt; sp.lean=Math.min(1,sp.lean+dt*4);} else sp.lean=Math.max(0,sp.lean-dt*3);

    }
  }

  var idle=G.t-G.lastInput;
  if(!G.demo&&!G.demoUsed&&idle>4&&ptrs.size===0&&G.invite&&!G.feast){ G.demo={k:G.invite.k,ref:G.invite.ref,t:0}; G.demoUsed=true; }

}

function drawSprout(sp,form){

  var inv=G.invite&&G.invite.k==='sprout'&&G.invite.ref===sp&&!G.demo;

  if(form){ var k=clamp(form/0.38,0,1); fade=1-k; round=k; }

  ctx.save(); ctx.translate(sp.x,sp.y);
  // soil smear

  }else if(d.k==='sprout'&&d.ref){
    var tx=d.ref.x, ty=d.ref.y-24*S; var k=ease(t/0.7);
    hx=lerp(tx+60*S,tx,k); hy=lerp(ty+70*S,ty,k); press=(t>0.8&&t<1.1)||(t>1.4&&t<1.7)?1:0;
  }else if(d.k==='obj'&&d.ref){
    var ox=d.ref.x, oy=d.ref.y-14*S, tgt=(G.phase===2&&!G.after)?{x:L.mx,y:L.my}:{x:L.zone.x,y:L.zone.y-10*S};
    if(t<0.6){ var k1=ease(t/0.6); hx=lerp(ox+50*S,ox,k1); hy=lerp(oy+60*S,oy,k1); }
    else { var k3=ease((t-0.8)/1.3); hx=lerp(ox,tgt.x,k3); hy=lerp(oy,tgt.y,k3); press=t<2.2?1:0;
      if(press&&t>0.8){ ctx.globalAlpha=0.35*al; drawObj(d.ref,hx,hy+14*S,d.ref.scale); ctx.globalAlpha=1; } }
  }else return;
  if(press){ ctx.strokeStyle=ink(0.22*al); ctx.lineWidth=2*S; ctx.beginPath(); ctx.arc(hx,hy,(12+Math.sin(t*12)*2)*S,0,TAU); ctx.stroke(); }
  ctx.save(); ctx.globalAlpha=al*0.95; var w=70*S,h=110*S; ctx.translate(hx,hy); var s=press?0.92:1; ctx.scale(s,s); ctx.drawImage(handC,-14*S,-10*S,w,h); ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(paperC,0,0,W,H);
  drawNight();
  drawMoon();
  drawNest();
  drawPlate();
  // highlight where a dragged dango can go
  var drag=null; ptrs.forEach(function(p){ if(p.kind==='obj'&&p.moved) drag=p.ref; });
  if(drag){
    var ph=(G.t%1)/1;
    if(G.phase===2&&!G.after){ ctx.strokeStyle=ink(0.25*(1-ph)); ctx.lineWidth=3*S; ctx.beginPath(); ctx.arc(L.mx,L.my,L.trayR*(1+ph*0.25),0,TAU); ctx.stroke(); }
    else { var z=L.zone; ctx.strokeStyle=ink(0.25*(1-ph)); ctx.lineWidth=3*S; ctx.beginPath(); ctx.arc(z.x,z.y,z.r*(0.9+ph*0.3),0,TAU); ctx.stroke(); }
  }
  drawMortar();
  // tray dango (rotate with the stone)
  for(var i=0;i<7;i++){ var o=G.tray[i]; if(o&&o.grab===null) drawObj(o); }
  // depth-sorted ground things
  var list=[];
  if(!G.forming) G.sprouts.forEach(function(s){ if(s.grab===null) list.push({y:s.y,k:0,r:s}); });
  if(G.forming) G.forming.list.forEach(function(s){ list.push({y:s.y,k:3,r:s}); });
  G.objs.forEach(function(o){ if(o.grab===null&&o.tray<0&&!o.carried) list.push({y:o.y,k:1,r:o}); });
  G.sparrows.forEach(function(s){ if(!s.fly) list.push({y:s.y,k:2,r:s}); });
  list.sort(function(a,b){return a.y-b.y;});
  for(i=0;i<list.length;i++){ var it=list[i];
    if(it.k===0) drawSprout(it.r); else if(it.k===3) drawSprout(it.r,G.forming.t); else if(it.k===1) drawObj(it.r); else drawSparrow(it.r); }
  G.sparrows.forEach(function(s){ if(s.fly) drawSparrow(s); });
  // dragged things on top
  ptrs.forEach(function(p){ if(p.kind==='sprout'&&p.ref) drawSprout(p.ref); else if(p.kind==='obj'&&p.ref) drawObj(p.ref); });
  drawParts();
  drawDemo();
}

// ============================================================
//  LOOP, RESIZE, VISIBILITY
// ============================================================
function frame(now){
  if(!running) return;
  var dt=(now-lastT)/1000; lastT=now; if(!(dt>=0)) dt=0; if(dt>0.05) dt=0.05;
  try{ update(dt); draw(); }catch(err){ if(window.console) console.warn(err); }
  raf=requestAnimationFrame(frame);
}
var resizeTimer=0;
function remapPoint(o,old){
  var nx=(o.x-old.px)/old.rx, ny=(o.y-old.py)/old.ry; o.x=L.px+nx*L.rx; o.y=L.py+ny*L.ry;
  if(o.tx!=null){var tx=(o.tx-old.px)/old.rx, ty=(o.ty-old.py)/old.ry; o.tx=L.px+tx*L.rx; o.ty=L.py+ty*L.ry;}
}
function resize(){
  var old=L.ok?{px:L.px,py:L.py,rx:L.rx,ry:L.ry}:null;
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight); DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  readSA(); computeLayout();
  if(old){
    releaseAll();
    G.sprouts.forEach(function(s){remapPoint(s,old); s.ox=s.x; s.oy=s.y;});
    if(G.forming) finishForming();
    G.objs.forEach(function(o){ if(o.tray<0&&!o.carried){ remapPoint(o,old); o.beads.forEach(function(b){b.fx=o.x;b.fy=o.y;}); } });
    G.sparrows.forEach(function(sp,k){
      if(sp.carry){ while(sp.carry.beads.length){ sp.carry.beads.pop(); eatenOne(sp.x,sp.y);} sp.carry=null; if(G.sparrows.length<MAX_SPARROWS) G.sparrows.push(mkSparrow(L.nest.x,L.nest.y)); }
    });
    G.objs.forEach(function(o){ if(!G.feast) o.claimed=false; });
    G.sparrows.forEach(function(sp,k){ cancelActs(sp); var p=G.feast?feastSpot(k,G.sparrows.length,G.feast.t):perchPos(k); sp.x=p.x; sp.y=p.y; sp.busy=!!G.feast; });
    G.parts=[]; G.trail=[];
  }
  rebuildAll();
}
window.addEventListener('resize',function(){ clearTimeout(resizeTimer); resizeTimer=setTimeout(resize,120); });
window.addEventListener('orientationchange',function(){ clearTimeout(resizeTimer); resizeTimer=setTimeout(resize,250); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    running=false; cancelAnimationFrame(raf); releaseAll();
    if(AC){ try{ rumbleG.gain.setValueAtTime(0,AC.currentTime); AC.suspend(); }catch(e){} }
  }else{
    if(AC){ try{ AC.resume(); }catch(e){} }
    if(!running){ running=true; lastT=performance.now(); raf=requestAnimationFrame(frame); }
  }
});
window.addEventListener('pagehide',function(){ releaseAll(); if(AC){try{AC.suspend();}catch(e){}} });

// ---------- start ----------
resize();
G.layout=desiredLayout(); plateC=buildPlate(G.layout);
G.sparrows.push(mkSparrow(0,0)); var p0=perchPos(0); G.sparrows[0].x=p0.x; G.sparrows[0].y=p0.y;
G.mortarSeed=1+Math.floor(Math.random()*1000); buildMortar();
lastT=performance.now(); raf=requestAnimationFrame(frame);

// read-only hooks for automated checks (no effect on play)
window.__gf={G:G,L:L,get S(){return S;},get R(){return R;},beadPositions:beadPositions,slotPos:slotPos,perchPos:perchPos,moldsFor:moldsFor};
})();
</script>
