<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ぺたり、こんこん</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#120904;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
/* ---------- palette: two ambers + black only ---------- */
const K='#120904', A='#F6B54F', B='#C9681E';
const TAU=Math.PI*2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const appr=(a,b,r)=>a+(b-a)*Math.min(1,r);
const mv=(a,b,s)=>a<b?Math.min(b,a+s):Math.max(b,a-s);
const bump=t=>t<=0||t>=1?0:Math.sin(Math.PI*t);
function rng(seed){let s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const FX=rng(777); // cosmetic randomness only (leaf flutter, gesture timing)

let W=1,H=1,DPR=1,S=60,portrait=true;
const SA={t:0,r:0,b:0,l:0};
const shoji={x:0,y:0,w:1,h:1}, stage={x:0,y:0,w:1,h:1};
const shelf={x:0,y:0,w:1,h:1,slot:60,cx:[0,0,0,0],cy:0};
const IDS=['house','tree','boat','moon'];
const SLOT={house:0,tree:1,boat:2,moon:3};

/* ---------- torn-paper silhouettes (unit = S, origin = base point) ---------- */
const SH={};
(function(){
  const R=rng(20261101);
  const j=a=>(R()*2-1)*a;
  function rp(pts,amp,step){amp=amp==null?0.012:amp;step=step||0.03;const out=[];
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const dx=b[0]-a[0],dy=b[1]-a[1];
      const len=Math.hypot(dx,dy)||1e-6;const n=Math.max(1,Math.ceil(len/step));const nx=-dy/len,ny=dx/len;
      for(let k=0;k<n;k++){const t=k/n;const q=k===0?j(amp*0.3):j(amp);out.push([a[0]+dx*t+nx*q,a[1]+dy*t+ny*q]);}}
    return out;}
  function rc(cx,cy,r,amp){amp=amp==null?0.012:amp;const n=Math.max(16,Math.round(r*110));const o=[];
    for(let i=0;i<n;i++){const a=i/n*TAU;const rr=r+j(amp);o.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return o;}
  function rr(x0,y0,x1,y1,amp){return rp([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],amp);}
  SH.house={body:rr(-0.46,-0.63,0.46,0),win:rr(0.06,-0.5,0.36,-0.26,0.007),door:rr(-0.34,-0.42,-0.1,-0.03,0.007),
    roof:rp([[-0.64,-0.6],[0.64,-0.6],[0.38,-0.94],[-0.38,-0.94]]),ridge:rr(-0.44,-1.0,0.44,-0.92),chim:rr(0.2,-1.1,0.31,-0.9)};
  SH.tree={trunk:rp([[-0.1,0],[0.1,0],[0.06,-0.5],[0.22,-0.7],[0.18,-0.74],[0.03,-0.6],[-0.03,-0.6],[-0.19,-0.76],[-0.23,-0.72],[-0.06,-0.5]]),
    blobs:[[0,-0.92,0.32],[-0.3,-0.78,0.24],[0.3,-0.78,0.24],[-0.17,-1.15,0.22],[0.18,-1.13,0.22],[0,-1.26,0.16]].map(b=>rc(b[0],b[1],b[2],0.018))};
  SH.leaf=rp([[-0.5,0],[-0.2,-0.3],[0.25,-0.26],[0.5,0],[0.25,0.26],[-0.2,0.3]],0.035,0.12);
  SH.boat=rp([[-0.76,-0.28],[-0.6,-0.12],[0.6,-0.12],[0.76,-0.28],[0.62,0.02],[0.42,0.07],[-0.42,0.07],[-0.62,0.02]],0.012);
  (function(){const oc=[0,-0.47],orr=0.36,ic=[0.19,-0.57],ir=0.32,n=120,pts=[];
    const inI=(x,y)=>Math.hypot(x-ic[0],y-ic[1])<ir, inO=(x,y)=>Math.hypot(x-oc[0],y-oc[1])<orr;
    let st=0;for(let i=0;i<n;i++){const a=i/n*TAU,a2=(i-1)/n*TAU;if(!inI(oc[0]+Math.cos(a)*orr,oc[1]+Math.sin(a)*orr)&&inI(oc[0]+Math.cos(a2)*orr,oc[1]+Math.sin(a2)*orr)){st=i;break;}}
    for(let k=0;k<n;k++){const a=(st+k)/n*TAU;const x=oc[0]+Math.cos(a)*orr,y=oc[1]+Math.sin(a)*orr;if(inI(x,y))break;const q=1+j(0.03);pts.push([oc[0]+Math.cos(a)*orr*q,oc[1]+Math.sin(a)*orr*q]);}
    const ang=Math.atan2(pts[pts.length-1][1]-ic[1],pts[pts.length-1][0]-ic[0]);
    for(let k=0;k<n;k++){const a=ang-k/n*TAU;const x=ic[0]+Math.cos(a)*ir,y=ic[1]+Math.sin(a)*ir;if(k>2&&!inO(x,y))break;if(inO(x,y)){const q=1+j(0.03);pts.push([ic[0]+Math.cos(a)*ir*q,ic[1]+Math.sin(a)*ir*q]);}}
    SH.moon=pts;})();
  SH.card=[0,1,2,3].map(()=>rr(-0.5,-0.5,0.5,0.5,0.018));
  SH.bit=[0,1,2].map(()=>rp([[-0.5,-0.4],[0.4,-0.5],[0.5,0.3],[-0.3,0.5]],0.08,0.3));
})();
const TREE_LEAF=[[-0.52,-0.7,0.6],[0.54,-0.74,-0.5],[-0.4,-1.2,0.9],[0.42,-1.18,-0.8],[0.02,-1.44,1.5],[-0.14,-0.58,0.2]];
const SAIL_LEAF=[[-0.02,-0.9,1.4],[0.06,-0.78,1.1],[-0.01,-0.66,1.5],[0.15,-0.64,0.9],[0.04,-0.52,1.5],[0.25,-0.5,0.8]];
const HB={house:[0,-0.5,0.62,0.56],tree:[0,-0.7,0.52,0.72],boat:[0,-0.2,0.76,0.4],moon:[0,-0.47,0.46,0.46]};
const POSE={open:[1,1,1,1,1,0.17],point:[1,0.22,0.2,0.2,0.45,0.04],flat:[1,1,1,1,0.55,0.0],
  fist:[0.2,0.2,0.2,0.2,0.3,0.02],pinch:[0.5,0.25,0.22,0.2,0.7,0.03],cup:[0.85,0.92,0.92,0.85,0.85,0.07]};

function poly(p,ox,oy){ox=ox||0;oy=oy||0;ctx.moveTo(p[0][0]+ox,p[0][1]+oy);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0]+ox,p[i][1]+oy);ctx.closePath();}
function rrect(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arc(x+w-r,y+r,r,-Math.PI/2,0);ctx.lineTo(x+w,y+h-r);ctx.arc(x+w-r,y+h-r,r,0,Math.PI/2);ctx.lineTo(x+r,y+h);ctx.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);ctx.lineTo(x,y+r);ctx.arc(x+r,y+r,r,Math.PI,Math.PI*1.5);ctx.closePath();}

/* ---------- layout ---------- */
function readSA(){const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}
function layout(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  portrait=H>=W;
  const availW=W-SA.l-SA.r;
  const shelfH=clamp(H*0.15,92,150);
  const shelfTop=H-SA.b-shelfH;
  const top=SA.t+Math.max(18,H*0.035);
  const shH=Math.max(120,shelfTop-10-top);
  const shW=portrait?availW*0.8:Math.min(availW*0.62,shH*1.4);
  shoji.x=SA.l+(availW-shW)/2;shoji.y=top;shoji.w=shW;shoji.h=shH;
  stage.x=SA.l+8;stage.y=top;stage.w=availW-16;stage.h=shH;
  S=clamp(portrait?Math.min(shW*0.23,shH*0.17):Math.min(shW*0.16,shH*0.17),46,120);
  shelf.x=SA.l+8;shelf.w=availW-16;shelf.y=shelfTop;shelf.h=shelfH;
  shelf.slot=Math.min(shelfH*0.72,shelf.w/4.9);
  const span=Math.min(shelf.w,shelf.slot*4*1.55);
  for(let i=0;i<4;i++)shelf.cx[i]=shelf.x+shelf.w/2+(i-1.5)*span/4;
  shelf.cy=shelfTop+shelfH*0.5;
}
const ux=u=>shoji.x+u*shoji.w, vy=v=>shoji.y+v*shoji.h, toU=x=>(x-shoji.x)/shoji.w, toV=y=>(y-shoji.y)/shoji.h;

/* ---------- audio (Web Audio synth) ---------- */
let AC=null,master=null,noiseBuf=null,dragSnd=null;
const PENT=[1,9/8,5/4,3/2,5/3,2,9/4];
function audioInit(){
  if(!AC){
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();master=AC.createGain();master.gain.value=0.75;
      const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);
      const r=rng(99);for(let i=0;i<d.length;i++)d[i]=r()*2-1;
      const sb=AC.createBufferSource();sb.buffer=AC.createBuffer(1,1,22050);sb.connect(AC.destination);sb.start(0);
    }catch(e){AC=null;return;}
  }
  if(AC&&AC.state==='suspended'){try{AC.resume().catch(()=>{});}catch(e){}}
}
const now=()=>AC?AC.currentTime:0;
function envG(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function osc(type,f,t,dur,vol,f2,a){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);envG(g,t,a||0.004,vol,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+(a||0.004)+dur+0.05);}catch(e){}}
function nz(t,dur,vol,type,f,q,a){if(!AC)return;try{const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();envG(g,t,a||0.003,vol,dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+(a||0.003)+dur+0.05);}catch(e){}}
function pluck(f,t,v){osc('triangle',f,t,0.55,v||0.16);osc('sine',f*2,t,0.25,(v||0.16)*0.35);}
const SFX={
  press(){const t=now();nz(t,0.05,0.12,'bandpass',2600,1.2);},
  drop(){const t=now();nz(t,0.13,0.32,'lowpass',1700,0.7);nz(t+0.025,0.09,0.18,'bandpass',800,1.4);osc('sine',150,t,0.08,0.12,90);},
  knock(lv){const t=now(),m=PENT[lv%7];for(let i=0;i<2;i++){osc('sine',480*m,t+i*0.13,0.08,0.35,330*m);nz(t+i*0.13,0.03,0.25,'bandpass',1300*m,5);}
    osc('triangle',392*m,t+0.36,0.16,0.12);osc('triangle',523*m,t+0.52,0.3,0.12);nz(t+0.2,0.25,0.06,'bandpass',600,0.8,0.08);},
  rustle(lv){const t=now();for(let i=0;i<6+lv*2;i++)nz(t+i*0.045+Math.random()*0.03,0.06,0.09+lv*0.015,'highpass',3200+Math.random()*1800,0.7);pluck(330*PENT[(lv+2)%7],t+0.1,0.1);},
  plonk(lv){const t=now(),m=PENT[lv%7];osc('sine',200*m,t,0.28,0.4,120*m);nz(t+0.02,0.32,0.16,'bandpass',1400,0.7,0.02);pluck(294*m,t+0.25,0.1);},
  splash(){const t=now();nz(t,0.25,0.14,'bandpass',2200,0.6,0.01);},
  cradle(lv){const t=now(),m=PENT[lv%7];osc('sine',140*m,t,0.4,0.25,110*m);pluck(440*m,t+0.15,0.1);pluck(392*m,t+0.6,0.1);},
  chime(lv){const t=now(),m=PENT[lv%7];osc('sine',880*m,t,1.4,0.18);osc('sine',1760*m,t,0.6,0.05);osc('sine',1320*m,t+0.18,1.0,0.07);},
  shoji(){const t=now();nz(t,1.1,0.22,'bandpass',650,0.9,0.25);nz(t+0.1,0.9,0.1,'highpass',2400,0.7,0.3);},
  taiko(){const t=now();osc('sine',120,t,0.5,0.6,48);nz(t,0.12,0.25,'lowpass',260,0.9);osc('sine',120,t+0.35,0.4,0.4,50);},
  fanfare(){const t=now();[392,440,523,587,659,784].forEach((f,i)=>pluck(f,t+i*0.11,0.15));},
  homeTune(){const t=now();[659,587,523,440,523].forEach((f,i)=>pluck(f,t+i*0.16,0.15));},
  moonTune(){const t=now();[523,659,784,1046].forEach((f,i)=>osc('sine',f,t+i*0.14,0.9,0.12));},
  clap(){const t=now();nz(t,0.035,0.26,'bandpass',1700+Math.random()*600,1.1);},
  puff(){const t=now();nz(t,0.07,0.08,'lowpass',900,0.8);osc('sine',260,t,0.06,0.05,200);},
  step(){const t=now();nz(t,0.03,0.05,'lowpass',700,0.8);},
  pick(){const t=now();nz(t,0.06,0.14,'bandpass',3200,1);osc('sine',660,t,0.05,0.04,880);}
};
function dragSoundStart(){if(!AC||dragSnd)return;try{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2800;f.Q.value=0.8;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();dragSnd={s,g,f};}catch(e){}}
function dragSoundSet(v){if(!dragSnd||!AC)return;try{dragSnd.g.gain.setTargetAtTime(clamp(v/2500,0,0.16),AC.currentTime,0.03);dragSnd.f.frequency.setTargetAtTime(2200+clamp(v,0,2000),AC.currentTime,0.05);}catch(e){}}
function dragSoundStop(){if(!dragSnd)return;const d=dragSnd;dragSnd=null;try{d.g.gain.setTargetAtTime(0,AC.currentTime,0.03);d.s.stop(AC.currentTime+0.2);}catch(e){}}

/* ---------- state ---------- */
let T=0;
function mkItem(id){return{id,placed:false,u:0.5,v:0.5,seq:0,replied:false,level:0,lastTap:-99,
  sx:1,sy:1,vsx:0,vsy:0,tsx:1,tsy:1,rot:0,vrot:0,trot:0,lift:0,liftUntil:0,hop:0,hopV:0,snapX:0,snapY:0,offPaper:false,carry:false,
  tilt:0,tiltV:0,
  win:0,winTo:0,slideDir:1,style:'slide',resWin:0,resUntil:0,resStay:false,bowT0:-99,bowAmp:0,outUntil:0,out:0,broomUntil:0,door:0,doorUntil:0,
  sway:0,swayV:0,
  glide:0,glideV:0,waveAmp:0,waveX0:0,rock:0,rockUntil:0,rockAmp:0,rowUntil:0,waveUntil:0,face:1,faceCur:1,look:0,lant:0,sailT:0,sailFill:0,sailU:null,passenger:0,lifted:0,
  reflX:0,refl:0};}
let G=null;
function newRound(){G={phase:'shoji',items:{},seq:0,lastTapped:null,openP:0,openWait:0,openT0:0,story:null,actor:null,fin:null,clean:null,special:false,audience:0,phaseT:T,round:(G?G.round+1:1)};
  IDS.forEach(id=>G.items[id]=mkItem(id));}
const D={HT:false,TB:false,HB:false,chain:false,sail:false,moonTgt:null,moonActive:false,lant:false,welcome:false,special:false};

/* ---------- geometry helpers ---------- */
function anchor(it){return{x:ux(it.id==='boat'&&it.sailU!=null?it.sailU:it.u),y:vy(it.v)};}
function vpos(it){const p=anchor(it);let x=p.x+it.snapX,y=p.y+it.snapY-it.hop*S;
  if(it.id==='boat'){x+=it.glide*S;y-=it.lifted*0.3*S;if(it.v>0.5)y+=Math.sin(T*1.7)*0.025*S;}
  return{x,y};}
function on(it){return it.placed&&!it.offPaper&&!it.carry;}
function near(a,b){if(!on(a)||!on(b))return false;const dx=Math.abs(a.u-b.u)*shoji.w/S,dy=Math.abs(a.v-b.v)*shoji.h/S;
  return(a.id==='boat'||b.id==='boat')?(dx<2.5&&dy<2.1):(dx<2.2&&dy<1.15);}
function moonOverP(m,p){if(!on(m))return false;const mp=anchor(m);const dx=Math.abs(mp.x-p.x)/S,dy=(p.y-mp.y)/S;return dx<1.2&&dy>0.95&&dy<7;}
function paperRect(){const p=G.openP;return{x:lerp(shoji.x,stage.x,p),y:shoji.y,w:lerp(shoji.w,stage.w,p),h:shoji.h};}
function doorPt(){const h=G.items.house,p=vpos(h);return{x:p.x-0.22*S,y:p.y};}
function treePt(fromX){const t=G.items.tree,p=vpos(t);const side=fromX<p.x?-1:1;return{x:p.x+side*0.32*S,y:p.y};}
function boatPt(){const p=vpos(G.items.boat);return{x:p.x,y:p.y-0.05*S};}
function waterY(p){return Math.max(p.y+0.12*S,vy(0.5)+0.3*S);}

/* ---------- particles ---------- */
const parts=[];const MAXP=90;
function addP(type,x,y,vx,vy,size,life){if(parts.length>=MAXP)parts.shift();parts.push({type,x,y,vx,vy,size,life,max:life,rot:FX()*TAU,vr:(FX()-0.5)*8,k:(FX()*3)|0});}
function bits(x,y,n,sp){for(let i=0;i<n;i++){const a=FX()*TAU,s=(sp||1)*S*(0.8+FX()*1.6);addP('bit',x,y,Math.cos(a)*s,Math.sin(a)*s-S*1.2,S*(0.05+FX()*0.05),0.7+FX()*0.4);}}
function sparks(x,y,n,r){for(let i=0;i<n;i++){const a=i/n*TAU+FX()*0.4;addP('spark',x+Math.cos(a)*r,y+Math.sin(a)*r,Math.cos(a)*S*0.6,Math.sin(a)*S*0.6,S*(0.08+FX()*0.05),0.6+FX()*0.3);}}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
  if(p.type==='leaf'){p.vx+=Math.sin(T*3+p.rot)*S*2*dt;p.vy=appr(p.vy,S*0.6,dt*2);p.vx*=Math.exp(-dt*1.5);}
  else if(p.type==='spark'){p.vx*=Math.exp(-dt*4);p.vy*=Math.exp(-dt*4);}
  else{p.vy+=S*5*dt;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}}
function drawParts(){ctx.fillStyle=K;ctx.strokeStyle=K;for(const p of parts){const f=clamp(p.life/p.max*1.4,0,1);
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  if(p.type==='bit'){ctx.scale(p.size*f,p.size*f);ctx.beginPath();poly(SH.bit[p.k]);ctx.fill();}
  else if(p.type==='leaf'){ctx.scale(p.size,p.size);ctx.beginPath();poly(SH.leaf);ctx.fill();}
  else if(p.type==='drop'){ctx.beginPath();ctx.arc(0,0,p.size*f,0,TAU);ctx.fill();}
  else{const s=p.size*f;ctx.lineWidth=Math.max(1.5,s*0.3);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s,0);ctx.lineTo(s,0);ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.stroke();}
  ctx.restore();}}

let demo=null, lastInput=0, demoDone=false;

/* ---------- input ---------- */

function dragTarget(it,x,y,d){ // where the item base would land for pointer x,y

function overPaper(x,y){const r=paperRect();return y<shelf.y-2&&x>r.x-0.3*S&&x<r.x+r.w+0.3*S&&y>r.y-0.5*S;}

function onCancel(e){if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;dragSoundStop();const it=G.items[d.id];

function snap(it){

  if(trio.some(o=>near(it,o)))return;
  let best=null,bd=1e9;
  for(const o of trio){const dx=(it.u-o.u)*shoji.w/S,dy=(it.v-o.v)*shoji.h/S;const isB=it.id==='boat'||o.id==='boat';
    const lx=isB?2.5:2.2,ly=isB?2.1:1.15;

/* ---------- derived world state ---------- */
function derive(){
  const I=G.items,h=I.house,t=I.tree,b=I.boat,m=I.moon;
  D.HT=near(h,t);D.TB=near(t,b);D.HB=near(h,b);
  D.chain=on(h)&&on(t)&&on(b)&&((D.HT&&D.TB)||(D.HT&&D.HB)||(D.TB&&D.HB));
  D.sail=on(b)&&D.TB;
  D.moonActive=on(m)&&m.replied;
  D.moonTgt=null;
  if(on(m)){const c=[];if(on(b))c.push(['boat',anchor(b)]);if(on(h))c.push(['house',anchor(h)]);
    let bd=1e9;for(const[id,p]of c){if(moonOverP(m,p)){const d=Math.abs(anchor(m).x-p.x);if(d<bd){bd=d;D.moonTgt=id;}}}}
  D.lant=D.moonActive&&D.moonTgt==='boat';
  D.welcome=D.moonActive&&D.moonTgt==='house';
  let sp=false;
  if(on(h)&&on(b)&&h.replied&&b.replied&&D.moonActive){const hp=anchor(h),bp=anchor(b),mp=anchor(m);
    const close=Math.abs(hp.x-bp.x)<3.2*S&&Math.abs(hp.y-bp.y)<2.6*S;
    const above=mp.y<Math.min(hp.y-1.0*S,bp.y-0.9*S)&&mp.x>Math.min(hp.x,bp.x)-1.0*S&&mp.x<Math.max(hp.x,bp.x)+1.0*S;
    sp=close&&above;}
  if(sp&&!G.special&&G.phase==='shoji'){SFX.moonTune();const hp=vpos(h),bp=vpos(b);sparks(hp.x+0.2*S,hp.y-0.4*S,6,0.4*S);sparks(bp.x,bp.y-0.5*S,6,0.4*S);handAct('joy',1.6);}
  G.special=sp;
}

/* ---------- guidance ---------- */
function guide(){
  const I=G.items;
  if(G.phase==='shoji'){
    if(!I.house.placed)return{k:'shelf',id:'house'};
    if(!I.house.replied)return{k:'tap',id:'house'};
    if(!I.tree.placed)return{k:'shelf',id:'tree'};
    if(!I.tree.replied)return{k:'tap',id:'tree'};
    if(!I.boat.placed)return{k:'shelf',id:'boat'};
    if(!I.boat.replied)return{k:'tap',id:'boat'};
    if(!I.moon.placed)return{k:'shelf',id:'moon'};
    if(!I.moon.replied)return{k:'tap',id:'moon'};
    if(!D.chain){if(D.HT)return{k:'move',id:'boat',to:'tree'};if(D.TB)return{k:'move',id:'house',to:'tree'};return{k:'move',id:'tree',to:'house'};}
    return null;}
  if(G.phase==='play'&&!I.moon.placed)return{k:'shelf',id:'moon'};
  return null;}
function guidePoint(g){
  const it=G.items[g.id];
  if(g.k==='shelf')return{x:shelf.cx[SLOT[g.id]],y:shelf.cy};
  const p=vpos(it);return{x:p.x,y:p.y+HB[g.id][1]*S};}
function demoDest(g){
  const I=G.items;let x,y;
  if(g.k==='move'){const o=I[g.to],op=anchor(o),ip=anchor(I[g.id]);const side=ip.x<op.x?-1:1;
    x=op.x+side*1.6*S;y=g.id==='boat'?Math.max(op.y+1.0*S,vy(0.62)):(I[g.to].id==='boat'?op.y-1.0*S:op.y);}
  else if(g.id==='house'){x=ux(0.32);y=vy(0.44);}
  else if(g.id==='tree'){const hp=anchor(I.house);const side=I.house.u<0.5?1:-1;x=hp.x+side*1.6*S;y=hp.y;}
  else if(g.id==='boat'){const tp=anchor(I.tree.placed?I.tree:I.house);const side=tp.x<ux(0.5)?1:-1;x=tp.x+side*1.3*S;y=Math.max(tp.y+1.2*S,vy(0.68));}
  else{const bp=anchor(I.boat.placed?I.boat:I.house);x=bp.x;y=bp.y-2.6*S;}
  const b=clampBase(I[g.id],x,y);return{x:b.x,y:b.y+HB[g.id][1]*S};}

/* ---------- phases ---------- */
function startOpening(){
  G.phase='opening';G.openT0=T;G.story=G.items.house.seq<G.items.boat.seq?'depart':'home';
  SFX.taiko();setTimeout(()=>SFX.shoji(),250);
  IDS.forEach((id,i)=>{const it=G.items[id];if(on(it)){it.hopV=3.2+i*0.3;}});
  handAct('joy',1.2);
}
function startPlay(){
  G.phase='play';G.phaseT=T;const I=G.items,b=I.house,bt=I.boat;
  const a={u:0,v:0,mode:'walk',face:1,walk:0,step:0,t0:T,bow:0};G.actor=a;
  if(G.story==='depart'){const d=doorPt();a.u=toU(d.x);a.v=toV(d.y);a.face=bt.u>b.u?1:-1;I.house.doorUntil=T+1.4;}
  else{bt.sailU=homeStartU();bt.passenger=1;a.mode='boat';bt.face=Math.sign(bt.u-bt.sailU)||1;}
  if(G.story==='depart')SFX.fanfare();else SFX.homeTune();
}
function uBounds(){return[toU(stage.x+1.3*S),toU(stage.x+stage.w-1.3*S)];}
function departDestU(){const I=G.items,b=I.boat,h=I.house,m=I.moon;const[lo,hi]=uBounds();
  if(on(m)&&D.moonTgt!=='house'){const mu=clamp(m.u,lo,hi);if(Math.abs(mu-b.u)*shoji.w>1.2*S)return mu;}
  return h.u<b.u?hi:lo;}
function homeStartU(){const I=G.items,b=I.boat,h=I.house,m=I.moon;const[lo,hi]=uBounds();
  if(on(m)&&!moonOverP(m,anchor(h))){const mu=clamp(m.u,lo,hi);if(Math.abs(mu-b.u)*shoji.w>1.5*S)return mu;}
  return h.u<b.u?hi:lo;}
function updPlay(dt){
  const I=G.items,a=G.actor,h=I.house,b=I.boat;const st=T-a.t0;
  const sp=1.25*S*dt;
  const draggingBoat=drag&&drag.active&&drag.id==='boat';
  function walkTo(p){const ax=ux(a.u),ay=vy(a.v);const dx=p.x-ax,dy=p.y-ay;const d=Math.hypot(dx,dy);
    if(d<=sp+0.5){a.u=toU(p.x);a.v=toV(p.y);return true;}
    a.u=toU(ax+dx/d*sp);a.v=toV(ay+dy/d*sp);if(Math.abs(dx)>1)a.face=dx>0?1:-1;
    const ow=a.walk;a.walk+=dt*10;if(Math.floor(ow/Math.PI)!==Math.floor(a.walk/Math.PI))SFX.step();return false;}
  function next(){a.step++;a.t0=T;}
  function sailTo(u){const step=1.35*S*dt/shoji.w;const diff=u-b.sailU;b.waveAmp=Math.max(b.waveAmp,0.08);
    if(D.sail)b.sailFill=Math.max(b.sailFill,0.6);else b.rowUntil=T+0.3;
    if(Math.abs(diff)<=step){b.sailU=u;return true;}b.sailU+=Math.sign(diff)*step;b.face=Math.sign(diff);return false;}
  function rustle(){const t=I.tree;t.swayV+=2.5;const tp=vpos(t);for(let i=0;i<4;i++)addP('leaf',tp.x+(FX()-0.5)*S,tp.y-S,(FX()-0.5)*S,-S*0.3,S*0.13,1.6);SFX.rustle(1);}
  if(G.story==='depart'){
    switch(a.step){
      case 0:h.doorUntil=T+0.5;a.bow=0.35*bump(st/0.9);if(st>1.0)next();break;
      case 1:a.bow=0;if(walkTo(treePt(ux(a.u)))){next();rustle();}break;
      case 2:if(st>0.9)next();break;
      case 3:if(walkTo(boatPt())){next();b.passenger=1;a.mode='boat';SFX.plonk(1);b.glideV+=0.3;}break;
      case 4:if(st>0.6){next();b.sailU=b.u;}break;
      case 5:if(draggingBoat)break;if(b.sailU==null)b.sailU=b.u;if(sailTo(departDestU()))startFinale();break;
    }
  }else{
    switch(a.step){
      case 0:if(draggingBoat)break;if(b.sailU==null){next();break;}if(sailTo(b.u)){b.sailU=null;next();SFX.plonk(1);}break;
      case 1:if(st>0.5){const p=boatPt();a.u=toU(p.x);a.v=toV(p.y);a.mode='walk';b.passenger=0;next();}break;
      case 2:if(walkTo(treePt(ux(a.u)))){next();rustle();}break;
      case 3:if(st>0.9)next();break;
      case 4:if(walkTo(doorPt())){next();a.mode='hidden';h.doorUntil=T+0.8;SFX.knock(1);}break;
      case 5:if(st>0.7){h.resStay=true;h.winTo=1;startFinale();}break;
    }
  }
}
function startFinale(){G.phase='finale';G.fin={t0:T,nextClap:T+0.4};
  const m=G.items.moon;const e=finEnd();if(on(m)&&moonOverP(m,e))SFX.moonTune();else SFX.fanfare();}

function finBowId(){return G.lastTapped&&on(G.items[G.lastTapped])?G.lastTapped:(G.story==='depart'?'boat':'house');}

/* ---------- per-frame update ---------- */
function updItem(it,dt){
  it.vsx+=((it.tsx-it.sx)*300-it.vsx*11)*dt;it.sx+=it.vsx*dt;
  it.vsy+=((it.tsy-it.sy)*300-it.vsy*11)*dt;it.sy+=it.vsy*dt;
  it.vrot+=((it.trot-it.rot)*140-it.vrot*7)*dt;it.rot+=it.vrot*dt;
  it.hopV-=dt*16;it.hop+=it.hopV*dt;if(it.hop<0){if(it.hopV<-2){it.sx=1.12;it.sy=0.88;}it.hop=0;it.hopV=0;}
  it.snapX*=Math.exp(-dt*10);it.snapY*=Math.exp(-dt*10);
  it.lift=appr(it.lift,T<it.liftUntil?1:0,dt*12);
  it.tiltV+=(-it.tilt*90-it.tiltV*6)*dt;it.tilt+=it.tiltV*dt;
  if(T-it.lastTap>2.5)it.level=Math.max(0,it.level-dt*0.5);
  if(it.id==='house'){
    it.style=it.v<0.5?'flip':'slide';
    const fin=G.phase==='finale';
    const wantRes=T<it.resUntil||D.welcome||G.special||it.resStay||(fin&&it.replied);
    if(D.welcome||G.special)it.winTo=1;
    it.win=mv(it.win,it.winTo,dt*2.6);
    it.resWin=appr(it.resWin,wantRes&&it.win>0.5?1:0,dt*5);
    const outV=T<it.outUntil||T<it.broomUntil;
    it.out=mv(it.out,outV?1:0,dt*1.8);
    it.door=appr(it.door,(outV||it.out>0.02||T<it.doorUntil)?1:0,dt*6);
  }else if(it.id==='tree'){
    it.swayV+=(-it.sway*28-it.swayV*2.6)*dt+(FX()-0.5)*dt*1.2;it.sway+=it.swayV*dt;
  }else if(it.id==='boat'){
    it.glideV+=(-it.glide*1.1-it.glideV*1.3)*dt;it.glide=clamp(it.glide+it.glideV*dt,-1.6,1.6);
    it.waveAmp*=Math.exp(-dt*0.8);it.sailFill=Math.max(0,it.sailFill-dt*0.5);
    if(T<it.rockUntil){const e=clamp((it.rockUntil-T)/0.6,0,1);it.rock=it.rockAmp*Math.sin(T*4.2)*e;it.lifted=appr(it.lifted,1,dt*5);}
    else{it.rock=appr(it.rock,0,dt*5);it.lifted=appr(it.lifted,0,dt*3);}
    if(D.moonActive&&D.moonTgt==='house'&&on(it)){const hp=anchor(G.items.house),bp=anchor(it);if(Math.abs(hp.x-bp.x)>2)it.face=hp.x>bp.x?1:-1;}
    it.faceCur=mv(it.faceCur,it.face,dt*5);
    const sailOn=D.sail;it.sailT=mv(it.sailT,sailOn?1:0,dt*0.9);
    const finLit=G.phase==='finale'&&on(G.items.moon)&&moonOverP(G.items.moon,anchor(it));
    it.lant=appr(it.lant,(D.lant||finLit)?1:0,dt*3);it.look=appr(it.look,(D.lant||finLit||(D.moonTgt==='boat'&&on(G.items.moon)))?1:0,dt*3);
    it.passenger=appr(it.passenger,G.phase==='play'||G.phase==='finale'?(G.actor&&G.actor.mode==='boat'?1:0):0,dt*6);
  }else if(it.id==='moon'){it.refl=appr(it.refl,D.moonActive&&D.moonTgt?1:0,dt*2);}
}
function update(dt){
  if(drag){const it=G.items[drag.id];if(drag.active){const v=Math.hypot(drag.vx,drag.vy);const st=clamp(v/1600,0,0.24);
      if(Math.abs(drag.vx)>Math.abs(drag.vy)){it.tsx=1+st;it.tsy=1-st*0.6;}else{it.tsy=1+st;it.tsx=1-st*0.6;}
      it.trot=clamp(drag.vx/3000,-0.3,0.3);drag.vx*=Math.exp(-dt*6);drag.vy*=Math.exp(-dt*6);}}
  derive();
  IDS.forEach(id=>updItem(G.items[id],dt));
  if(G.phase==='shoji'){
    const I=G.items;
    if(D.chain&&I.house.replied&&I.tree.replied&&I.boat.replied&&!drag){G.openWait+=dt;if(G.openWait>1.7)startOpening();}else G.openWait=0;
  }else if(G.phase==='opening'){
    G.openP=ease((T-G.openT0)/2.2);if(T-G.openT0>2.4){G.openP=1;startPlay();}
  }else if(G.phase==='play'){updPlay(dt);}
  else if(G.phase==='finale'){updFinale(dt);}
  else if(G.phase==='cleanup'){updCleanup(dt);}
  // guidance bounce + idle demo
  const g=guide();G.guide=g;
  if(g&&g.k!=='shelf'){const it=G.items[g.id];if(on(it)&&it.hop===0&&(T%1.6)<dt*1.01&&!drag)it.hopV=2.6;}
  if(g&&!demo&&!drag&&!demoDone&&T-lastInput>4&&(G.phase==='shoji'||G.phase==='play')){
    const from=guidePoint(g);demo={g,t0:T,from,to:g.k==='tap'?null:demoDest(g),kind:g.k==='tap'?'tap':'drag'};demoDone=true;}
  if(demo&&T-demo.t0>(demo.kind==='tap'?1.6:2.6)){demo=null;lastInput=T;demoDone=false;}
  if(demo&&!G.guide)demo=null;

}

/* ---------- hand director ---------- */
function setHT(h,x,y,ang,pose,k){h.tx=x;h.ty=y;h.tang=ang;h.tpose=pose;h.tk=k||8;}
function updHand(dt){

      case 'bow':{const p=vpos(I.house);const b=Math.max(bump((st-0.2)/0.5),bump((st-0.8)/0.5));x=p.x+0.95*hs;y=p.y-1.35*hs+b*0.2*hs;ang=Math.PI*0.62+b*0.55;pose=POSE.flat;k=10;break;}

      case 'joy':{x=Math.min(W-SA.r-0.2*hs,stage.x+stage.w-0.1*hs)+Math.sin(T*9)*0.12*hs;y=shoji.y+shoji.h*0.25+Math.sin(T*5)*0.15*hs;ang=Math.PI*0.85+Math.sin(T*12)*0.35;pose=POSE.open;k=8;break;}
    }
  }else if(G.phase==='play'&&G.actor){
    const a=G.actor;let p;if(a.mode==='boat')p=vpos(I.boat);else if(a.mode==='hidden')p=vpos(I.house);else p={x:ux(a.u),y:vy(a.v)};
    if(a.mode==='boat'&&I.boat.sailU!=null){x=p.x-I.boat.faceCur*1.0*hs;y=waterY(p)+0.4*hs+Math.sin(T*6)*0.06*hs;ang=I.boat.face>0?0:Math.PI;pose=POSE.flat;k=8;}
    else{x=p.x+0.15*hs;y=p.y-1.55*hs+Math.sin(T*4)*0.05*hs;ang=Math.PI/2;pose=POSE.pinch;k=6;}

      else{const pr=ease((st-0.45)/0.55);x=lerp(p.x,sx,pr)+0.2*hs;y=lerp(p.y-0.9*hs,sy-0.8*hs,pr)-bump(pr)*0.6*hs;pose=POSE.pinch;it.cx=x-0.2*hs;it.cy=y+0.7*hs;it.cs=lerp(1,0.55,pr);}

function capsule(x,y,w,h){const r=h/2;ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);ctx.lineTo(x+r,y+h);ctx.arc(x+r,y+r,r,Math.PI/2,Math.PI*1.5);ctx.closePath();}

/* ---------- drawing: characters & props (all black silhouettes) ---------- */

    ctx.beginPath();ctx.ellipse(0.05-sw*0.05,-0.018,0.042,0.02,0,0,TAU);ctx.fill();}

    ctx.beginPath();ctx.moveTo(-0.04,0.22);ctx.lineTo(0.04,0.22);ctx.lineTo(0.09,0.34);ctx.lineTo(-0.09,0.34);ctx.closePath();ctx.fill();ctx.restore();}

function waveArm(sp,ph){return 2.5+Math.sin(T*sp+(ph||0))*0.45;}
function drawHouse(it,x,y,sc){

    const bw=bump((T-it.bowT0)/0.9)*it.bowAmp;const fin=G.phase==='finale'?finBowAmt():0;
