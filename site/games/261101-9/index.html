<script>
(()=>{
'use strict';
/* =========================================================
   じわっと発見！ねこカメラマンの写真ピクニック
   seek_find / photo_collage — 単一ファイル・外部読込なし
   ========================================================= */
const cv=document.getElementById('c');
const mainCtx=cv.getContext('2d');let ctx=mainCtx;function ctxSwap(g){ctx=g;}
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const backOut=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const R=(a,b)=>a+(b-a)*Math.random();
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lin(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>gr.addColorStop(s[0],s[1]));return gr;}
function rad(g,x0,y0,r0,x1,y1,r1,stops){const gr=g.createRadialGradient(x0,y0,r0,x1,y1,r1);stops.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;}
function mixCol(a,b,t){return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))];}
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';

/* ---------------- grain ---------------- */
const grain=mk(128,128);
{const g=grain.getContext('2d');const id=g.createImageData(128,128);
 for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
 g.putImageData(id,0,0);}

/* ---------------- sticker sprites ---------------- */
function sticker(src,bpx){
  const c=mk(src.width,src.height),g=c.getContext('2d');
  for(let i=0;i<18;i++){const a=i/18*TAU;g.drawImage(src,Math.cos(a)*bpx,Math.sin(a)*bpx);}
  for(let i=0;i<8;i++){const a=i/8*TAU+.3;g.drawImage(src,Math.cos(a)*bpx*.55,Math.sin(a)*bpx*.55);}
  g.globalCompositeOperation='source-in';
  g.fillStyle=lin(g,0,0,c.width,c.height,[[0,'#fffdf6'],[1,'#efe8d8']]);
  g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over';
  g.drawImage(src,0,0);
  return c;
}
function shadowOf(c){
  const s=mk(c.width,c.height),g=s.getContext('2d');
  const r=Math.max(2,Math.min(c.width,c.height)*0.018);
  g.globalAlpha=.16;
  for(let i=0;i<10;i++){const a=i/10*TAU;g.drawImage(c,Math.cos(a)*r,Math.sin(a)*r);}
  g.globalAlpha=1;g.globalCompositeOperation='source-in';
  g.fillStyle='rgba(38,20,6,0.5)';g.fillRect(0,0,s.width,s.height);
  return s;
}
function mkSprite(box,k,draw,bu){
  if(bu==null)bu=3;
  const pad=bu+3;
  const src=mk((box.w+pad*2)*k,(box.h+pad*2)*k),g=src.getContext('2d');
  g.scale(k,k);g.translate(pad-box.x,pad-box.y);draw(g);
  const c=bu>0?sticker(src,bu*k):src;
  return {c,sh:bu>0?shadowOf(c):null,ax:(pad-box.x)*k,ay:(pad-box.y)*k,k};
}
// sc: screen px per sprite unit
function dSpr(sp,x,y,sc,rot,alpha,sx,sy,shOff){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  const s=sc/sp.k;ctx.scale(s*(sx==null?1:sx),s*(sy==null?1:sy));
  if(alpha!=null&&alpha<1)ctx.globalAlpha*=alpha;
  if(sp.sh&&shOff!==0){const o=(shOff==null?3:shOff)*sp.k;ctx.drawImage(sp.sh,-sp.ax+o*.7,-sp.ay+o);}
  ctx.drawImage(sp.c,-sp.ax,-sp.ay);
  ctx.restore();
}
function fur(g,clipPath,bx,by,bw,bh,n,len,angFn,cols,lw){
  g.save();g.clip(clipPath);
  for(let i=0;i<n;i++){
    const x=bx+Math.random()*bw,y=by+Math.random()*bh;
    const a=angFn(x,y)+R(-.35,.35),l=len*R(.55,1.25);
    g.strokeStyle=cols[(Math.random()*cols.length)|0];g.lineWidth=(lw||.5)*R(.6,1.3);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  g.restore();
}

/* ---------- item drawings (unit space) ---------- */
function drawStraw(g){
  const p=new Path2D();
  p.moveTo(0,40);p.bezierCurveTo(-22,34,-38,6,-36,-14);p.bezierCurveTo(-34,-32,-16,-36,0,-30);
  p.bezierCurveTo(16,-36,34,-32,36,-14);p.bezierCurveTo(38,6,22,34,0,40);p.closePath();
  g.fillStyle=rad(g,-10,-12,3,0,2,48,[[0,'#ff7a78'],[.35,'#e8233a'],[.8,'#b01427'],[1,'#7e0a1a']]);g.fill(p);
  g.save();g.clip(p);
  for(let y=-24;y<=36;y+=8){for(let x=-34+(((y+24)/8)&1)*5;x<=34;x+=10){
    const sx=x+R(-1.2,1.2),sy=y+R(-1.2,1.2);
    g.fillStyle='rgba(90,0,10,.45)';g.beginPath();g.ellipse(sx,sy+.8,2.4,3,0,0,TAU);g.fill();
    g.fillStyle=rad(g,sx-.4,sy-.6,.2,sx,sy,2.2,[[0,'#fff3a8'],[1,'#d8a830']]);g.beginPath();g.ellipse(sx,sy,1.3,2,0,0,TAU);g.fill();
  }}
  g.fillStyle=lin(g,0,10,0,42,[[0,'rgba(80,0,10,0)'],[1,'rgba(80,0,10,.45)']]);g.fillRect(-40,0,80,44);
  g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(-16,-14,6,11,.5,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.ellipse(-18,-17,2,4,.5,0,TAU);g.fill();
  g.restore();
  for(let i=0;i<6;i++){
    const a=-PI/2+(i-2.5)*.55;
    g.save();g.translate(0,-30);g.rotate(a+PI/2);
    g.fillStyle=lin(g,0,0,0,-18,[[0,'#2f6e24'],[1,'#7cbf4a']]);
    g.beginPath();g.moveTo(-4,0);g.quadraticCurveTo(-6,-10,0,-19);g.quadraticCurveTo(6,-10,4,0);g.closePath();g.fill();
    g.strokeStyle='rgba(20,60,10,.5)';g.lineWidth=.6;g.beginPath();g.moveTo(0,0);g.lineTo(0,-15);g.stroke();
    g.restore();
  }
  g.strokeStyle='#4f7f2a';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(0,-32);g.quadraticCurveTo(2,-38,5,-42);g.stroke();
}
function cupOuter(){const P=new Path2D();P.moveTo(-30,-44);P.lineTo(30,-44);P.lineTo(23,40);P.quadraticCurveTo(24,46,18,47);P.lineTo(-18,47);P.quadraticCurveTo(-24,46,-23,40);P.closePath();return P;}
function drawCupBack(g){
  const P=cupOuter();
  g.fillStyle='rgba(206,229,240,0.62)';g.fill(P);
  g.fillStyle=lin(g,-30,0,30,0,[[0,'rgba(120,165,190,.35)'],[.3,'rgba(255,255,255,0)'],[.75,'rgba(255,255,255,0)'],[1,'rgba(120,165,190,.4)']]);g.fill(P);
  g.strokeStyle='rgba(110,150,175,.7)';g.lineWidth=1.3;g.beginPath();g.ellipse(0,-44,30,5,0,PI,TAU);g.stroke();
  g.fillStyle='rgba(170,205,222,.8)';g.beginPath();g.ellipse(0,43,21,4,0,0,TAU);g.fill();
}
function drawCupFront(g){
  const P=cupOuter();
  g.strokeStyle='rgba(95,135,160,.75)';g.lineWidth=1.1;g.stroke(P);
  g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=2;g.beginPath();g.ellipse(0,-44,30,5,0,0,PI);g.stroke();
  g.strokeStyle='rgba(95,135,160,.6)';g.lineWidth=.8;g.beginPath();g.ellipse(0,-44,30,5,0,0,PI);g.stroke();
  g.fillStyle='rgba(255,255,255,.72)';g.beginPath();g.moveTo(-24,-38);g.lineTo(-19,-38);g.lineTo(-15,34);g.lineTo(-18,34);g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.6;g.beginPath();g.moveTo(22,-36);g.lineTo(17,30);g.stroke();
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.4;g.beginPath();g.ellipse(0,44,19,3,0,.2,PI-.2);g.stroke();
}
function drawParasol(g){
  g.fillStyle=lin(g,-2.5,0,2.5,0,[[0,'#6a4428'],[.5,'#d2ab80'],[1,'#5c3a20']]);g.fillRect(-2.5,-50,5,106);
  g.fillStyle='#5a3a22';g.beginPath();g.moveTo(-2.5,56);g.lineTo(2.5,56);g.lineTo(0,63);g.closePath();g.fill();
  const C=new Path2D();C.moveTo(-54,-6);C.quadraticCurveTo(-50,-44,0,-52);C.quadraticCurveTo(50,-44,54,-6);
  const n=6;for(let i=0;i<n;i++){const xa=54-i*18,xb=xa-18;C.quadraticCurveTo((xa+xb)/2,0,xb,-6);}C.closePath();
  g.save();g.clip(C);
  for(let i=0;i<n;i++){
    const x0=-54+i*18,x1=x0+18;
    g.fillStyle=i%2?'#f6ecd6':'#d7303d';
    g.beginPath();g.moveTo(0,-53);g.quadraticCurveTo(x0*.75,-40,x0,2);g.lineTo(x1,2);g.quadraticCurveTo(x1*.75,-40,0,-53);g.closePath();g.fill();
  }
  g.fillStyle=rad(g,-22,-42,2,-10,-30,60,[[0,'rgba(255,255,255,.5)'],[.5,'rgba(255,255,255,.08)'],[1,'rgba(0,0,0,.18)']]);g.fillRect(-60,-60,120,70);
  g.fillStyle=lin(g,0,-20,0,0,[[0,'rgba(60,10,10,0)'],[1,'rgba(60,10,10,.28)']]);g.fillRect(-60,-20,120,24);
  g.restore();
  g.strokeStyle='rgba(90,30,20,.35)';g.lineWidth=.7;
  for(let i=1;i<n;i++){const x0=-54+i*18;g.beginPath();g.moveTo(0,-52);g.quadraticCurveTo(x0*.75,-40,x0,-4);g.stroke();}
  g.fillStyle=rad(g,-1,-57,.3,0,-55,4,[[0,'#fff'],[1,'#a07a50']]);g.beginPath();g.arc(0,-55,3.4,0,TAU);g.fill();
}
function cubePath(g,s){rr(g,-s/2,-s/2,s,s,s*.2);}
function drawOneCube(g,x,y,s,rot){
  g.save();g.translate(x,y);g.rotate(rot);
  cubePath(g,s);g.fillStyle=lin(g,-s/2,-s/2,s/2,s/2,[[0,'rgba(240,250,255,.97)'],[.55,'rgba(190,225,245,.9)'],[1,'rgba(140,190,225,.9)']]);g.fill();
  g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=s*.06;g.stroke();
  rr(g,-s*.28,-s*.3,s*.5,s*.5,s*.1);g.fillStyle='rgba(255,255,255,.38)';g.fill();
  g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++){g.beginPath();g.arc(R(-s*.3,s*.3),R(-s*.3,s*.3),s*R(.03,.06),0,TAU);g.fill();}
  g.strokeStyle='rgba(120,170,210,.5)';g.lineWidth=s*.03;g.beginPath();g.moveTo(-s*.35,s*.38);g.lineTo(s*.38,s*.38);g.lineTo(s*.38,-s*.35);g.stroke();
  g.restore();
}
function drawIce(g){
  drawOneCube(g,-16,8,27,.22);drawOneCube(g,15,9,26,-.18);drawOneCube(g,0,-13,25,.06);
  g.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<14;i++){const a=R(0,TAU),r=R(26,34);g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r*.8,R(.6,1.4),0,TAU);g.fill();}
}
function drawCube(g){drawOneCube(g,0,0,20,0);}
function drawLemon(g){
  const p=new Path2D();p.ellipse(0,0,33,23,0,0,TAU);p.ellipse(-35,0,6,5,0,0,TAU);p.ellipse(35,0,6,5,0,0,TAU);
  g.fillStyle=rad(g,-10,-9,2,0,0,40,[[0,'#fff6b0'],[.4,'#f6d630'],[.85,'#d8a812'],[1,'#a87c08']]);g.fill(p);
  g.save();g.clip(p);g.fillStyle='rgba(140,100,0,.18)';
  for(let i=0;i<160;i++){g.beginPath();g.arc(R(-38,38),R(-24,24),R(.4,.9),0,TAU);g.fill();}
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-12,-10,9,4,-.3,0,TAU);g.fill();
  g.restore();
  g.fillStyle=lin(g,-30,-26,-14,-14,[[0,'#3c7a26'],[1,'#8cc85a']]);
  g.beginPath();g.moveTo(-22,-19);g.quadraticCurveTo(-34,-34,-14,-30);g.quadraticCurveTo(-12,-22,-22,-19);g.fill();
}
let rugTex=null;
function makeRugTex(){
  rugTex=mk(48,48);const g=rugTex.getContext('2d');
  g.fillStyle='#f2ebf2';g.fillRect(0,0,48,48);
  g.fillStyle='rgba(118,52,150,.48)';g.fillRect(0,0,48,12);g.fillRect(0,24,48,12);
  g.fillRect(0,0,12,48);g.fillRect(24,0,12,48);
  g.strokeStyle='rgba(80,30,100,.12)';g.lineWidth=.6;
  for(let i=0;i<48;i+=2){g.beginPath();g.moveTo(i,0);g.lineTo(i,48);g.stroke();}
  for(let i=0;i<48;i+=3){g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(0,i);g.lineTo(48,i);g.stroke();}
}
function drawRugEnd(g){
  const P=new Path2D();P.moveTo(-34,20);P.lineTo(30,20);P.quadraticCurveTo(10,-2,-6,-26);P.closePath();
  g.save();g.fillStyle=g.createPattern(rugTex,'repeat');g.save();g.scale(.5,.5);g.fill(P);g.restore();
  g.restore();
  // fill with scaled pattern (need path in scaled space) – redo simply
  g.save();g.clip(P);g.scale(.5,.5);g.fillStyle=g.createPattern(rugTex,'repeat');g.fillRect(-80,-60,160,100);g.restore();
  g.save();g.clip(P);g.fillStyle=lin(g,0,-26,0,20,[[0,'rgba(255,255,255,.25)'],[1,'rgba(40,10,50,.25)']]);g.fillRect(-40,-30,80,52);g.restore();
  g.strokeStyle='#e9dfe6';g.lineWidth=1.3;g.lineCap='round';
  for(let x=-32;x<=28;x+=3){g.beginPath();g.moveTo(x,20);g.lineTo(x+R(-1,1),26+R(-1,1));g.stroke();}
}
function drawHand(g){
  const sk=lin(g,0,0,0,80,[[0,'#f9d9bd'],[1,'#e8b08a']]);
  g.fillStyle=sk;g.strokeStyle='rgba(170,110,80,.55)';g.lineWidth=1;
  rr(g,-7,-2,14,46,7);g.fill();g.stroke();
  rr(g,-13,32,38,40,15);g.fill();g.stroke();
  for(let i=0;i<3;i++){g.beginPath();g.ellipse(15+i*2,38+i*9,8,6,.3,0,TAU);g.fill();g.stroke();}
  g.beginPath();g.ellipse(-12,50,6,13,.45,0,TAU);g.fill();g.stroke();
  rr(g,-4.5,0,9,9,4);g.fillStyle='rgba(255,236,225,.9)';g.fill();
  g.fillStyle=lin(g,0,68,0,92,[[0,'#f0a8bd'],[1,'#d8849e']]);rr(g,-15,68,42,24,7);g.fill();
  g.strokeStyle='rgba(150,60,90,.35)';for(let x=-12;x<26;x+=4){g.beginPath();g.moveTo(x,70);g.lineTo(x,90);g.stroke();}
}
function drawPinHead(g){
  const cols=[['#f0646e','#b52634'],['#5e9be6','#2558a8'],['#ffd65a','#d29a14'],['#68c486','#2e8a4e']];
  for(let i=0;i<4;i++){
    g.save();g.rotate(i*PI/2);
    g.fillStyle=lin(g,0,0,0,-36,[[0,cols[i][1]],[1,cols[i][0]]]);
    g.beginPath();g.moveTo(0,0);g.lineTo(0,-37);g.quadraticCurveTo(22,-30,27,-6);g.closePath();g.fill();
    g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(0,0);g.lineTo(27,-6);g.lineTo(12,-14);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.moveTo(0,-4);g.lineTo(0,-34);g.lineTo(6,-22);g.closePath();g.fill();
    g.restore();
  }
  g.fillStyle=rad(g,-1,-1,.5,0,0,5,[[0,'#fff'],[1,'#999']]);g.beginPath();g.arc(0,0,4.5,0,TAU);g.fill();
}
function drawPinStick(g){g.fillStyle=lin(g,-3,0,3,0,[[0,'#8a6a40'],[.5,'#e2c79a'],[1,'#7a5a30']]);g.fillRect(-3,0,6,90);}
function drawFrost(g){
  g.strokeStyle='rgba(255,255,255,.9)';g.lineCap='round';
  for(let i=0;i<26;i++){
    const a=i/26*TAU+R(-.1,.1),r0=R(26,32);g.lineWidth=R(1,1.8);
    const x=Math.cos(a)*r0,y=Math.sin(a)*r0;const l=R(6,11);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
    g.lineWidth*=.7;
    for(const s of [-1,1]){g.beginPath();g.moveTo(x+Math.cos(a)*l*.5,y+Math.sin(a)*l*.5);g.lineTo(x+Math.cos(a)*l*.5+Math.cos(a+s*.8)*l*.45,y+Math.sin(a)*l*.5+Math.sin(a+s*.8)*l*.45);g.stroke();}
  }
}

/* ---------- basket ---------- */
function weave(g,P,top,bot){
  g.save();g.clip(P);
  g.fillStyle=lin(g,0,top,0,bot,[[0,'#c8954e'],[1,'#7e5224']]);g.fillRect(-70,top-4,140,bot-top+8);
  const rows=Math.round((bot-top)/6);
  for(let r=0;r<rows;r++){
    const y=top+r*6+3;
    for(let x=-66;x<66;x+=10){
      const o=(r%2)*5;
      g.fillStyle=rad(g,x+o,y-1,.5,x+o,y,7,[[0,'rgba(245,205,140,.95)'],[1,'rgba(140,90,40,.9)']]);
      g.beginPath();g.ellipse(x+o,y,5.6,3.2,0,0,TAU);g.fill();
      g.strokeStyle='rgba(70,40,15,.45)';g.lineWidth=.5;g.stroke();
    }
  }
  for(let x=-64;x<66;x+=10){g.strokeStyle='rgba(60,35,12,.35)';g.lineWidth=1.2;g.beginPath();g.moveTo(x,top);g.lineTo(x*.9,bot);g.stroke();}
  g.fillStyle=lin(g,-60,0,60,0,[[0,'rgba(40,20,5,.35)'],[.35,'rgba(0,0,0,0)'],[.7,'rgba(0,0,0,0)'],[1,'rgba(40,20,5,.4)']]);g.fillRect(-70,top-4,140,bot-top+8);
  g.restore();
}
function drawBasketBack(g){
  // handle
  g.lineCap='round';
  g.strokeStyle='#6e4520';g.lineWidth=7;g.beginPath();g.moveTo(-50,-10);g.bezierCurveTo(-46,-72,46,-72,50,-10);g.stroke();

function inner(r){const b=Math.max(5,Math.min(r.w,r.h)*.045),bb=b*2.3;const w=r.w-2*b,h=r.h-b-bb;return {x0:-r.w/2+b,y0:-r.h/2+b,w,h,cx:0,cy:(b-bb)/2,side:Math.max(w,h)};}
function s2w(r,u,v){const I=inner(r);const lx=(u-.5)*I.side+I.cx,ly=(v-.5)*I.side+I.cy;const c=Math.cos(r.rot),s=Math.sin(r.rot);return {x:r.cx+lx*c-ly*s,y:r.cy+lx*s+ly*c,side:I.side};}
function w2l(r,x,y){const dx=x-r.cx,dy=y-r.cy,c=Math.cos(-r.rot),s=Math.sin(-r.rot);return {x:dx*c-dy*s,y:dx*s+dy*c};}
function inRect(r,x,y,pad){const l=w2l(r,x,y);pad=pad||0;return Math.abs(l.x)<=r.w/2+pad&&Math.abs(l.y)<=r.h/2+pad;}

  lg.putImageData(id,0,0);g.imageSmoothingEnabled=true;g.drawImage(lo,0,0,cork.width,cork.height);

  g.save();g.globalCompositeOperation='overlay';g.globalAlpha=.3;g.fillStyle=g.createPattern(grain,'repeat');g.fillRect(0,0,cork.width,cork.height);g.restore();
  g.fillStyle=rad(g,cork.width/2,cork.height/2,Math.min(cork.width,cork.height)*.3,cork.width/2,cork.height/2,Math.max(cork.width,cork.height)*.75,[[0,'rgba(40,20,5,0)'],[1,'rgba(40,20,5,.5)']]);g.fillRect(0,0,cork.width,cork.height);

const SLOT={straw:[-28,-20,.3,-.1],cup:[14,-28,.36,.05],para:[38,-42,.55,.45],ice:[-4,-14,.27,0],lemon:[-44,-12,.26,-.2]};
const RUGPOS={straw:[.46,.83,.08],lemon:[.6,.84,.07],ice:[.37,.87,.07],cup:[.53,.73,.1]};
function basketFrame(mode){
  if(mode==='N')return {cx:LN.basket.cx,cy:LN.basket.cy,w:LN.basket.w,rot:LN.basket.rot};
  const pr=prect('park');const p=s2w(pr,.23,.76);return {cx:p.x,cy:p.y,w:p.side*.21,rot:pr.rot};
}
function basketNow(){const a=basketFrame('N');if(epm<=0)return a;const b=basketFrame('P');return {cx:lerp(a.cx,b.cx,epm),cy:lerp(a.cy,b.cy,epm),w:lerp(a.w,b.w,epm),rot:lerp(a.rot,b.rot,epm)};}
function slotPos(bf,id){const s=SLOT[id],k=bf.w/120,c=Math.cos(bf.rot),sn=Math.sin(bf.rot);return {x:bf.cx+(s[0]*c-s[1]*sn)*k,y:bf.cy+(s[0]*sn+s[1]*c)*k,D:s[2]*bf.w,rot:s[3]+bf.rot};}
function restPos(id){
  const a=slotPos(basketFrame('N'),id);
  if(epm<=0)return a;
  let b;
  if(RUGPOS[id]){const q=RUGPOS[id];const p=s2w(prect('park'),q[0],q[1]);b={x:p.x,y:p.y,D:q[2]*p.side,rot:0};}
  else b=slotPos(basketFrame('P'),id);
  return {x:lerp(a.x,b.x,epm),y:lerp(a.y,b.y,epm),D:lerp(a.D,b.D,epm),rot:lerp(a.rot,b.rot,epm)};
}
function juicePos(){ // center position and height D
  const a={x:LN.juice.x,y:LN.juice.y-LN.juice.D*.45,D:LN.juice.D};
  if(epm<=0)return a;
  const p=s2w(prect('park'),.53,.74);const b={x:p.x,y:p.y-p.side*.045,D:p.side*.1};
  return {x:lerp(a.x,b.x,epm),y:lerp(a.y,b.y,epm),D:lerp(a.D,b.D,epm)};
}
function catPos(){
  const a={x:LN.cat.x,y:LN.cat.y,s:LN.cat.s};
  if(epm<=0)return a;
  const pr=prect('park');const sun=s2w(pr,.39,.7),sh=s2w(pr,.64,.79);const e=ease(cat.shade);
  const b={x:lerp(sun.x,sh.x,e),y:lerp(sun.y,sh.y,e)-Math.sin(e*PI)*sun.side*.06,s:sun.side*.32};
  return {x:lerp(a.x,b.x,epm),y:lerp(a.y,b.y,epm),s:lerp(a.s,b.s,epm)};
}
function paraPlacedPos(){const p=s2w(prect('park'),.76,.6);return {x:p.x,y:p.y,D:p.side*.46,side:p.side};}
function dropZone(){const p=s2w(prect('park'),.7,.66);return {x:p.x,y:p.y,r:p.side*.24};}

/* ---------------- cat ---------------- */
const cat={arm:2.4,flip:1,flipT:1,tilt:0,ear:0,earUpT:0,blink:0,nextBlink:2.5,lean:0,shade:0,shadeT:0,look:null,lookT:0,act:null,q:[],remind:0,twitch:0,bubble:0,hold:null,sq:0};
function catDo(type,dur,data){cat.q.push({type,dur,data:data||{},t:0,started:false,fired:false});}
function catBusy(){return !!cat.act||cat.q.length>0;}
function catLook(x,y,t){cat.look={x,y};cat.lookT=t||1.4;}
function earsUp(t){cat.earUpT=Math.max(cat.earUpT,t||1.2);}
function catGeo(){
  const p=catPos(),sc=p.s/100,fl=cat.flip;
  const th=cat.arm,sx=-15,sy=-44;
  const px=sx-Math.sin(th)*28,py=sy+Math.cos(th)*28;
  const mx=sx-Math.sin(th)*44,my=sy+Math.cos(th)*44;
  return {p,sc,paw:{x:p.x+px*sc*fl,y:p.y+py*sc},mag:{x:p.x+mx*sc*fl,y:p.y+my*sc},head:{x:p.x,y:p.y-64*sc}};
}
function armTowards(tx,ty){
  const p=catPos(),sc=p.s/100;
  if(tx>p.x+p.s*.18)cat.flipT=-1;else if(tx<p.x-p.s*.18)cat.flipT=1;
  const fl=cat.flipT;
  const lx=(tx-p.x)/(sc*fl),ly=(ty-p.y)/sc;
  const dx=lx+15,dy=ly+44;
  return clamp(Math.atan2(-dx,dy),-.5,3.05);
}
function startAct(a){
  switch(a.type){
    case 'pour':S.juice=.5;S.pour=0;SND.pour();earsUp(2);break;
    case 'tilt':SND.hmm();cat.bubble=1;break;
    case 'point':SND.meow();earsUp(2.4);break;
    case 'toast':earsUp(2);break;
    case 'sip':break;
    case 'arrange':break;
    case 'hop':SND.tap();break;
  }
}
function tickAct(a,p,dt){
  if(a.type==='pour'){S.pour=clamp((p-.15)/.75,0,1);
    if(p>.15&&p<.9&&Math.random()<.5){const g=catGeo();addPart('drop',g.paw.x+R(-3,3),g.paw.y+R(0,6),R(-10,10),R(30,80),.5,juiceRGB());}}
  if(a.type==='toast'&&p>.45&&!a.fired){a.fired=true;SND.toast();const g=catGeo();for(let i=0;i<12;i++)addPart('spark',g.paw.x,g.paw.y-20,R(-160,160),R(-200,40),.8,[255,240,160]);cat.ear=1;}
  if(a.type==='sip'&&p>.4&&!a.fired){a.fired=true;S.juice===2?SND.jingle():SND.dull();}
  if(a.type==='offer'&&p>.3&&!a.fired){a.fired=true;}
}
function endAct(a){
  if(a.type==='pour'){S.juice=1;S.pour=1;
    if(S.found.ice&&!isFlying('ice')){const rp=restPos('ice');launch('ice',rp.x,rp.y,rp.D,'cup',.15);}
    else{catDo('tilt',2.4);}
  }
  if(a.type==='tilt'){cat.bubble=0;cat.remind=0;}
}
function catUpdate(dt){
  if(!cat.act&&cat.q.length)cat.act=cat.q.shift();
  const a=cat.act;
  if(a){if(!a.started){a.started=true;startAct(a);}a.t+=dt;const p=Math.min(1,a.t/a.dur);tickAct(a,p,dt);if(p>=1){cat.act=null;endAct(a);}}
  // arm target
  let th=null;const g=catGeo();
  const act=cat.act;
  if(act){
    const P=act.t/act.dur;
    if(act.type==='arrange'){const b=basketNow();th=armTowards(b.cx,b.cy);cat.lean=Math.sin(P*PI)*.1*(b.cx<g.p.x?1:-1)*cat.flip;}
    else if(act.type==='point'){const r=prect('beach');th=armTowards(r.cx,r.cy)+Math.sin(act.t*9)*.06;}
    else if(act.type==='pour'){const j=juicePos();th=armTowards(j.x,j.y-j.D*.85);}
    else if(act.type==='toast'){th=lerp(cat.arm,2.9,.2);armTowards(g.p.x-cat.flip*10,0);}
    else if(act.type==='sip'){const s=Math.sin(P*PI);th=2.2+s*.5;}
    else if(act.type==='tilt'){const j=juicePos();th=armTowards(j.x,j.y);}
    else if(act.type==='offer'&&offer){th=armTowards(offer.x,offer.y);}
    else if(act.type==='hop'){th=1.2;}
  }
  if(th==null){
    let tg=null;
    if(cat.lookT>0&&cat.look)tg=cat.look;
    else if(drag)tg={x:drag.x,y:drag.y};
    else if(goal&&goal.pos)tg=goal.pos();
    if(tg)th=armTowards(tg.x,tg.y);else th=2.3+Math.sin(T*.5)*.3;
  }
  if(!act||act.type!=='arrange')cat.lean*=Math.pow(.02,dt);
  cat.arm=lerp(cat.arm,th,1-Math.pow(.004,dt));
  cat.flip+=clamp(cat.flipT-cat.flip,-dt*7,dt*7);
  cat.lookT-=dt;
  // ears
  cat.earUpT-=dt;cat.ear=lerp(cat.ear,cat.earUpT>0?1:0,1-Math.pow(.01,dt));
  // tilt
  const wantTilt=(act&&act.type==='tilt')?1:0;cat.tilt=lerp(cat.tilt,wantTilt,1-Math.pow(.02,dt));
  // blink
  cat.nextBlink-=dt;if(cat.nextBlink<0){cat.blink=1;cat.nextBlink=R(2,5);}cat.blink=Math.max(0,cat.blink-dt*7);
  cat.twitch=Math.max(0,cat.twitch-dt*3);
  // sun squint
  const sun=(pmT===1&&!S.paraPlaced)?1:0;cat.sq=lerp(cat.sq,sun*.5,1-Math.pow(.1,dt));
  cat.shade=lerp(cat.shade,cat.shadeT,1-Math.pow(.15,dt));
  // remind about missing ice
  if(S.juice===1&&!S.found.ice&&!catBusy()){cat.remind+=dt;if(cat.remind>8){cat.remind=0;catDo('tilt',2);}}
}
function drawEye(x,y,lx,ly,lid){

  const pw=1.1+cat.ear*.9;
  ctx.fillStyle='#0c0804';ctx.beginPath();ctx.ellipse(lx,ly,pw,3.7,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(1.5+lx*.3,-1.4+ly*.2,.95,0,TAU);ctx.fill();
  if(lid>0){ctx.fillStyle=lin(ctx,0,-5,0,5,[[0,'#d68a46'],[1,'#b8723a']]);ctx.fillRect(-6,-5.5,12,10.5*lid);
    ctx.strokeStyle='#2a180c';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-5,-5+10*lid);ctx.lineTo(5,-5+10*lid);ctx.stroke();}

}

  ctx.translate(0,20);

function drawCat(){
  const g=catGeo(),p=g.p,sc=g.sc;
  const breath=Math.sin(T*2.2)*.6;
  const act=cat.act;
  ctx.save();ctx.translate(p.x,p.y);
  // ground shadow
  ctx.fillStyle='rgba(30,15,5,.25)';ctx.beginPath();ctx.ellipse(0,0,p.s*.36,p.s*.06,0,0,TAU);ctx.fill();
  ctx.scale(sc*cat.flip,sc);ctx.rotate(cat.lean);
  dSpr(SP.tail,22,-8,1,-.15+Math.sin(T*1.7)*.22+(cat.ear*.3),1,1,1,2);
  dSpr(SP.body,0,breath*.3,1,0,1,1,1,2);
  // head
  ctx.save();ctx.translate(0,-62+breath);
  const tilt=cat.tilt*.38*(1)+Math.sin(T*.9)*.03;ctx.rotate(-tilt);
  const eu=cat.ear,tw=Math.sin(T*40)*cat.twitch*.25;
  const flat=cat.sq*.35;
  dSpr(SP.ear,-13,-16,1,-.3+eu*.24-flat+tw,1,1,1+eu*.12,1.5);
  dSpr(SP.ear,13,-16,1,.3-eu*.24+flat,1,-1,1+eu*.12,1.5);
  dSpr(SP.head,0,0,1,0,1,1,1,2);
  // eyes look
  let tg=null;if(cat.lookT>0&&cat.look)tg=cat.look;else if(act&&act.type==='pour'){const j=juicePos();tg={x:j.x,y:j.y};}
  else if(act&&act.type==='tilt'){const k=prect('kitchen');tg={x:k.cx,y:k.cy};}
  else if(offer)tg=offer;else if(card)tg=card;else if(goal&&goal.pos)tg=goal.pos();
  let lx=0,ly=0;if(tg){const dx=(tg.x-g.head.x)*cat.flip,dy=tg.y-g.head.y;const d=Math.hypot(dx,dy)||1;lx=dx/d*1.7;ly=dy/d*1.1;}
  const lid=Math.max(cat.blink>.5?1-(cat.blink-.5)*2:cat.blink*2,cat.sq);

  ctx.save();ctx.translate(-15,-44);ctx.rotate(cat.arm);

  ctx.restore();
  ctx.restore();
  // held objects drawn in screen space (not flipped)
  const holdM=!act||['arrange','point','tilt','hop'].includes(act.type);
  if(holdM&&!cat.hidemag){
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc*cat.flip,sc);ctx.rotate(cat.lean);ctx.translate(-15,-44);ctx.rotate(cat.arm);drawMagnifier();ctx.restore();
  }
  if(act&&act.type==='pour'){
    const fid=act.data.fruit||'straw';const P=act.t/act.dur;
    drawItem(fid,g.paw.x,g.paw.y-p.s*.04,p.s*.2*(1-Math.sin(P*30)*.06*(P>.15&&P<.9?1:0)),Math.sin(T*8)*.1);
  }
  // thought bubble
  if(cat.bubble>0&&act&&act.type==='tilt'){
    const P=act.t/act.dur;const a=clamp(Math.min(P*5,(1-P)*5),0,1);
    const bx=p.x+p.s*.34*cat.flip*-1,by=p.y-p.s*1.08;

    for(const c of cs){ctx.fillStyle='rgba(40,20,5,.2)';ctx.beginPath();ctx.arc(c[0]+2,c[1]+3,c[2],0,TAU);ctx.fill();ctx.fillStyle='#fbf7ec';ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,TAU);ctx.fill();}
    const br=p.s*.17;

    ctx.fillStyle='#fbf7ec';ctx.beginPath();ctx.arc(bx,by,br,0,TAU);ctx.fill();
    ctx.globalAlpha=a*(.55+.25*Math.sin(T*5));dSpr(SP.ice,bx,by,br*1.3/72,Math.sin(T*3)*.1,1,1,1,0);

/* ---------------- particles ---------------- */
const MAXP=150;
function addPart(type,x,y,vx,vy,life,col,size){if(parts.length>=MAXP)return;parts.push({type,x,y,vx,vy,life,max:life,col:col||[255,255,255],size:size||R(4,9),rot:R(0,TAU),vr:R(-8,8)});}
function paperBurst(x,y,n,cols){for(let i=0;i<n;i++){const a=R(0,TAU),s=R(80,260);addPart('paper',x,y,Math.cos(a)*s,Math.sin(a)*s-120,R(.7,1.2),cols?cols[i%cols.length]:[250,246,236]);}}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.type==='paper'||p.type==='conf'){p.vy+=420*dt;p.vx*=Math.pow(.3,dt);p.vy*=Math.pow(.5,dt);}
  else if(p.type==='drop'){p.vy+=600*dt;}
  else if(p.type==='spark'){p.vx*=Math.pow(.1,dt);p.vy*=Math.pow(.1,dt);}
  else if(p.type==='bub'){p.vy-=20*dt;}
}}
function drawParts(){for(const p of parts){const a=clamp(p.life/p.max*1.5,0,1);
  if(p.type==='paper'||p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.abs(Math.cos(p.rot*1.3))+.2);ctx.fillStyle=rgba(p.col,a);ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);ctx.strokeStyle='rgba(120,90,60,'+a*.3+')';ctx.lineWidth=.5;ctx.strokeRect(-p.size/2,-p.size/3,p.size,p.size*.66);ctx.restore();}
  else if(p.type==='spark'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*.3);ctx.fillStyle=rgba(p.col,a);const s=p.size*.9;ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(0,0,s,0);ctx.quadraticCurveTo(0,0,0,s);ctx.quadraticCurveTo(0,0,-s,0);ctx.quadraticCurveTo(0,0,0,-s);ctx.fill();ctx.restore();}
  else if(p.type==='drop'){ctx.fillStyle=rgba(p.col,a);ctx.beginPath();ctx.ellipse(p.x,p.y,2.2,3.2,0,0,TAU);ctx.fill();}
  else if(p.type==='ring'){const t=1-p.life/p.max;ctx.strokeStyle=rgba(p.col,(1-t)*.8);ctx.lineWidth=3*(1-t)+1;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.3+t),0,TAU);ctx.stroke();}
}}

/* ---------------- flying items ---------------- */
function isFlying(id){return flying.some(f=>f.id===id);}
function launch(id,x,y,D0,dest,delay){
  flying.push({id,x0:x,y0:y,D0,dest,t:-(delay||0),dur:.95,pop:.24});
}
function flyTarget(f){
  if(f.dest==='cup'){const j=juicePos();return {x:j.x,y:j.y-j.D*.2,D:j.D*.45,rot:0};}
  if(f.dest==='placed'){const q=paraPlacedPos();return {x:q.x,y:q.y,D:q.D,rot:0};}
  if(f.dest==='pin'){return pinPos();}
  return restPos(f.id==='pin'?'para':f.id);
}
function updFlying(dt){
  for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt;
    if(f.t>0&&Math.random()<.4){const P=flyState(f);addPart('paper',P.x,P.y,R(-40,40),R(-40,20),.5,[250,246,236],R(3,6));}
    if(f.t>=f.dur){flying.splice(i,1);land(f);}}
}
function flyState(f){
  const tg=flyTarget(f);const t=Math.max(0,f.t);
  if(t<f.pop){const p=t/f.pop;return {x:f.x0,y:f.y0-easeOut(p)*f.D0*.5,D:f.D0*(.4+backOut(p)*.8),rot:Math.sin(p*PI)*.3};}
  const p=ease((t-f.pop)/(f.dur-f.pop));const sx=f.x0,sy=f.y0-f.D0*.5;
  const mx=(sx+tg.x)/2,my=Math.min(sy,tg.y)-Math.max(60,Math.abs(tg.x-sx)*.35);
  const x=(1-p)*(1-p)*sx+2*(1-p)*p*mx+p*p*tg.x,y=(1-p)*(1-p)*sy+2*(1-p)*p*my+p*p*tg.y;
  return {x,y,D:lerp(f.D0*1.2,tg.D,p),rot:(1-p)*Math.sin(p*TAU*1.5)*.6+p*(tg.rot||0)};
}
function land(f){
  if(f.id==='pin'){if(pin){pin.state='stuck';pin.spin=18;}SND.whirr();return;}
  if(f.dest==='cup'){
    if(f.id==='ice'){S.juice=2;SND.iceDrop();const j=juicePos();for(let i=0;i<10;i++)addPart('drop',j.x,j.y-j.D*.3,R(-90,90),R(-200,-60),.7,juiceRGB());
      addPart('ring',j.x,j.y-j.D*.3,0,0,.6,[200,240,255],j.D*.8);
      catDo('toast',1.8);validTouch();}
    if(f.id==='lemon'){S.fruit.l=true;SND.pour();catDo('sip',1.2);earsUp(1.5);}
    return;
  }
  if(f.dest==='placed'){return;}
  SND.plop();bump('basket',1.2);const rp=restPos(f.id);addPart('ring',rp.x,rp.y,0,0,.45,[255,250,220],rp.D*.8);
  earsUp(1.3);
  if(!catBusy())catDo('arrange',.7);
  if(f.id==='straw'&&!S.found.cup&&!S.found.para)catDo('point',2.4);
}

/* ---------------- finding ---------------- */
function validTouch(){if(T-S.lastValid<3.2)S.combo=Math.min(S.combo+1,9);else S.combo=0;S.lastValid=T;}
function photoPress(name,x,y,amt){const r=prect(name);const l=w2l(r,x,y);const P=PH[name];P.px=l.x;P.py=l.y;P.d=Math.max(P.d,amt);P.v=0;}
function find(sp,x,y){
  sp.found=true;sp.peel=0;
  validTouch();
  SND.peel();SND.find(S.combo);
  photoPress(sp.photo,x,y,1+S.combo*.12);
  paperBurst(x,y,14);
  const r=prect(sp.photo),I=inner(r);
  const D0=Math.max(40,sp.r*I.side*1.5);
  const p=s2w(r,sp.u,sp.v);
  switch(sp.id){
    case 'straw':S.found.straw=true;S.fruit.s=true;launch('straw',p.x,p.y,D0,'rest');break;
    case 'cup':S.found.cup=true;launch('cup',p.x,p.y,D0,'rest');break;
    case 'para':S.found.para=true;launch('para',p.x,p.y,D0*1.1,'rest');break;
    case 'ice':S.found.ice=true;launch('ice',p.x,p.y,D0,S.juice===1?'cup':'rest');break;
    case 'lemon':S.found.lemon=true;if(S.juice>=1){launch('lemon',p.x,p.y,D0,'cup');}else{S.fruit.l=true;launch('lemon',p.x,p.y,D0,'rest');}break;
  }
  maybePinwheel(p.x,p.y);
}
function maybePinwheel(x,y){
  if(S.pinDone||pin)return;
  const n=Object.values(S.found).filter(Boolean).length;
  if(n<2||Math.random()>.16)return;
  S.pinDone=true;pin={state:'fly',ang:0,spin:10};
  flying.push({id:'pin',x0:x,y0:y,D0:50,dest:'pin',t:-.35,dur:1.1,pop:.25});
}
function pinPos(){
  if(epm>.5){const p=s2w(prect('park'),.88,.62);return {x:p.x,y:p.y,D:p.side*.14,rot:0};}
  const b=basketNow();const k=b.w/120;return {x:b.cx+52*k,y:b.cy-30*k,D:b.w*.32,rot:0};
}
function rugEnds(x,y){
  const a=spot('rugA'),b=spot('rugB');
  if(!S.rugEndsSeen){S.rugEndsSeen=true;validTouch();SND.peel();SND.discover(S.combo);photoPress('park',x,y,1);
    for(const s of [a,b]){const p=s2w(prect('park'),s.u,s.v);paperBurst(p.x,p.y,8);s.peel=0;}
    earsUp(1.6);const c=lensChips()[1];catLook(c.x,c.y,2);bump('chip_rb',1.4);
  }else{
    photoPress('park',x,y,.7);SND.tap();wig.rugEnds={t:0,a:1};
    const c=lensChips()[1];catLook(c.x,c.y,1.6);bump('chip_rb',1);
    for(const s of [a,b]){s.hint=1;s.hintCol=LENS_COL.purple;}
  }
}
function spreadRug(x,y){
  S.rug=true;S.rugEndsSeen=true;for(const id of ['rugA','rugB','rug'])spot(id).found=true;
  validTouch();SND.whoosh();photoPress('park',x,y,1.4);
  const cols=[[118,52,150],[242,235,242],[250,246,236]];paperBurst(x,y,30,cols);
  pmT=1;rugOpen=0;earsUp(3);catDo('hop',1);
}

/* ---------------- goal / guidance ---------------- */
const PRIORITY=['straw','ice','rugA','rug','lemon'];
function spotGoal(sp){return {key:'spot_'+sp.id+'_'+S.cycle,kind:'tap',hl:{t:'spot',id:sp.id},vis:true,pos:()=>{const p=s2w(prect(sp.photo),sp.u,sp.v);return {x:p.x,y:p.y};}};}
function chipGoal(id,kind){return {key:'chip_'+id+'_'+kind+'_'+S.cycle,kind,hl:{t:'chip',id},pos:()=>{const c=lensChips().find(c=>c.id===id);return {x:c.x,y:c.y};}};}
function computeGoal(){
  if(S.finale===1&&offer)return {key:'offer'+S.cycle,kind:'tap',hl:{t:'offer'},pos:()=>offer};
  if(S.finale===3&&card)return {key:'card'+S.cycle,kind:'tap',hl:{t:'card'},pos:()=>card};
  if(S.finale)return null;
  if(pm>0&&pm<1)return null;
  if(S.rug&&S.found.para&&!S.paraPlaced&&!isFlying('para')){
    return {key:'drag'+S.cycle,kind:'drag',hl:{t:'para'},pos:()=>{const r=restPos('para');return {x:r.x,y:r.y};},pos2:()=>dropZone()};
  }
  const avail=id=>{const s=spot(id);return s&&!s.found&&spotActive(s);};
  if(S.juice===1&&!S.found.ice){const s=spot('ice');if(S.lens==='yellow')return spotGoal(s);return chipGoal('yellow','tap');}
  // lens-specific, visible now
  for(const id of PRIORITY){
    if(!avail(id))continue;const s=spot(id);
    if(id==='rugA'&&S.rugEndsSeen)continue;
    if(lensOK(s.req))return spotGoal(s);
  }
  for(const id of ['cup','para']){if(avail(id))return spotGoal(spot(id));}
  // need a different lens
  for(const id of PRIORITY){
    if(!avail(id))continue;const s=spot(id);
    if(id==='rugA'){if(S.rugEndsSeen)continue;return chipGoal('rb','tap');}
    if(id==='rug'){if(!S.rugEndsSeen&&!(S.lens==='rb'))continue;return chipGoal('rb',S.lens==='rb'?'hold':'tap');}
    return chipGoal(REQ_LENS[s.req],'tap');
  }
  if(!S.rug){return chipGoal('rb',S.lens==='rb'?'hold':'tap');}
  return null;
}

/* ---------------- finale & cycle ---------------- */
function juiceRGB(){if(S.fruit.s&&S.fruit.l)return [244,140,90];if(S.fruit.l)return [242,206,70];return [232,62,100];}
function checkAuto(dt){
  if(S.juice===0&&S.found.cup&&(S.fruit.s||S.fruit.l)&&!isFlying('cup')&&!isFlying('straw')&&!isFlying('lemon')&&!catBusy()&&pm%1===0){
    catDo('pour',2.4,{fruit:S.fruit.s?'straw':'lemon'});S.juice=.5;S.pour=0;
  }
  if(!S.finale&&S.rug&&S.paraPlaced&&S.juice===2&&!catBusy()&&!flying.length&&pm>=1){
    finaleT+=dt;if(finaleT>1.4){S.finale=1;finaleT=0;const pr=prect('park');offer={x:pr.cx,y:pr.cy-pr.h*.05,t:0};SND.meow();earsUp(3);}
  }
  if(S.finale===2){finaleT+=dt;if(finaleT>1.8&&!card){S.finale=3;const pr=prect('park');card={x:pr.cx,y:pr.cy-pr.h*.02,t:0,c:snapshot()};SND.ding();}}
}
function snapshot(){
  const r=prect('park');const s=mk(220,180),g=s.getContext('2d');
  try{const bw=r.w*DPR,bh=r.h*DPR;g.drawImage(cv,(r.cx-r.w/2)*DPR,(r.cy-r.h/2)*DPR,bw,bh,0,0,220,180);}catch(e){g.fillStyle='#8b6';g.fillRect(0,0,220,180);}
  return s;
}
function newCycle(){
  if(card){S.mementos.push({c:card.c,rot:R(-.25,.25)});if(S.mementos.length>3)S.mementos.shift();}
  S.cycle++;
  S.found={straw:false,cup:false,para:false,ice:false,lemon:false};
  S.rugEndsSeen=false;S.rug=false;S.paraPlaced=false;S.juice=0;S.pour=0;S.fruit={s:false,l:false};S.finale=0;S.pinDone=false;
  pin=null;offer=null;card=null;finaleT=0;cat.shadeT=0;cat.q=[];cat.act=null;cat.bubble=0;
  const choices=['red','rb','yellow'].filter(l=>l!==S.startLens);S.startLens=choices[(Math.random()*2)|0];S.lens=S.startLens;S.mix=0;
  demoDone={};pmT=0;shadeGrow=0;connectT=0;

/* ---------------- input ---------------- */
const pointers=new Map();
function chipAt(x,y){for(const c of lensChips()){if(dist(x,y,c.x,c.y)<c.r*1.25)return c;}return null;}
function onDown(e){
  e.preventDefault();
  audioInit();S.firstTouch=true;
  idleT=0;demo=null;
  const x=e.clientX,y=e.clientY;
  pointers.set(e.pointerId,{x,y});
  // finale targets
  if(S.finale===1&&offer&&dist(x,y,offer.x,offer.y)<Math.min(W,H)*.2){S.finale=2;finaleT=0;offer.done=0;SND.toast();SND.purr();paperBurst(offer.x,offer.y,36,[[230,62,100],[118,52,150],[250,205,40],[250,246,236],[40,90,220]]);catDo('toast',1.8);earsUp(3);validTouch();return;}
  if(S.finale===3&&card&&dist(x,y,card.x,card.y)<Math.min(W,H)*.22){SND.chime();paperBurst(card.x,card.y,20);newCycle();return;}
  // lens chips
  const c=chipAt(x,y);
  if(c){
    const was=S.lens;S.lens=c.id;bump('chip_'+c.id,1.2);SND.lens(c.id);if(was!==c.id){validTouch();lensFlash=1;}
    if(c.id==='rb'){hold={id:e.pointerId,t:0,was};try{cv.setPointerCapture(e.pointerId);}catch(_){}}
    return;
  }
  // parasol drag
  if(S.found.para&&!S.paraPlaced&&!isFlying('para')&&!drag){
    const rp=restPos('para');
    if(dist(x,y,rp.x,rp.y-rp.D*.15)<Math.max(40,rp.D*.55)){
      if(S.rug){drag={id:e.pointerId,x,y,ox:rp.x-x,oy:rp.y-y};try{cv.setPointerCapture(e.pointerId);}catch(_){}SND.crinkle(2);earsUp(1);return;}
      wiggle('para');SND.wig();const pr=prect('park');catLook(pr.cx,pr.cy,1.5);return;
    }
  }
  // juice cup
  if(S.juice>=1){const j=juicePos();if(Math.abs(x-j.x)<Math.max(34,j.D*.5)&&Math.abs(y-j.y)<Math.max(40,j.D*.6)){
    if(!catBusy()){catDo('sip',1.2);}else{S.juice===2?SND.jingle():SND.dull();}wiggle('juice');if(S.juice===1){const k=prect('kitchen');catLook(k.cx,k.cy,1.2);}return;}}
  // pinwheel
  if(pin&&pin.state==='stuck'){const pp=pinPos();if(dist(x,y,pp.x,pp.y-pp.D*.3)<Math.max(36,pp.D*.6)){pin.spin=30;SND.whirr();return;}}
  // cat
  {const p=catPos();if(Math.abs(x-p.x)<p.s*.38&&y<p.y+8&&y>p.y-p.s*.95){cat.twitch=1;SND.meow();wiggle('cat');return;}}
  // basket
  {const b=basketNow();if(Math.abs(x-b.cx)<b.w*.55&&Math.abs(y-b.cy+b.w*.08)<b.w*.4){wiggle('basket');SND.wig();return;}}
  // photos (topmost first)
  if(pm>0&&pm<1)return;
  for(let i=ORDER.length-1;i>=0;i--){
    const name=ORDER[i],r=prect(name);
    if(!inRect(r,x,y,4))continue;
    const I=inner(r);
    let best=null,bd=1e9;
    for(const sp of spots){
      if(sp.photo!==name||sp.found||!spotActive(sp))continue;
      const p=s2w(r,sp.u,sp.v);let rad=Math.max(sp.r*I.side,30)+8;
      if(sp.id==='rug'){const pa=s2w(r,sp.a[0],sp.a[1]),pb=s2w(r,sp.b[0],sp.b[1]);
        // distance to segment between ends
        const vx=pb.x-pa.x,vy=pb.y-pa.y,L=vx*vx+vy*vy||1;const t=clamp(((x-pa.x)*vx+(y-pa.y)*vy)/L,0,1);
        const d=dist(x,y,pa.x+vx*t,pa.y+vy*t);if(d<Math.max(.1*I.side,36)&&lensOK('purple')){best=sp;bd=-1;}continue;}
      const d=dist(x,y,p.x,p.y);if(d<rad&&d<bd){bd=d;best=sp;}
    }
    if(best){
      if(best.id==='rug'){spreadRug(x,y);return;}
      if(lensOK(best.req)){
        if(best.id==='rugA'||best.id==='rugB'){rugEnds(x,y);return;}
        find(best,x,y);return;
      }
      // right place, wrong lens: shimmer of needed colour + cat glances at the chip
      photoPress(name,x,y,.6);SND.tap();
      const need=REQ_LENS[best.req];best.hint=1;best.hintCol=need==='rb'?LENS_COL.purple:LENS_COL[need];
      if(best.id==='rugA'||best.id==='rugB'){const o=spot(best.id==='rugA'?'rugB':'rugA');}
      const ch=lensChips().find(c=>c.id===need);if(ch){catLook(ch.x,ch.y,1.5);}
      return;
    }
    photoPress(name,x,y,.55);SND.wig();wiggle('ph_'+name,.5);
    return;
  }
  // mementos
  for(let i=S.mementos.length-1;i>=0;i--){const m=mementoPos(i);if(dist(x,y,m.x,m.y)<m.w*.5){wiggle('mem'+i);SND.wig();return;}}
  // plain cork: no reaction
}
function onMove(e){
  const pt=pointers.get(e.pointerId);if(pt){pt.x=e.clientX;pt.y=e.clientY;}
  if(drag&&drag.id===e.pointerId){drag.x=e.clientX;drag.y=e.clientY;idleT=0;}
}
function onUp(e,cancel){
  pointers.delete(e.pointerId);
  if(hold&&hold.id===e.pointerId){
    if(!cancel&&hold.t<.28&&hold.was==='rb'&&S.mix<PURPLE)S.mix=Math.min(PURPLE-.01,S.mix+.05);
    hold=null;
  }
  if(drag&&drag.id===e.pointerId){
    const dz=dropZone();const x=drag.x+drag.ox,y=drag.y+drag.oy;
    if(!cancel&&S.rug&&dist(x,y,dz.x,dz.y)<dz.r){
      S.paraPlaced=true;launch('para',x,y,restPos('para').D,'placed');flying[flying.length-1].pop=0;flying[flying.length-1].dur=.3;flying[flying.length-1].t=0;
      setTimeout(()=>{},0);SND.snap();validTouch();cat.shadeT=1;earsUp(2.4);catDo('hop',1.1);
      for(let i=0;i<12;i++)addPart('spark',dz.x+R(-40,40),dz.y+R(-40,20),R(-60,60),R(-80,0),.7,[255,240,170]);
    }else{
      launch('para',x,y,restPos('para').D,'rest');const f=flying[flying.length-1];f.pop=0;f.dur=.45;f.t=0;SND.wig();

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',e=>onUp(e,false));
cv.addEventListener('pointercancel',e=>onUp(e,true));
cv.addEventListener('lostpointercapture',e=>{if((drag&&drag.id===e.pointerId)||(hold&&hold.id===e.pointerId))onUp(e,true);});
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
function releaseAll(){if(drag){onUp({pointerId:drag.id},true);}hold=null;pointers.clear();}
window.addEventListener('blur',releaseAll);

/* ---------------- update ---------------- */
let crinkleT=0;
function update(dt){
  T+=dt;idleT+=dt;
  for(const k in wig){wig[k].t+=dt;if(wig[k].t>1.2)delete wig[k];}
  for(const k in bounce){bounce[k].t+=dt;if(bounce[k].t>1.4)delete bounce[k];}
  // photo spring
  for(const k in PH){const P=PH[k];const acc=-320*P.d-13*P.v;P.v+=acc*dt;P.d+=P.v*dt;if(Math.abs(P.d)<.001&&Math.abs(P.v)<.01){P.d=0;P.v=0;}}
  // mode transition
  const prevPm=pm;pm+=clamp(pmT-pm,-dt/1.3,dt/1.3);epm=ease(pm);
  if(pmT===1&&pm>.35)rugOpen=Math.min(1,rugOpen+dt/1.1);
  if(pmT===0)rugOpen=Math.max(0,rugOpen-dt*2);
  shadeGrow=lerp(shadeGrow,S.paraPlaced?1:0,1-Math.pow(.05,dt));
  // hold mixing
  if(hold){hold.t+=dt;
    if(hold.t>.12&&S.lens==='rb'&&S.mix<1){const before=S.mix;S.mix=Math.min(1,S.mix+dt/2.2);
      if(before<PURPLE&&S.mix>=PURPLE){SND.chime();lensFlash=1;bump('chip_rb',1.6);validTouch();earsUp(1.4);connectT=0;}}
    crinkleT-=dt;if(crinkleT<=0){crinkleT=R(.03,.07);SND.crinkle(1.2);}
  }
  if(S.lens==='rb'&&S.mix>=PURPLE)connectT=Math.min(1,connectT+dt/.9);
  lensFlash=Math.max(0,lensFlash-dt*2.5);
  // spots
  for(const sp of spots){const want=!sp.found&&spotActive(sp)&&lensOK(sp.req);sp.vis=clamp(sp.vis+(want?dt/1.1:-dt*3),0,1);
    if(sp.peel>=0)sp.peel+=dt;sp.hint=Math.max(0,sp.hint-dt*1.4);}
  updFlying(dt);updParts(dt);catUpdate(dt);checkAuto(dt);
  if(pin){pin.ang+=pin.spin*dt;pin.spin=lerp(pin.spin,3,1-Math.pow(.5,dt));}
  if(offer)offer.t+=dt;if(card)card.t+=dt;
  goal=computeGoal();
  // demo hand (once per goal, after ~4s idle)
  if(!demo&&goal&&idleT>4&&!demoDone[goal.key]&&!flying.length&&!(cat.act&&cat.act.type==='pour')&&!drag&&!hold){demoDone[goal.key]=1;demo={g:goal,t:0};}
  if(demo){demo.t+=dt;const len=demo.g.kind==='hold'?3.4:demo.g.kind==='drag'?3.2:2.4;if(demo.t>len)demo=null;}
}

/* ---------------- drawing ---------------- */
function drawCello(w,h,name){
  const P=PH[name];
  ctx.save();ctx.translate(w*.012,-h*.01);ctx.rotate(.014);
  const cw=w*1.02,ch=h*1.01;
  rr(ctx,-cw/2,-ch/2,cw,ch,4);
  ctx.save();ctx.clip();
  ctx.globalCompositeOperation='multiply';
  const A=(name==='park'&&epm>.5)?.6:1;
  if(S.lens==='red'){ctx.fillStyle='rgba(255,92,105,'+(.46*A)+')';ctx.fillRect(-cw/2,-ch/2,cw,ch);}
  else if(S.lens==='yellow'){ctx.fillStyle='rgba(255,226,80,'+(.44*A)+')';ctx.fillRect(-cw/2,-ch/2,cw,ch);}
  else{
    const m=S.mix,sw=Math.max(9,Math.min(w,h)*.07);
    const cr=mixCol([255,95,110],[180,110,235],m),cb=mixCol([95,140,255],[180,110,235],m);
    ctx.fillStyle=rgba(cr,.46*A);ctx.fillRect(-cw/2,-ch/2,cw,ch);
    if(m<.98){ctx.fillStyle=rgba(cb,.5*A*(1-m));
    const off=(hold?Math.sin(T*14)*sw*.15:0);
    for(let x=-cw-ch;x<cw+ch;x+=sw*2){ctx.beginPath();ctx.moveTo(x+off,-ch/2);ctx.lineTo(x+sw+off,-ch/2);ctx.lineTo(x+sw+off+ch*.6,ch/2);ctx.lineTo(x+off+ch*.6,ch/2);ctx.closePath();ctx.fill();}}
    if(m>.02){ctx.fillStyle=rgba([170,110,225],m*.18*A);ctx.fillRect(-cw/2,-ch/2,cw,ch);}
  }

  if(S.finale>=1&&offer){const t=clamp(offer.t/.8,0,1);const big=Math.min(W,H)*.3;
    const pulse=S.finale===1?1+.04*Math.sin(T*5):1;
    j={x:lerp(j.x,offer.x,easeOut(t)),y:lerp(j.y,offer.y,easeOut(t)),D:lerp(j.D,big,easeOut(t))*pulse};
    if(S.finale===1){ctx.fillStyle=rad(ctx,j.x,j.y,0,j.x,j.y,j.D*.9,[[0,'rgba(255,250,220,.7)'],[1,'rgba(255,250,220,0)']]);ctx.beginPath();ctx.arc(j.x,j.y,j.D*.9,0,TAU);ctx.fill();}
    if(S.finale>=2){const f=clamp(finaleT/1.2,0,1);j.D*=lerp(1,.0,clamp((finaleT-1.2)/.5,0,1));rot+=Math.sin(f*PI)*.3;}
    if(j.D<2)return;
  }
  const fill=S.juice===.5?S.pour:1;
  drawCupAt(j.x,j.y,j.D,{fill,col:juiceRGB(),ice:S.juice===2,rot});
}
function drawPin(){
  const p=pinPos();dSpr(SP.pinS,p.x,p.y-p.D*.55,p.D/92,0,1,1,1,2);dSpr(SP.pinH,p.x,p.y-p.D*.55,p.D*.75/76,pin.ang,1,1,1,2);
}
function drawPlacedParasol(){
  if(!S.paraPlaced||isFlying('para'))return;
  const q=paraPlacedPos();dSpr(SP.para,q.x,q.y,q.D/120,-.08+Math.sin(T*1.3)*.015,1,1,1,4);
}
function drawFlying(){
  for(const f of flying){if(f.t<0)continue;const s=flyState(f);
    if(f.id==='pin'){dSpr(SP.pinH,s.x,s.y,s.D/76,T*12,1,1,1,3);continue;}
    drawItem(f.id,s.x,s.y,s.D,s.rot);}
}
function mementoPos(i){
  const r=prect('park');const w=Math.min(W,H)*.16;
  const pts=[[.5,-.5],[-.5,-.48],[.48,.5]];const q=pts[i%3];
  const c=Math.cos(r.rot),s=Math.sin(r.rot);const lx=q[0]*r.w,ly=q[1]*r.h;
  return {x:clamp(r.cx+lx*c-ly*s,w*.55+SA.l,W-SA.r-w*.55),y:clamp(r.cy+lx*s+ly*c,w*.55+SA.t,H-SA.b-w*.55),w};
}
function drawMementos(){
  S.mementos.forEach((m,i)=>{const p=mementoPos(i);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(m.rot+wigA('mem'+i));
    const w=p.w,h=w*.95;ctx.fillStyle='rgba(30,14,4,.3)';ctx.fillRect(-w/2+3,-h/2+5,w,h);
    ctx.fillStyle='#fbf7ee';ctx.fillRect(-w/2,-h/2,w,h);ctx.drawImage(m.c,-w/2+w*.06,-h/2+w*.06,w*.88,h*.72);
    ctx.fillStyle=rad(ctx,-2,-h/2+4,1,0,-h/2+6,7,[[0,'#ff9a9a'],[1,'#b8303a']]);ctx.beginPath();ctx.arc(0,-h/2+6,6,0,TAU);ctx.fill();
    ctx.restore();});
}
function drawDemo(){
  if(!demo)return;const g=demo.g;const t=demo.t;
  const p=g.pos();if(!p)return;
  const len=g.kind==='hold'?3.4:g.kind==='drag'?3.2:2.4;
  const a=clamp(Math.min(t/.35,(len-t)/.35),0,1);
  let x=p.x,y=p.y,press=0;
  const sz=Math.min(W,H)*.2;
  if(t<.7){const k=easeOut(t/.7);x=lerp(p.x+sz*.8,p.x,k);y=lerp(p.y+sz*.9,p.y,k);}
  else if(g.kind==='tap'){const k=(t-.7);press=k<.35?Math.sin(k/.35*PI):0;if(k>.15&&k<.2&&!demo.r){demo.r=1;addPart('ring',p.x,p.y,0,0,.6,[255,255,255],sz*.4);}}
  else if(g.kind==='hold'){const k=t-.7;press=k<2.1?1:0;if(k<2.1&&Math.random()<.15)addPart('ring',p.x,p.y,0,0,.5,[255,255,255],sz*.35);}
  else if(g.kind==='drag'){const q=g.pos2();const k=clamp((t-1)/1.4,0,1);press=t>.8&&t<2.5?1:0;x=lerp(p.x,q.x,ease(k));y=lerp(p.y,q.y,ease(k));
    if(press){ctx.save();ctx.globalAlpha=.55*a;const rp=restPos('para');drawItem('para',x,y-rp.D*.1,rp.D,0);ctx.restore();}}
  ctx.save();ctx.globalAlpha=a;
  dSpr(SP.hand,x+4,y+4,sz/100*(1-press*.08),-.25,1,1,1,press?1:4);
  ctx.restore();
}
function drawGoalOverlay(){
  if(S.finale===3&&card){
    const t=clamp(card.t/.6,0,1);const w=Math.min(W,H)*.34*backOut(t),h=w*.95;const g=catGeo();
    const x=lerp(g.paw.x,card.x,easeOut(t)),y=lerp(g.paw.y,card.y,easeOut(t));
    ctx.save();ctx.translate(x,y+Math.sin(T*3)*4);ctx.rotate(Math.sin(T*1.5)*.05);
    ctx.fillStyle=rad(ctx,0,0,w*.3,0,0,w*.9,[[0,'rgba(255,250,215,.6)'],[1,'rgba(255,250,215,0)']]);ctx.beginPath();ctx.arc(0,0,w*.9,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(30,14,4,.3)';ctx.fillRect(-w/2+5,-h/2+8,w,h);
    ctx.fillStyle='#fbf7ee';ctx.fillRect(-w/2,-h/2,w,h);ctx.drawImage(card.c,-w/2+w*.06,-h/2+w*.06,w*.88,h*.72);
    ctx.restore();
  }
}
let SCN={};
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  drawMementos();
  for(const n of ORDER)drawPhoto(n);
  // picnic layer inside park
  const clipPark=epm>.98;
  if(clipPark){const r=prect('park'),I=inner(r);ctx.save();ctx.translate(r.cx,r.cy);ctx.rotate(r.rot);ctx.beginPath();ctx.rect(I.x0,I.y0,I.w,I.h);ctx.restore();ctx.save();ctx.clip();}
  drawRugItems();
  drawPlacedParasol();
  if(pin&&pin.state==='stuck'&&epm>.5)drawPin();
  drawCat();
  drawBasketAndItems();
  if(clipPark)ctx.restore();
  for(const c of lensChips())drawChip(c);
  // drop zone hint while dragging
  if(drag){const dz=dropZone();ctx.strokeStyle='rgba(255,255,255,'+(.5+.3*Math.sin(T*6))+')';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.lineDashOffset=-T*40;ctx.beginPath();ctx.ellipse(dz.x,dz.y,dz.r*.8,dz.r*.4,0,0,TAU);ctx.stroke();ctx.setLineDash([]);
    const rp=restPos('para');drawItem('para',drag.x+drag.ox,drag.y+drag.oy,rp.D*1.25,Math.sin(T*8)*.05);}
  drawJuice();
  drawFlying();
  drawParts();
  drawGoalOverlay();
  drawDemo();
}

/* ---------------- loop / visibility ---------------- */
let raf=0,last=0,running=false;
function frame(now){
  if(!running)return;
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  try{update(dt);render();}catch(err){console.error(err);running=false;return;}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();releaseAll();try{AC&&AC.suspend();}catch(e){}}
  else{try{AC&&AC.state==='suspended'&&S.firstTouch&&AC.resume();}catch(e){}start();}
});
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{resize();if(!running&&!document.hidden)start();else if(document.hidden){} else render();},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

/* ---------------- boot ---------------- */
initSprites();
SCN={kitchen:sceneKitchen(768),beach:sceneBeach(768),park:scenePark(1024)};
setupSpots(true);
resize();
goal=computeGoal();
render();
if(!document.hidden)start();

// test hooks (read-only helpers for automated checks)
window.__gf={S,get goal(){return goal;},get pm(){return pm;},get flying(){return flying.length;},
  spotScreen(id){const sp=spot(id);if(!sp)return null;const p=s2w(prect(sp.photo),sp.u,sp.v);return {x:p.x,y:p.y,found:sp.found,req:sp.req};},
  chip(id){const c=lensChips().find(c=>c.id===id);return {x:c.x,y:c.y,r:c.r};},
  parasol(){const r=restPos('para');return {x:r.x,y:r.y-r.D*.15};},
  drop(){const d=dropZone();return {x:d.x,y:d.y};},
  juice(){const j=juicePos();return {x:j.x,y:j.y};},
  offer(){return offer?{x:offer.x,y:offer.y}:null;},card(){return card?{x:card.x,y:card.y}:null;},
  rect(n){return prect(n);},catBusy,get parts(){return parts.length;},get demo(){return !!demo;},
  basket(){const b=basketNow();return {x:b.cx,y:b.cy,w:b.w};}};
})();
</script>
