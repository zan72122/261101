let noiseTile=null, htTile=null;
function makeTiles(){
  noiseTile=document.createElement('canvas'); noiseTile.width=noiseTile.height=96;
  const g=noiseTile.getContext('2d'); const id=g.createImageData(96,96); const r=mulberry(SEED+7);
  for(let i=0;i<id.data.length;i+=4){const v=(r()*255)|0; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=(r()*95)|0;}
  g.putImageData(id,0,0);
  htTile=document.createElement('canvas'); htTile.width=htTile.height=6;
  const h=htTile.getContext('2d'); h.fillStyle='#000'; h.beginPath(); h.arc(1.5,1.5,1.2,0,TAU); h.arc(4.5,4.5,1.2,0,TAU); h.fill();
}
function grain(g,a){g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=a||0.1; g.fillStyle=g.createPattern(noiseTile,'repeat'); g.fillRect(0,0,g.canvas.width,g.canvas.height); g.restore();}
function halftone(g,a,clipFn,col){g.save(); if(clipFn){g.beginPath(); clipFn(g); g.clip();} g.setTransform(1,0,0,1,0,0); g.globalAlpha=a; g.fillStyle=g.createPattern(htTile,'repeat'); g.fillRect(0,0,g.canvas.width,g.canvas.height); g.restore();}
function rrect(g,x,y,w,h,r){r=Math.min(r,w/2,h/2); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r); g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();}
// photo-collage cutout: white paper border + cast shadow, then clipped paint
function cut(g,path,paint,o){
  o=o||{}; const bw=(o.bw==null?6:o.bw)*S;
  g.save(); path(g); g.shadowColor=o.sc||'rgba(40,20,5,.45)'; g.shadowBlur=(o.blur||9)*S*DPR; g.shadowOffsetX=(o.ox==null?4:o.ox)*S*DPR; g.shadowOffsetY=(o.oy==null?6:o.oy)*S*DPR;
  g.lineJoin='round'; g.lineWidth=bw*2; g.strokeStyle='#fbfaf4'; g.fillStyle='#fbfaf4'; if(bw>0) g.stroke(); g.fill(); g.restore();
  g.save(); path(g); g.lineWidth=bw*2+1.2; g.strokeStyle='rgba(120,100,70,.18)'; if(bw>0){g.globalCompositeOperation='destination-over'; g.stroke();} g.restore();
  g.save(); path(g); g.clip(); paint(g); if(o.grain!==false) grain(g,o.ga||0.08); g.restore();
}
function sprite(w,h,pad,fn){const c=mk(w+pad*2,h+pad*2); const g=c.getContext('2d'); g.scale(DPR,DPR); g.translate(pad,pad); fn(g,w,h); return {c:c,w:w+pad*2,h:h+pad*2,pad:pad};}
function dspr(sp,x,y,rot,sx,sy,ax,ay){ if(!sp) return; ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot); if(sx==null) sx=1; if(sy==null) sy=sx; if(sx!==1||sy!==1) ctx.scale(sx,sy); ctx.drawImage(sp.c,-sp.w*(ax==null?0.5:ax),-sp.h*(ay==null?0.5:ay),sp.w,sp.h); ctx.restore(); }

function drawWood(g,w,h,seed){
  const r=mulberry(seed); const ph=Math.max(80,150*S);
  g.fillStyle='#8a5a33'; g.fillRect(0,0,w,h);
  for(let y0=-r()*ph; y0<h; y0+=ph){
    const tn=r(); g.fillStyle=rgb([lerp(126,172,tn),lerp(78,114,tn),lerp(42,64,tn)]); g.fillRect(0,y0,w,ph);
    const gr=g.createLinearGradient(0,y0,0,y0+ph); gr.addColorStop(0,'rgba(255,230,190,.12)'); gr.addColorStop(.5,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(40,20,5,.2)'); g.fillStyle=gr; g.fillRect(0,y0,w,ph);
    for(let i=0;i<24;i++){
      const yy=y0+r()*ph, amp=2+r()*7, f=0.002+r()*0.006, p=r()*TAU, f2=0.02+r()*0.03;

    }
    if(r()<0.5){const kx=r()*w, ky=y0+ph*(0.3+r()*0.4); for(let k=0;k<6;k++){g.beginPath(); g.ellipse(kx,ky,(4+k*5)*1.8,3+k*3.2,0,0,TAU); g.strokeStyle='rgba(60,28,8,'+(0.25-k*0.03)+')'; g.lineWidth=1.5; g.stroke();} g.fillStyle='rgba(55,25,8,.5)'; g.beginPath(); g.ellipse(kx,ky,6,3.5,0,0,TAU); g.fill();}
    g.fillStyle='rgba(35,16,4,.55)'; g.fillRect(0,y0+ph-2,w,2); g.fillStyle='rgba(255,225,180,.18)'; g.fillRect(0,y0+ph,w,1.2);

function tornPts(w,h,r){const p=[],st=9*S,j=3.5*S; for(let t=0;t<w;t+=st)p.push([t,(r()-0.5)*j]); for(let t=0;t<h;t+=st)p.push([w+(r()-0.5)*j,t]); for(let t=w;t>0;t-=st)p.push([t,h+(r()-0.5)*j]); for(let t=h;t>0;t-=st)p.push([(r()-0.5)*j,t]); return p;}
function paperScrap(g,x,y,w,h,rot,r,kind){

  g.save(); g.translate(x+w/2,y+h/2); g.rotate(rot); g.translate(-w/2,-h/2);
  const path=g2=>{g2.beginPath(); pts.forEach((p,i)=>i?g2.lineTo(p[0],p[1]):g2.moveTo(p[0],p[1])); g2.closePath();};
  cut(g,path,g2=>{
    const base={news:'#ebe5d3',blue:'#a9c8e0',yellow:'#efd793',pink:'#efb9b0'}[kind]||'#ebe5d3';
    g2.fillStyle=base; g2.fillRect(-10,-10,w+20,h+20);
    if(kind==='news'){

      for(let i=0;i<3;i++){const bx=r()*w*0.7, by=r()*h*0.7, bw=w*(0.2+r()*0.25), bh=h*(0.2+r()*0.3);
        const gr=g2.createLinearGradient(bx,by,bx+bw,by+bh); gr.addColorStop(0,'rgba(60,60,60,.25)'); gr.addColorStop(1,'rgba(60,60,60,.05)'); g2.fillStyle=gr; g2.fillRect(bx,by,bw,bh);
        halftone(g2,0.16,g3=>g3.rect(bx,by,bw,bh));}
      g2.fillStyle='rgba(80,80,80,.07)'; for(let yy=8*S;yy<h;yy+=11*S) g2.fillRect(6*S,yy,w-12*S,3*S);
    } else {
      halftone(g2,0.1,g3=>g3.rect(w*0.4,0,w,h));

    const sh=g2.createLinearGradient(0,0,w,h); sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(1,'rgba(0,0,0,.12)'); g2.fillStyle=sh; g2.fillRect(-10,-10,w+20,h+20);
  },{bw:0,blur:7,ox:3,oy:5});

}

  const ds=drumReady(), ts=tableSocks();

  SP.clouds.forEach((c,i)=>{const x=((k.cl[i]*W+G.t*(8+i*4)*S*(1+k.E))%(W+c.w))-c.w/2; dspr(c,x,H*(0.12+i*0.13)+SAFE.t);});
  k.kites.forEach(q=>{ctx.strokeStyle='rgba(60,40,20,.55)'; ctx.lineWidth=1.2*S; ctx.beginPath(); ctx.moveTo(q.ax,q.ay); ctx.quadraticCurveTo((q.ax+q.x)/2+30*S,(q.ay+q.y)/2+40*S,q.x,q.y+20*S); ctx.stroke();
    const F=G.flag; const tails=F.bands.length?F.bands.map(b=>rgb(b.col)):['#fff']; for(let i=0;i<4;i++){const tx=q.x-i*10*S-Math.sin(G.t*4+i+q.ph)*6*S, ty=q.y+30*S+i*12*S; ctx.fillStyle=tails[i%tails.length]; ctx.beginPath(); ctx.ellipse(tx,ty,6*S,3*S,0.6,0,TAU); ctx.fill();}
    dspr(kiteSprite(q.col),q.x,q.y,Math.sin(G.t*2+q.ph)*0.2);});
  K.wm.forEach((w,i)=>{const sc=w[2]; dspr(SP.tower,w[0],w[1],0,sc,sc,0.5,1-SP.tower.pad/SP.tower.h); const hy=w[1]-(SP.tower.h-SP.tower.pad*2)*sc*0.98;
    for(let b=0;b<4;b++){dspr(SP.blade,w[0],hy,k.wmA[i]+b*TAU/4,sc,sc,0.5,1-SP.blade.pad/SP.blade.h);} ctx.fillStyle='#5a3a22'; ctx.beginPath(); ctx.arc(w[0],hy,5*S*sc,0,TAU); ctx.fill();});
  // pole
  const px=K.pole[0], py=K.pole[1]; ctx.fillStyle='#fbfaf4'; ctx.fillRect(px-8*S,py-14*S,16*S,K.poleB-py+14*S); const pg=ctx.createLinearGradient(px-5*S,0,px+5*S,0); pg.addColorStop(0,'#e8c48e'); pg.addColorStop(1,'#8a5a33'); ctx.fillStyle=pg; ctx.fillRect(px-5*S,py-10*S,10*S,K.poleB-py+10*S);
  ctx.fillStyle='#ffbf00'; ctx.beginPath(); ctx.arc(px,py-14*S,10*S,0,TAU); ctx.fill(); ctx.strokeStyle='#fbfaf4'; ctx.lineWidth=3*S; ctx.stroke();
  if(withFlag!==false) drawFlag();
  const hb=isT('home')?Math.abs(Math.sin(G.t*4.5))*10*S:0; dspr(SP.home,K.home[0],K.home[1]-hb);
}
function drawFlag(){const F=G.flag, k=G.sky, K=k.K; if(!F||!F.tex) return; const tex=F.tex; const N=28, tw=tex.w, sw=tw/N; const x0=K.pole[0]-F.pad, y0=K.pole[1]-F.pad;
  const comp=1-0.1*Math.abs(k.tip)/(H*0.3);
  for(let i=0;i<N;i++){const f=clamp((i*sw-F.pad)/F.pw,0,1); const off=flagWave(f); const sl=flagWave(Math.min(1,f+0.03))-flagWave(Math.max(0,f-0.03));
    const dx=x0+i*sw*comp, sx=i*sw*DPR, sW=sw*DPR+1;
    ctx.drawImage(tex.c,sx,0,sW,tex.c.height,dx,y0+off,sw*comp+0.7,tex.h);
    const a=clamp(Math.abs(sl)/(12*S),0,0.55); if(a>0.02){ctx.globalAlpha=a; ctx.drawImage(sl>0?F.texD:F.texL,sx,0,sW,tex.c.height,dx,y0+off,sw*comp+0.7,tex.h); ctx.globalAlpha=1;}}
  if(F.bands.length){const tx=x0+tw*comp-F.pad, ty=y0+F.pad+flagWave(1); F.bands.forEach((b,j)=>{ctx.strokeStyle=rgb(b.col); ctx.lineWidth=6*S; ctx.lineCap='round'; ctx.beginPath(); const len=(30+k.E*90)*S; for(let q=0;q<=10;q++){const x=tx+q/10*len, y=ty+(10+j*18)*S+Math.sin(k.ph*1.5-q*0.7+j)*(4+k.E*10)*S; q?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();});}
}
/* ================= HAND DEMO ================= */
function drawHand(){const d=G.demo; if(!d) return; const p=tPos(d.tg); if(!p){G.demo=null; return;} const t=d.t; let x=p.x,y=p.y,press=0,al=1;
  if(d.kind==='hold'){const a=ease(t/0.4), l=ease((t-1.8)/0.4); x+=(1-a)*70*S+l*70*S; y+=(1-a)*90*S+l*90*S; press=t>0.4&&t<1.8?1:0; al=1-l;
    if(press){ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3*S; const rr2=((t*2)%1)*40*S+10*S; ctx.globalAlpha=1-((t*2)%1); ctx.beginPath(); ctx.arc(p.x,p.y,rr2,0,TAU); ctx.stroke(); ctx.globalAlpha=1;}}
  else if(d.kind==='drag'){const a=ease(t/0.4), l=ease((t-2.0)/0.3); x+=(1-a)*60*S; y+=(1-a)*80*S+Math.sin(clamp(t-0.4,0,1.6)/1.6*TAU*2)*60*S; press=t>0.4&&t<2.0?1:0; al=1-l;}
  else {const a=ease(t/0.35), l=ease((t-0.9)/0.35); x+=(1-a)*60*S+l*60*S; y+=(1-a)*80*S+l*80*S; press=t>0.4&&t<0.65?1:0; al=1-l;
    if(t>0.42&&t<0.9){ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=3*S; ctx.globalAlpha=1-(t-0.42)/0.48; ctx.beginPath(); ctx.arc(p.x,p.y,10*S+(t-0.42)*90*S,0,TAU); ctx.stroke(); ctx.globalAlpha=1;}}
  ctx.globalAlpha=clamp(al,0,1); const sc=press?0.9:1; ctx.save(); ctx.translate(x,y); ctx.rotate(-0.35); ctx.scale(sc,sc); ctx.drawImage(SP.hand.c,-SP.hand.tip[0],-SP.hand.tip[1]+4*S,SP.hand.w,SP.hand.h); ctx.restore(); ctx.globalAlpha=1;}

/* ================= TRANSITIONS ================= */
function drawFlyFlag(e,fromX,fromY,fromS,toX,toY,toS,spin){const F=G.flag; if(!F||!F.tex) return; const x=lerp(fromX,toX,e), y=lerp(fromY,toY,e)-Math.sin(Math.PI*e)*H*0.15, sc=lerp(fromS,toS,e); dspr(F.tex,x,y,Math.sin(Math.PI*e)*spin,sc);}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.scene==='shop') drawShop();
  else if(G.scene==='sky') drawSky(true);
  else if(G.scene==='toSky'){const k=G.tr, pan=ease((k-0.3)/0.7); ctx.save(); ctx.translate(0,H*pan); drawShop(); ctx.restore(); if(pan>0){ctx.save(); ctx.translate(0,-H*(1-pan)); drawSky(false); ctx.restore();}
    const F=G.flag, K=G.sky.K; if(F&&F.tex) drawFlyFlag(ease(k),L.drum[0],L.drum[1]+H*pan,0.25,K.pole[0]-F.pad+F.tex.w/2,K.pole[1]-F.pad+F.tex.h/2-H*(1-pan),1,0.6);}
  else if(G.scene==='toShop'){const k=G.tr, pan=ease(k); ctx.save(); ctx.translate(0,-H*pan); drawSky(false); ctx.restore(); ctx.save(); ctx.translate(0,H*(1-pan)); drawShop(); ctx.restore();
    const F=G.flag, K=G.sky.K; if(F&&F.tex) drawFlyFlag(ease(k),K.pole[0]-F.pad+F.tex.w/2,K.pole[1]-F.pad+F.tex.h/2-H*pan,1,L.win.x+L.win.w/2,L.win.y+30*S+H*(1-pan),0.12,-0.4);}
  drawParts(); drawHand();
}
/* ================= INPUT ================= */
function hitShop(x,y){
  const c=[]; const add=(type,d,r,ref)=>{if(d<r) c.push({type:type,q:d/r,ref:ref});};
  const dd=(a,b)=>Math.hypot(x-a,y-b);
  add('switch',dd(L.sw[0],L.sw[1]),L.swR*1.35);
  G.socks.forEach(s=>{ if(s.hop) return; const hr=SOCK_H*S*s.len*s.ps*0.62; if(s.loc==='table') add('tsock',dd(s.px,s.py),hr,s); else if(s.loc==='line') add('hsock',dd(s.px,s.py),hr*1.05,s); });
  G.plate.forEach((f,i)=>add('fruit',dd(L.fruitPos[i][0],L.fruitPos[i][1]),L.fruitR*1.45,i));
  add('window',dd(L.drum[0],L.drum[1]),L.drumR*1.2);
  const J=L.jar; if(x>J.cx-J.wTop/2-10*S&&x<J.cx+J.wTop/2+10*S&&y>J.top-20*S&&y<L.base.y+L.base.h) c.push({type:'jar',q:0.95});
  const m=L.mac; if(x>m.x&&x<m.x+m.w&&y>m.y&&y<m.y+m.h) c.push({type:'mac',q:0.99});
  if(G.decos.length&&y>L.win.y&&y<L.win.y+70*S&&x>L.win.x&&x<L.win.x+L.win.w) c.push({type:'deco',q:0.9});
  c.sort((a,b)=>a.q-b.q); return c[0]||null;
}
function down(id,x,y){
  G.idle=0; if(G.demo){G.demoDone[G.demo.tg.type]=true; G.demo=null;}
  if(G.scene==='shop'){ const h=hitShop(x,y); if(!h) return; logE('down',{type:h.type});
    switch(h.type){
      case 'switch': if(!G.held.has(id)){G.held.set(id,1); G.press=Math.max(G.press,0.6); SND.click();} break;
      case 'tsock': tapTableSock(h.ref); break;
      case 'hsock': tapHungSock(h.ref); break;
      case 'fruit': tapFruit(h.ref); break;
      case 'window': tapWindow(); break;
      case 'jar': G.wig.jar=1; SND.wig(); break;
      case 'mac': G.wig.mac=1; SND.wig(); break;
      case 'deco': SND.wig(); G.decos.forEach(d=>d.ph+=1); break;
    }
  } else if(G.scene==='sky'){ const k=G.sky, K=k.K; const f=flagRect(); const hm=SP.home;
    if(Math.hypot(x-K.home[0],y-K.home[1])<hm.w*0.55){ G.scene='toShop'; G.tr=0; k.grab=null; SND.home(); logE('home'); return; }
    if(f&&x>f.x-20*S&&x<f.x+f.w+50*S&&y>f.y-60*S+Math.min(0,k.tip)&&y<f.y+f.h+60*S+Math.max(0,k.tip)){ k.grab=id; k.gx=x; k.gy=y; k.tipT=k.tip; SND.pop(); logE('grab'); return; }
    K.wm.forEach(w=>{ if(Math.hypot(x-w[0],y-w[1]+60*S)<70*S*w[2]){ k.wmA[0]+=0.1; SND.wig(); } });
  }
}
function move(id,x,y){ if(G.scene==='sky'){const k=G.sky; if(k.grab!==id) return; const dx=x-k.gx, dy=y-k.gy; k.gx=x; k.gy=y; k.E=Math.min(1.6,k.E+(Math.abs(dx)*0.4+Math.abs(dy))/(H*0.35)); const f=flagRect(); k.tipT=clamp(y-(f.y+f.h/2),-H*0.25,H*0.25);} }
function up(id){ G.held.delete(id); if(G.sky&&G.sky.grab===id) G.sky.grab=null; }
cv.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); try{cv.setPointerCapture(e.pointerId);}catch(_){} down(e.pointerId,e.clientX,e.clientY);},{passive:false});
cv.addEventListener('pointermove',e=>{e.preventDefault(); move(e.pointerId,e.clientX,e.clientY);},{passive:false});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>up(e.pointerId)));
window.addEventListener('blur',()=>{G.held.clear(); if(G.sky) G.sky.grab=null;});
['contextmenu','selectstart','gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1) e.preventDefault();},{passive:false});

/* ================= LOOP ================= */
let last=0, running=true, raf=0;
function update(dt){
  G.t+=dt; G.idle+=dt;
  if(G.scene==='shop'||G.scene==='toSky') updShop(dt);
  if(G.scene==='toSky'){G.tr+=dt/1.7; if(G.sky) updSky(dt); if(G.tr>=1){G.scene='sky'; G.tr=0;}}
  else if(G.scene==='sky') updSky(dt);
  else if(G.scene==='toShop'){G.tr+=dt/1.4; if(G.tr>=1){processReturn(); G.scene='shop'; G.tr=0;} updShop(dt);}
  updParts(dt);
  G.target=computeTarget();
  if(G.demo){G.demo.t+=dt; if(G.demo.t>G.demo.d){G.demoDone[G.demo.tg.type]=true; G.demo=null;}}
  else if(G.idle>4&&G.target&&!G.demoDone[G.target.type]&&(G.scene==='shop'||G.scene==='sky')&&G.held.size===0){const ty=G.target.type; G.demo={tg:G.target,t:0,kind:ty==='switch'?'hold':ty==='flag'?'drag':'tap',d:ty==='switch'?2.3:ty==='flag'?2.4:1.3};}
  if(AC&&mot){ const r=G.scene==='shop'?G.rpm:0; setP(mot.o.frequency,45+r*130); setP(mot.o2.frequency,22+r*65); setP(mot.f.frequency,250+r*1300); setP(mot.g.gain,r*0.07);
    setP(shim.o.frequency,380+G.mixLvl*700+G.flagP*700); setP(shim.g.gain,Math.min(0.06,(G.xfer/Math.max(dt,0.001))*0.05+G.flagP*G.rpm*0.06));
    const wv=G.scene==='sky'&&G.sky?Math.min(1,G.sky.E*0.5+G.sky.wmV*0.03):0; setP(wind.g.gain,wv*0.08); setP(wind.f.frequency,400+wv*1400); }
}
function frame(ts){ if(!running) return; raf=requestAnimationFrame(frame); const dt=Math.min(0.05,Math.max(0,(ts-last)/1000||0)); last=ts;
  try{update(dt); render();}catch(err){ if(!G.err){G.err=String(err&&err.stack||err); console.warn(G.err);} } }
function resize(){
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight); DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  computeLayout(); buildShopBG(); buildFruit(); buildMachine(); buildSkyBG();
  G.socks.forEach(s=>{s.sprS=0;}); rebuildDecos();
  if(G.sky){G.sky.K=skyLayout(); buildFlagTex(); buildBlade();}
  G.socks.forEach(s=>{ if(!s.hop) place(s,homePos(s)); else {s.hop.fx=homePos(s).x; s.hop.fy=homePos(s).y-100*S;} });
}
let rzT=0; window.addEventListener('resize',()=>{clearTimeout(rzT); rzT=setTimeout(resize,60);}); window.addEventListener('orientationchange',()=>{setTimeout(resize,250);});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){running=false; cancelAnimationFrame(raf); G.held.clear(); if(G.sky) G.sky.grab=null; if(AC){try{AC.suspend();}catch(e){}}}
  else { if(!running){running=true; last=performance.now(); raf=requestAnimationFrame(frame);} if(AC){try{AC.resume();}catch(e){}} } });
function init(){
  makeTiles(); resize();
  const sc=pick(['red','blue']); let dc=pick(['blue','yellow']); if(dc===sc) dc='yellow';
  const kinds=[['stripe',sc],['dot',dc],[null],[null]]; const slots=shuffle([0,1,2,3,4,5]).slice(0,4);
  kinds.forEach((k,i)=>{const s=newSock(k[0],k[1]); s.slot=slots[i]; place(s,tablePos(s)); renderSock(s);});
  G.jar=[{type:'straw',hp:1,j:rr(-1,1)}]; G.plate=shuffle(['straw','lemon']).map(t=>({type:t,pop:1}));
  last=performance.now(); raf=requestAnimationFrame(frame);
}
// read-only inspection hook for automated checks
window.__gf={G:G,L:L,sig:sig,tPos:tPos,flagRect:flagRect,get S(){return S;},get W(){return W;},get H(){return H;}};
init();
})();
</script>
