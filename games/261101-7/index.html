<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>どん、ぽん！墨たいこの山びらき</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e6dcc6;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>

<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
(function(){
// =====================================================================
//  どん、ぽん！墨たいこの山びらき  — 文字なし・一本指・墨の太鼓あそび
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const N = 120;                 // 地形の列数
const MAX_PARTS = 120;         // 同時粒子の上限
const MAX_DOTS = 200;          // 一枚あたりの墨点の上限
const MAX_PINES = 48;
let W = 0, H = 0, DPR = 1;
const SAFE = {t:0, r:0, b:0, l:0};

// ---------------- 乱数・補助 ----------------
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let seedState = (Math.random() * 1e9) >>> 0;
function newSeed(){ seedState = (Math.imul(seedState, 1103515245) + 12345) >>> 0; return seedState; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

// 墨の五階調
const TONE = [[22,19,17],[54,49,45],[94,88,82],[144,137,127],[190,182,168]];
function ink(t, a){ const c = TONE[t]; return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
const PAPER = 'rgba(243,236,220,';
const SHU = 'rgba(196,58,36,';

// ---------------- 和紙テクスチャ ----------------
function makePaperCanvas(r0, g0, b0, seed){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')'; g.fillRect(0, 0, 256, 256);
  const r = mulberry(seed);
  for (let i = 0; i < 700; i++){ g.fillStyle = 'rgba(120,98,66,' + (r() * 0.045) + ')'; g.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1 + r() * 2); }
  g.lineCap = 'round';
  for (let i = 0; i < 140; i++){
    const x = r() * 256, y = r() * 256, a = r() * Math.PI * 2, l = 8 + r() * 34;
    g.strokeStyle = (r() < 0.6) ? 'rgba(150,126,92,' + (0.04 + r() * 0.07) + ')' : 'rgba(255,252,244,' + (0.25 + r() * 0.3) + ')';
    g.lineWidth = 0.4 + r() * 0.8;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (r() - 0.5) * 10, y + Math.sin(a) * l * 0.5 + (r() - 0.5) * 10, x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  return c;
}
const paperBgCv = makePaperCanvas(228, 218, 196, 11);
const paperSheetCv = makePaperCanvas(243, 236, 220, 23);
const patCache = new Map();
function pat(g, which){
  let m = patCache.get(g); if (!m){ m = {}; patCache.set(g, m); }
  if (!m[which]) m[which] = g.createPattern(which === 'bg' ? paperBgCv : paperSheetCv, 'repeat');
  return m[which];
}

// ---------------- 筆 ----------------
// 太さの変わる筆線（多角形で塗る）
function strokePoly(g, pts, wf){
  const n = pts.length; if (n < 2) return;
  const Lx = new Array(n), Ly = new Array(n), Rx = new Array(n), Ry = new Array(n);
  for (let i = 0; i < n; i++){
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l, w = wf(i / (n - 1)) * 0.5;
    Lx[i] = pts[i][0] + nx * w; Ly[i] = pts[i][1] + ny * w;
    Rx[i] = pts[i][0] - nx * w; Ry[i] = pts[i][1] - ny * w;
  }
  g.beginPath(); g.moveTo(Lx[0], Ly[0]);
  for (let i = 1; i < n; i++) g.lineTo(Lx[i], Ly[i]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(Rx[i], Ry[i]);
  g.closePath(); g.fill();
}
// かすれ：紙色の細い筋を筆線の中に走らせる
function kasure(g, pts, wf, rnd, k, alpha){
  const n = pts.length; if (n < 2) return;
  g.save(); g.lineCap = 'butt';
  for (let j = 0; j < k; j++){
    const off = (rnd() - 0.5) * 0.8;
    g.strokeStyle = PAPER + (alpha * (0.5 + rnd() * 0.5)) + ')';
    g.lineWidth = 0.5 + rnd() * 1.3;
    g.setLineDash([2 + rnd() * 16, 1 + rnd() * 6, 1 + rnd() * 10, 2 + rnd() * 5]);
    g.lineDashOffset = rnd() * 30;
    g.beginPath();
    for (let i = 0; i < n; i++){
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1;
      const w = wf(i / (n - 1)) * off;
      const x = pts[i][0] - dy / l * w, y = pts[i][1] + dx / l * w;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  g.setLineDash([]); g.restore();
}
function brush(g, pts, wmax, tone, alpha, seed, dry){
  const r = mulberry(seed || 1);
  const ph = r() * 6, amp = 0.25;
  const wf = t => wmax * (0.25 + 0.75 * Math.pow(Math.sin(Math.PI * clamp(t * 0.92 + 0.04, 0, 1)), 0.55)) * (1 + amp * Math.sin(t * 7 + ph) * 0.6);
  g.fillStyle = ink(tone, alpha); strokePoly(g, pts, wf);
  if (dry) kasure(g, pts, wf, r, dry, 0.75);
}
// 墨点（濃＝かすれ、薄＝にじみ）
function blot(g, x, y, r, tone, alpha, seed, dense, grow){
  const rnd = mulberry(seed);
  if (!dense){
    const R2 = r * (1.25 + 0.85 * grow);
    const gr = g.createRadialGradient(x, y, r * 0.3, x, y, R2);
    gr.addColorStop(0, ink(tone, alpha * 0.85)); gr.addColorStop(0.55, ink(tone, alpha * 0.4)); gr.addColorStop(1, ink(tone, 0));
    g.fillStyle = gr; g.beginPath();
    for (let k = 0; k < 14; k++){ const a = k / 14 * Math.PI * 2, rr = R2 * (0.8 + rnd() * 0.35); const px = x + Math.cos(a) * rr * 1.25, py = y + Math.sin(a) * rr * 0.8; if (k) g.lineTo(px, py); else g.moveTo(px, py); }
    g.closePath(); g.fill();
    // 紙の繊維に沿ったにじみ筋
    g.strokeStyle = ink(tone, alpha * 0.45); g.lineWidth = Math.max(0.6, r * 0.06);
    for (let k = 0; k < 7; k++){
      const a = (rnd() < 0.5 ? 0 : Math.PI) + (rnd() - 0.5) * 0.9, s = R2 * (0.6 + rnd() * 0.3), l = r * (0.3 + grow * (0.6 + rnd() * 0.7));
      g.beginPath(); g.moveTo(x + Math.cos(a) * s, y + Math.sin(a) * s * 0.7); g.lineTo(x + Math.cos(a) * (s + l), y + Math.sin(a) * (s + l) * 0.7 + (rnd() - 0.5) * r * 0.3); g.stroke();
    }
    g.fillStyle = ink(tone, alpha * 0.7); g.beginPath(); g.ellipse(x, y, r * 0.75, r * 0.6, 0, 0, Math.PI * 2); g.fill();
    return;
  }
  g.fillStyle = ink(tone, alpha); g.beginPath();
  for (let k = 0; k < 16; k++){ const a = k / 16 * Math.PI * 2, rr = r * (0.82 + rnd() * 0.32); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.9; if (k) g.lineTo(px, py); else g.moveTo(px, py); }
  g.closePath(); g.fill();
  // かすれの白抜き
  g.fillStyle = PAPER + '0.55)';
  for (let k = 0; k < 4; k++){ const a = rnd() * 6.28, d = r * (0.35 + rnd() * 0.5); g.beginPath(); g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.08 + rnd() * 0.12), r * 0.04 + 0.4, a, 0, Math.PI * 2); g.fill(); }
  // 跳ね
  g.fillStyle = ink(tone, alpha * 0.9);
  for (let k = 0; k < 3; k++){ const a = rnd() * 6.28, d = r * (1.15 + rnd() * 0.6); g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, r * (0.05 + rnd() * 0.09), 0, Math.PI * 2); g.fill(); }
}

// ---------------- 地形（一枚の絵） ----------------
function newSheet(){
  const s = { h:new Float32Array(N), w:new Float32Array(N), rock:new Float32Array(N), conn:new Uint8Array(N), shore:new Uint8Array(N),
    dots:[], pines:[], paths:[], sealed:false, far:0, seed:newSeed() };
  // 紙端の描きかけの山裾
  for (let i = 0; i < 16; i++){ const u = i / 16; s.h[i] = 0.17 * Math.pow(1 - u, 1.5); s.rock[i] = 0.3 * (1 - u); s.conn[i] = i < 10 ? 1 : 0; }
  return s;
}
function cloneSheet(S){
  return { h:new Float32Array(S.h), w:new Float32Array(S.w), rock:new Float32Array(S.rock), conn:new Uint8Array(S.conn), shore:new Uint8Array(S.shore),
    dots:S.dots.map(d => Object.assign({}, d, {t0:-99})), pines:S.pines.map(p => Object.assign({}, p, {t0:-99})),
    paths:S.paths.map(p => Object.assign({}, p, {prog:1})), sealed:S.sealed, far:S.far, seed:S.seed };
}
function col(x){ return clamp(Math.floor(x * N), 0, N - 1); }
function hAt(arr, x){ const f = x * N - 0.5; const i = Math.floor(f), t = f - i; const a = arr[clamp(i, 0, N - 1)], b = arr[clamp(i + 1, 0, N - 1)]; return a + (b - a) * t; }
function isLakeCol(S, i){ return S.w[i] >= 1 && S.h[i] < 0.05; }
function lakeSpans(S){
  const sp = []; let a = -1;
  for (let i = 0; i <= N; i++){
    const l = i < N && isLakeCol(S, i);
    if (l && a < 0) a = i;
    if (!l && a >= 0){ if (i - a >= 3) sp.push([a, i - 1]); a = -1; }
  }
  return sp;
}
function nearestLakeEdge(S, x){
  const c = col(x); let best = -1, bd = 1e9;
  for (const [a, b] of lakeSpans(S)){
    for (const e of (b - a >= 2 ? [a, b] : [a])){ const d = Math.abs(e - c); if (d < bd){ bd = d; best = e; } }
    if (c >= a && c <= b){ const e = (c - a < b - c) ? a : b; return e; }
  }
  return best;
}
function lakeNear(S, x, d){ const c = col(x); for (let i = c - d; i <= c + d; i++){ if (i >= 0 && i < N && isLakeCol(S, i)) return true; } return false; }
function peakShape(d){ const a = Math.abs(d); return a >= 2.6 ? 0 : Math.pow(1 - a / 2.6, 1.8); }
function addBump(S, x, amp, sig, cap, keepLake){
  for (let i = 0; i < N; i++){
    const xi = (i + 0.5) / N; let g = peakShape((xi - x) / sig);
    if (g <= 0) continue;
    // 山の裾野は湖を埋めない（湖を変えるのは岸への濃い一打）
    if (keepLake && isLakeCol(S, i)){ if (g < 0.5) continue; g *= 0.3; }
    const nv = S.h[i] + amp * g;
    if (S.h[i] < cap) S.h[i] = Math.min(cap, nv);
  }
}
function addRock(S, x, amp, sig){ for (let i = 0; i < N; i++){ const g = peakShape(((i + 0.5) / N - x) / sig); if (g > 0) S.rock[i] = Math.min(1.5, S.rock[i] + amp * g); } }
function addMist(S, x, amp, sig){ for (let i = 0; i < N; i++){ const d = ((i + 0.5) / N - x) / sig; const g = Math.exp(-d * d / 2); if (g > 0.02) S.w[i] = Math.min(1.8, S.w[i] + amp * g); } }
function smoothArr(a, r){ const o = new Float32Array(N); for (let i = 0; i < N; i++){ let s = 0, c = 0; for (let k = -r; k <= r; k++){ const j = clamp(i + k, 0, N - 1); s += a[j]; c++; } o[i] = s / c; } return o; }

function sceneMap(R){
  const base = R.y + R.h * 0.62, U = R.h;
  return { R, U, base, X: xn => R.x + R.w * (0.03 + 0.94 * xn), Y: h => base - h * U, xn: px => ((px - R.x) / R.w - 0.03) / 0.94 };
}
function dotY(M, S, hA, d){ const hs = hAt(hA, d.x); if (d.ha < 0.012) return M.Y(hs + d.hc); return M.Y(hs * clamp(d.hc / d.ha, 0, 1.05)); }

function renderSheet(g, S, hA, R, o){
  const M = sceneMap(R), U = M.U, X = M.X, Y = M.Y, base = M.base, t = o.t || 0, mini = !!o.mini;
  g.lineJoin = 'round'; g.lineCap = 'round';
  // 遠山（朱印のあとで一枚の絵としてつながる）
  if (S.far > 0.01){
    const sm = smoothArr(hA, 8), off = U * 0.05;
    const gr = g.createLinearGradient(0, Y(0.45), 0, base);
    gr.addColorStop(0, ink(3, 0.34 * S.far)); gr.addColorStop(1, ink(4, 0));
    g.fillStyle = gr; g.beginPath(); g.moveTo(X(0), base - off);
    for (let i = 0; i < N; i++){ const hh = 0.1 + sm[i] * 0.5 + 0.05 * Math.sin(i * 0.23 + (S.seed % 13)) + 0.03 * Math.sin(i * 0.61); g.lineTo(X((i + 0.5) / N), Y(hh) - off); }
    g.lineTo(X(1), base - off); g.closePath(); g.fill();
  }
  // 山
  let i = 0;
  while (i < N){
    if (hA[i] <= 0.006){ i++; continue; }
    const a = i; while (i < N && hA[i] > 0.006) i++; const b = i - 1;
    let peak = 0, rk = 0; for (let j = a; j <= b; j++){ peak = Math.max(peak, hA[j]); rk += S.rock[j]; } rk /= (b - a + 1);
    const pts = [];
    pts.push([a === 0 ? X(0) : X(a / N), a === 0 ? Y(hA[0]) : base]);
    for (let j = a; j <= b; j++) pts.push([X((j + 0.5) / N), Y(hA[j])]);
    pts.push([b === N - 1 ? X(1) : X((b + 1) / N), b === N - 1 ? Y(hA[N - 1]) : base]);
    const gr = g.createLinearGradient(0, Y(peak), 0, base);
    gr.addColorStop(0, ink(1, Math.min(0.75, 0.3 + 0.32 * rk))); gr.addColorStop(0.5, ink(2, 0.2)); gr.addColorStop(1, ink(3, 0.02));
    g.fillStyle = gr; g.beginPath(); g.moveTo(pts[0][0], base);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(pts[pts.length - 1][0], base); g.closePath(); g.fill();
    // 稜線近くのにじみ
    g.strokeStyle = ink(2, 0.14); g.lineWidth = U * 0.03; g.beginPath();
    for (let k = 1; k < pts.length - 1; k++){ if (k === 1) g.moveTo(pts[k][0], pts[k][1] + U * 0.012); else g.lineTo(pts[k][0], pts[k][1] + U * 0.012); }
    g.stroke();
    // 皴（岩肌）
    for (let j = a; j <= b; j += 2){
      if (S.rock[j] < 0.15 || hA[j] < 0.05) continue;
      const r = mulberry(S.seed + j * 31); const n = 1 + Math.floor(S.rock[j] * 1.6);
      g.fillStyle = ink(1, 0.5);
      for (let k = 0; k < n; k++){
        const hy = hA[j] * (0.92 - r() * 0.6), x0 = X((j + 0.5) / N) + (r() - 0.5) * U * 0.025, y0 = Y(hy);
        const dir = r() < 0.5 ? -1 : 1, x1 = x0 + dir * U * 0.03 * (0.5 + r()), y1 = y0 + U * 0.045 * (0.5 + r());
        strokePoly(g, [[x0, y0], [(x0 + x1) / 2 + dir * U * 0.004, (y0 + y1) / 2], [x1, y1]], tt => U * 0.007 * (1 - tt * 0.8));
      }
    }
    // 稜線：結ばれた所は濃い筆、まだの所は淡い気配
    let k = a;
    while (k <= b){
      const cls = j => hA[j] < 0.03 ? 2 : S.conn[j];
      const c = cls(k);
      const s0 = k; while (k <= b && cls(k) === c) k++; const s1 = k - 1;
      if (c === 2) continue;
      const rp = [];
      for (let j = s0; j <= s1; j++) rp.push([X((j + 0.5) / N), Y(hA[j])]);
      if (s0 === a && a > 0) rp.unshift([X(a / N), base - U * 0.002]);
      if (s1 === b && b < N - 1) rp.push([X((b + 1) / N), base - U * 0.002]);
      if (s0 > a && cls(s0 - 1) === 2) rp.unshift([X(s0 / N), Y(hA[s0 - 1])]);
      if (s1 < b && cls(s1 + 1) === 2) rp.push([X((s1 + 1) / N), Y(hA[s1 + 1])]);
      if (rp.length < 2) continue;
      if (c){
        brush(g, rp, U * (0.012 + 0.006 * Math.min(1, rk)), 0, 0.9, S.seed + s0 * 7, mini ? 0 : 4);
      } else {
        g.strokeStyle = ink(3, 0.45); g.lineWidth = 1; g.setLineDash([U * 0.01, U * 0.008]);
        g.beginPath(); rp.forEach((p, q) => q ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.setLineDash([]);
      }
    }
  }
  // 墨点（苔点）
  for (const d of S.dots){
    const age = mini ? 9 : t - d.t0;
    const sc = age < 0.15 ? 0.45 + 0.55 * easeOut(age / 0.15) : 1;
    const grow = clamp(age / 0.9, 0, 1);
    // 稜線が結ばれた所の点は、小さな苔点になって山肌になじむ
    const joined = d.big && d.dense && S.conn[col(d.x)] && hA[col(d.x)] > 0.03;
    const r = U * d.r * sc * (joined ? 0.6 : 1);
    blot(g, X(d.x), dotY(M, S, hA, d) - (d.dense && d.big ? 0 : r * 0.2), r, d.dense ? (joined ? 1 : 0) : 3, d.dense ? (joined ? 0.8 : 0.92) : 0.55, d.seed, d.dense, grow);
  }
  // 坂道
  for (const p of S.paths){
    const x1 = lerp(p.x0, p.x1, p.prog); if (x1 - p.x0 < 0.004) continue;
    g.strokeStyle = ink(1, 0.75); g.lineWidth = Math.max(1, U * 0.0045); g.setLineDash([U * 0.012, U * 0.007]);
    g.beginPath();
    for (let x = p.x0, q = 0; x <= x1 + 1e-6; x += 0.004, q++){
      const hh = hAt(hA, x), yy = Y(hh * 0.5 + 0.008) + Math.sin(x * N * 0.8) * U * Math.min(0.02, hh * 0.08);
      if (q) g.lineTo(X(x), yy); else g.moveTo(X(x), yy);
    }
    g.stroke(); g.setLineDash([]);
  }
  // 松
  for (const p of S.pines) drawPine(g, X(p.x), Y(hAt(hA, p.x)) + U * 0.004, U * 0.11 * p.s, p, t, mini);
  // 霞
  i = 0;
  while (i < N){
    const m = S.w[i] > 0.12 && !isLakeCol(S, i);
    if (!m){ i++; continue; }
    const a = i; let sw = 0; while (i < N && S.w[i] > 0.12 && !isLakeCol(S, i)){ sw += Math.min(1, S.w[i]); i++; }
    const b = i - 1, aw = sw / (b - a + 1);
    const x0 = X(a / N) - U * 0.02, x1 = X((b + 1) / N) + U * 0.02, yc = base - U * (0.035 + 0.12 * (1 - aw)), hh = U * (0.018 + 0.026 * aw), dx = (x1 - x0) * 0.25;
    g.fillStyle = ink(3, 0.07 + 0.15 * aw); g.beginPath(); g.moveTo(x0, yc);
    g.bezierCurveTo(x0 + dx, yc - hh, x1 - dx, yc - hh, x1, yc); g.bezierCurveTo(x1 - dx, yc + hh, x0 + dx, yc + hh, x0, yc); g.fill();
    const r = mulberry(S.seed + a * 13);
    g.strokeStyle = ink(3, 0.22 + 0.2 * aw); g.lineWidth = Math.max(0.8, U * 0.003);

const SONGS = [{T:0.8, m:1}, {T:0.7, m:1.122}, {T:0.9, m:0.891}];
const G = {

function now(){ return G.t + clamp(performance.now() / 1000 - lastReal, 0, 0.05); }
function songCfg(){ return SONGS[G.song % SONGS.length]; }

  const s = LY.sheet, p = G.phase, e = (t) => clamp((G.t - G.phaseT0) / t, 0, 1);

function drumHitTest(x, y){
  let best = null, bd = 1;
  for (const name of ['big', 'small']){
    const d = LY[name]; const nx = (x - d.x) / (d.R * 1.2), ny = (y - (d.y + d.R * 0.32)) / (d.R * 0.98);
    const v = nx * nx + ny * ny; if (v <= bd){ bd = v; best = name; }
  }

}
function gallerySlots(){
  const s = LY.sheet, items = G.gallery.length + 1, out = [];
  const cols = 2, rows = 2, gw = s.fullW, gh = s.h, cw = gw / cols, ch = gh / rows;
  const asp = s.fullW / s.h;
  let mw = cw * 0.86, mh = mw / asp; if (mh > ch * 0.8){ mh = ch * 0.8; mw = mh * asp; }

    const cx = s.left + cw * (k % cols + 0.5), cy = s.y + ch * (Math.floor(k / cols) + 0.5);
    out.push({ x:cx - mw / 2, y:cy - mh / 2, w:mw, h:mh, idx:k < G.gallery.length ? k : -1 });

}
const lastPtr = new Map();
function onDown(e){

  if (G.demo){ G.demo = null; }

  if (dn){
    lastPtr.set(e.pointerId, dn);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    hitDrum(dn, t); return;
  }
  if (G.phase === 'gallery'){
    for (const sl of gallerySlots()){
      if (x >= sl.x - 8 && x <= sl.x + sl.w + 8 && y >= sl.y - 8 && y <= sl.y + sl.h + 8){ pickSheet(sl.idx); return; }
    }
  }
  // 余白では演奏せず、今触れる対象を既存のお手本で知らせる。
  const target = highlightTarget();
  if (target){ G.demo = {key:'nudge', t0:t, target}; G.child.pointT = t; }
  // 関係ない場所：小さく揺れるだけ
  const R = sheetRect(), M = sceneMap(R), c = childPos(M);

function hitDrum(name, t){

function paintHit(name, dense, t){

function pushDot(d){ const S = G.sheet; S.dots.push(d); if (S.dots.length > MAX_DOTS){ const k = S.dots.findIndex(q => !q.dense); S.dots.splice(k >= 0 ? k : 0, 1); } }

function queueRidge(x){

function doSeal(t){

// ---------------- 動く絵 ----------------

    } else {

function updateMove(dt){

        else { B.dir = w.dir; B.v += 0.07 * w.amp; B.hopT = t; sSplash(1); }

// ---------------- 巻物の棚 ----------------

function pickSheet(idx){

  else { G.src = null; base = newSheet(); }

function miniCanvas(it, w, h){

// ---------------- 更新 ----------------
function highlightTarget(){
  const p = G.phase;
  if (p === 'paint'){ if (G.signal) return G.signal.drum; if (!G.lastDrum) return 'big'; return G.lastDrum === 'big' ? 'small' : 'big'; }
  if (p === 'move'){ if (!G.lastDrum || G.lastDrum === 'big') return 'small'; return 'big'; }

}
function update(dt){
  const t = G.t, S = G.sheet;
  // 地形の表示を目標へ
  let moving = false;
  for (let i = 0; i < N; i++){ const d = S.h[i] - G.hDisp[i]; if (Math.abs(d) > 0.0004){ G.hDisp[i] += d * Math.min(1, dt * 9); moving = true; } else G.hDisp[i] = S.h[i]; }

  for (const d of S.dots) if (t - d.t0 < 0.95){ G.dirty = true; break; }
  if (!G.dirty) for (const p of S.pines) if (t - p.t0 < 0.4){ G.dirty = true; break; }
  if (t - G.sealT0 < 0.3) G.dirty = true;
  // 子の筆仕事
  const j = G.jobs[0];
  if (j){
    if (j.t0 < 0) j.t0 = t + 0.12;
    const p = (t - j.t0) / j.dur;
    if (p >= 0){
      const xx = lerp(j.x0, j.x1, clamp(p, 0, 1));
      if (j.type === 'ridge'){ for (let i = col(j.x0); i <= col(xx); i++) if (S.h[i] > 0.006) S.conn[i] = 1; }
      if (j.type === 'path') j.path.prog = clamp(p, 0, 1);
      if (j.type === 'grand'){ for (let i = 0; i <= col(xx); i++) if (S.h[i] > 0.012) S.conn[i] = 1; S.far = clamp(p, 0, 1); }
      G.dirty = true;
      if (p >= 1){ G.jobs.shift(); finishJob(j, j.type === 'grand'); if (j.type === 'grand'){ setPhase('unroll'); } }
    }
  }

  // 段階の遷移
  if (G.phase === 'unroll'){ G.dirty = true; if (t - G.phaseT0 > 1.3){ setupMove(); setPhase('move'); } }
  if (G.phase === 'move' || G.phase === 'finish') updateMove(dt);

  }

    if (p >= 1) G.demo = null;

// ---------------- 描画 ----------------

    let hop = 0; const ht = t - B.hopT; if (ht < 0.5) hop = Math.sin(ht / 0.5 * Math.PI) * U * 0.025;
    const bx = M.X(B.x), by = base + U * 0.014 - hop + Math.sin(t * 2.2) * U * 0.002;
    const s = U * 0.085;
    g.save(); g.translate(bx, by); g.scale(B.dir, 1); g.rotate(ht < 0.5 ? -Math.sin(ht / 0.5 * Math.PI * 2) * 0.15 : 0);
    g.fillStyle = ink(0, 0.9);
    g.beginPath(); g.moveTo(-s, -s * 0.12); g.quadraticCurveTo(0, s * 0.32, s * 1.05, -s * 0.22); g.quadraticCurveTo(0, s * 0.1, -s, -s * 0.12); g.fill();
    strokePoly(g, [[s * 0.15, -s * 0.05], [s * 0.05, -s * 0.85]], tt => s * (0.05 - 0.03 * tt));
    g.fillStyle = ink(2, 0.55); g.beginPath(); g.moveTo(s * 0.08, -s * 0.8); g.quadraticCurveTo(s * 0.5, -s * 0.5, s * 0.12, -s * 0.15); g.closePath(); g.fill();
    g.restore();
    g.strokeStyle = ink(2, 0.35); g.lineWidth = 1; g.beginPath(); g.moveTo(bx - s * 0.8, base + U * 0.032); g.lineTo(bx + s * 0.8, base + U * 0.032); g.stroke();
  }
  if (G.walker){
    const Wk = G.walker, px = M.X(Wk.x);
    const onPath = G.sheet.paths.some(p => Wk.x >= p.x0 && Wk.x <= p.x1);
    const hh = hAt(G.hDisp, Wk.x) * (onPath ? 0.5 : 1) + (onPath ? 0.008 : 0);
    let hop = 0; const ht = t - Wk.hopT; if (ht < 0.45) hop = Math.sin(ht / 0.45 * Math.PI) * U * 0.05;
    const ch = U * 0.12, cp = {x:px, y:M.Y(hh) + U * 0.004};
    const hand = drawChild(g, M, cp.x, cp.y, ch, {look:{x:1, y:0}, face:1, walk:true, hop});
    drawBrush(g, hand.hx, hand.hy, hand.hx - ch * 0.5, hand.hy - ch * 0.9, ch * 0.8);
  }
}
function drawGallery(g){
  const t = G.t, slots = gallerySlots();
  const newest = G.gallery.length - 1;
  for (const sl of slots){
    let bob = 0;
    if (sl.idx === newest && sl.idx >= 0){ const ph = (t * 1.6) % 1; bob = -Math.max(0, Math.sin(ph * Math.PI * 2)) * 6 * (ph < 0.5 ? 1 : 0); }
    const x = sl.x, y = sl.y + bob, w = sl.w, h = sl.h;
    g.fillStyle = ink(3, 0.18); g.fillRect(x + 3, y + 5, w, h);
    if (sl.idx >= 0){ g.drawImage(miniCanvas(G.gallery[sl.idx], w, h), x, y, w, h); }
    else { g.fillStyle = pat(g, 'sheet'); g.fillRect(x, y, w, h); renderSheet(g, BLANK, BLANK.h, {x, y, w, h}, {mini:true}); }
    for (const ax of [x, x + w]){ g.fillStyle = ink(1, 0.9); g.fillRect(ax - 3, y - 4, 6, h + 8); }
    if (sl.idx === newest && sl.idx >= 0){
      const a = 0.25 + 0.15 * Math.sin(t * 4);
      g.strokeStyle = 'rgba(255,250,236,' + (a + 0.3) + ')'; g.lineWidth = 6; g.strokeRect(x - 9, y - 9, w + 18, h + 18);
      g.strokeStyle = ink(3, a); g.lineWidth = 2; g.strokeRect(x - 13, y - 13, w + 26, h + 26);
    }
  }
  // 子は新しい巻物を指す
  const s = LY.sheet, ch = s.h * 0.18;
  const tgt = slots[Math.max(0, newest)], cx = s.left + s.fullW * (LY.port ? 0.5 : 0.5), cy = s.y + s.h + ch * 0.05;
  if (LY.port || true){
    const hand = drawChild(g, null, Math.min(s.right - ch * 0.4, cx), cy, ch, {look:{x:Math.sign(tgt.x + tgt.w / 2 - cx), y:-1}, pointTo:{x:tgt.x + tgt.w / 2 - cx, y:tgt.y + tgt.h / 2 - cy}, face:1});
    drawBrush(g, hand.hx, hand.hy, hand.hx + ch * 0.25, hand.hy - ch * 0.9, ch * 0.7);
  }
}
const BLANK = newSheet();

// ---------------- ループ ----------------
let raf = 0, running = false;
function frame(ts){
  raf = requestAnimationFrame(frame);
  const real = ts / 1000; let dt = real - lastReal; lastReal = real;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  G.t += dt;
  update(dt); draw();
}
function start(){ if (running) return; running = true; lastReal = performance.now() / 1000; raf = requestAnimationFrame(frame); }
function stop(){ running = false; cancelAnimationFrame(raf); lastPtr.clear(); }
window.addEventListener('blur', () => lastPtr.clear());
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ stop(); try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
  else { try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {} start(); }
});
window.addEventListener('pagehide', () => stop());
window.addEventListener('pageshow', () => { if (!document.hidden) start(); });
let rzT = 0;
function onResize(){ clearTimeout(rzT); rzT = setTimeout(() => { layout(); }, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

startSong(newSheet());
layout();
G.lastInput = 0;
start();

// 自動テスト用の読み取り口（画面には何も出さない）
window.__sumi = {
  G, LY,
  drum(name){ const d = LY[name]; return {x:d.x, y:d.y + d.R * 0.1}; },
  slots(){ return gallerySlots(); },
  lakes(){ return lakeSpans(G.sheet); },
  bench(n){ const a = performance.now(); for (let i = 0; i < (n || 10); i++){ draw(); } const b = performance.now(); for (let i = 0; i < (n || 10); i++){ G.dirty = true; draw(); } return {draw:(b - a) / (n || 10), drawDirty:(performance.now() - b) / (n || 10)}; },
  beatInfo(){ return {T:songCfg().T, t0:G.beatT0, now:now()}; }
};
})();
